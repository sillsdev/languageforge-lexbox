name: Release pipeline
# Releases LexBox and FW Lite from one manual dispatch, sharing a single version.
on:
  workflow_dispatch:
    inputs:
      release-lexbox:
        description: 'Release LexBox (build, deploy staging + production)'
        type: boolean
        default: true
      release-fw-lite:
        description: 'Release FW Lite (build, sign, GitHub + Play Store release)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  checks: write

env:
  # The only branch a release may be dispatched from.
  RELEASE_BRANCH: develop

jobs:
  set-version:
    name: Set Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setVersion.outputs.VERSION }}
      semver-version: ${{ steps.setVersion.outputs.SEMVER_VERSION }}
    steps:
      - name: Check release branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$RELEASE_BRANCH" ]; then
            echo "::error::Releases must be dispatched from $RELEASE_BRANCH, not $GITHUB_REF"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Version
        id: setVersion
        # Based on the commit's date (UTC) so re-runs keep the same version.
        # version: vYYYY-MM-DD-commitSha, semver version: YYYY.M.D
        run: |
          shortSha=$(echo "$GITHUB_SHA" | cut -c1-8)
          echo "VERSION=v$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%d HEAD)-$shortSha" >> "$GITHUB_OUTPUT"
          echo "SEMVER_VERSION=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%-m.%-d HEAD)" >> "$GITHUB_OUTPUT"
  build-api:
    name: Build API
    needs: [ set-version ]
    if: inputs.release-lexbox
    uses: ./.github/workflows/lexbox-api.yaml
    with:
      version: ${{ needs.set-version.outputs.version }}
      label-latest: true

  build-ui:
    name: Build UI
    needs: [ set-version ]
    if: inputs.release-lexbox
    uses: ./.github/workflows/lexbox-ui.yaml
    with:
      version: ${{ needs.set-version.outputs.version }}
      label-latest: true

  build-hgweb:
    name: Build hgweb
    needs: [ set-version ]
    if: inputs.release-lexbox
    uses: ./.github/workflows/lexbox-hgweb.yaml
    with:
      version: ${{ needs.set-version.outputs.version }}
      label-latest: true

  build-fw-headless:
    name: Build fw-headless
    needs: [ set-version ]
    if: inputs.release-lexbox
    uses: ./.github/workflows/lexbox-fw-headless.yaml
    with:
      version: ${{ needs.set-version.outputs.version }}
      label-latest: true

  deploy:
    name: Deploy Staging
    uses: ./.github/workflows/deploy.yaml
    needs: [ build-api, build-ui, build-hgweb, build-fw-headless, set-version ]
    secrets: inherit
    with:
      version: ${{ needs.set-version.outputs.version }}
      image: 'ghcr.io/sillsdev/lexbox-*'
      k8s-environment: staging
      deploy-domain: staging.languagedepot.org

  integration-tests:
    name: Integration tests
    uses: ./.github/workflows/integration-test.yaml
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - windows-latest
        hg-version:
          - '3'
          - '6'
#        include:
#          - run-playwright: false
    needs: deploy
    permissions:
      checks: write
      contents: read
    secrets: inherit
    with:
      environment: staging
      runs-on: ${{ matrix.runs-on }}
      hg-version: ${{ matrix.hg-version }}
#      run-playwright: ${{ matrix.run-playwright }}

  deploy-prod:
    name: Deploy Production
    uses: ./.github/workflows/deploy.yaml
    needs: [ integration-tests, set-version ]
    # we want to allow deployment even if some tests fail because they are currently flaky
    if: ${{ !cancelled() && (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'failure') }}
    secrets: inherit
    with:
      version: ${{ needs.set-version.outputs.version }}
      image: 'ghcr.io/sillsdev/lexbox-*'
      k8s-environment: production
      deploy-domain: languagedepot.org

  generate-release:
    name: Generate Release
    needs: [ deploy-prod, set-version ]
    # we want to generate a release when deployment succeeds, by default this would be cancelled if integration tests failed
    if: ${{ !cancelled() && needs.deploy-prod.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate release notes
        id: notes
        uses: ./.github/actions/release-notes
        with:
          tag: lexbox-${{ needs.set-version.outputs.version }}
          # Before the split, Lexbox and FW Lite shared bare v* releases.
          previous-tag-prefixes: lexbox-v v20
          config: .github/release-lexbox.yml
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: lexbox-${{ needs.set-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.notes-file }}
          # Keep /releases/latest pointing at FW Lite, the product people download.
          make_latest: false

  # Runs in parallel with the LexBox release; it shares the version but neither blocks the other.
  fw-lite:
    name: FW Lite
    needs: [ set-version ]
    if: inputs.release-fw-lite
    uses: ./.github/workflows/fw-lite.yaml
    secrets: inherit
    # the caller caps the called workflow's token: create-release needs contents: write
    permissions:
      contents: write
      checks: write
    with:
      version: ${{ needs.set-version.outputs.version }}
      semver-version: ${{ needs.set-version.outputs.semver-version }}
      release: true
