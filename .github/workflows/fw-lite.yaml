name: FieldWorks Lite
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/FwLite/**'
      - 'backend/Directory.Packages.props'
      - 'backend/Harmony*.props'
      - 'frontend/viewer/**'
      - '.github/workflows/fw-lite.yaml'
      - '.github/actions/setup-k8s/**'
      - 'FwLiteCore.slnf'
      - 'FwLiteOnly.slnf'
    branches:
      - develop
      - main
  pull_request:
    paths:
      - 'backend/FwLite/**'
      - 'backend/Directory.Packages.props'
      - 'backend/Harmony*.props'
      - 'frontend/viewer/**'
      - '.github/workflows/fw-lite.yaml'
      - '.github/actions/setup-k8s/**'
      - 'FwLiteCore.slnf'
      - 'FwLiteOnly.slnf'
    branches:
      - develop
      - main
      - feat/sync-morph-types #just for now ensure PRs to this branch have checks run

# Only cancel superseded PR runs; never cancel release builds triggered by a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VIEWER_BUILD_OUTPUT_DIR: backend/FwLite/FwLiteShared/wwwroot/viewer
jobs:
  build-and-test:
    name: Build FW Lite and run tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setVersion.outputs.VERSION }}
      semver-version: ${{ steps.setVersion.outputs.SEMVER_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/Harmony*.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Version
        id: setVersion
        shell: bash
        # set version to date in vYYYY-MM-DD-commitSha format, and semver version to YYYY.MM.DD
        run: |
          shortSha=$(echo ${{ github.sha }} | cut -c1-8)
          echo "VERSION=v$(date --rfc-3339=date)-$shortSha" >> ${GITHUB_OUTPUT}
          echo "SEMVER_VERSION=$(date +%Y.%-m.%-d)" >> ${GITHUB_OUTPUT}

      - name: Dotnet build
        # FwLiteCore.slnf omits MAUI projects — those build and test on publish-win (Windows).
        run: dotnet build FwLiteCore.slnf -p:BuildAndroid=false

      - name: Check for pending EF model changes
        run: task fw-lite:has-pending-model-changes -- --no-build

      - name: Check for stale generated TypeScript types
        run: task fw-lite:has-stale-generated-types -- --no-build

      - name: Dotnet test
        # Benchmarks run in a separate Release-mode job — see `benchmark` below.
        # MAUI tests run in publish-win. `trx` logger writes result files for the TestHistory
        # upload below; --results-directory collects one .trx per test project into a single folder.
        #
        # TZ forces a non-UTC timezone so date bugs are observable: on UTC the error equals the
        # local offset, which is zero and hides bugs (see #2092). Eastern is non-UTC, observes DST,
        # and has a negative offset. We set TZ instead of `timedatectl set-timezone` because hosted
        # runners no longer allow it ("Failed to set time zone: Access denied"); .NET honours TZ for
        # TimeZoneInfo.Local on Linux, so this needs no privileges and only affects the tests.
        env:
          TZ: America/New_York
        run: dotnet test FwLiteCore.slnf --logger GitHubActions --logger trx --results-directory "${{ github.workspace }}/TestResults" --no-build -p:BuildAndroid=false --filter "Category!=Benchmark"

      - name: Publish test results to TestHistory
        if: always()
        continue-on-error: true # telemetry only — a TestHistory outage must not fail the build
        uses: hahn-kev/TestHistory/.github/actions/upload-results@e5fc439cd7644a145c7553bc3b0077aa643aef8d # master
        with:
          server-url: ${{ vars.TESTHISTORY_SERVER_URL }}
          project-id: ${{ vars.TESTHISTORY_FWLITE_PROJECT_ID }}
          api-token: ${{ secrets.TESTHISTORY_API_TOKEN }}
          files: TestResults/**/*.trx
          label: FW Lite .NET
          on-no-files: ignore # build may fail before any tests run

  benchmark:
    name: Run FW Lite sync benchmarks
    # Auto-runs post-merge on develop only — too slow and variance-prone to gate every PR (revisit
    # if they get fast enough). Also runnable on demand via workflow_dispatch to baseline a branch.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    # Benchmarks take tens of minutes; 60 leaves headroom for hosted-runner variance.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Dotnet build (Release)
        run: dotnet build backend/FwLite/FwLiteProjectSync.Tests/FwLiteProjectSync.Tests.csproj -c Release

      - name: Dotnet test (benchmarks)
        run: dotnet test backend/FwLite/FwLiteProjectSync.Tests/FwLiteProjectSync.Tests.csproj -c Release --logger GitHubActions --no-build --filter "Category=Benchmark"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: '**/BenchmarkDotNet.Artifacts/**'
          # warn, not error: with if: always() a build/crash failure emits no artifacts, and the real
          # failure is already red elsewhere — a threshold-assertion failure still writes artifacts first.
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: 'frontend/package.json'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: './frontend/package.json'
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare frontend
        working-directory: frontend
        run: |
          pnpm install
      - name: Ensure all i18n strings have been extracted
        working-directory: frontend/viewer
        shell: bash
        run: |
          set -e
          # GHA sets -o pipefail when shell is bash but we want to turn it off
          set +o pipefail
          rm -f src/locales/en.po.old
          cp src/locales/en.po src/locales/en.po.old
          pnpm i18n:extract
          DIFFCOUNT=$(diff -u src/locales/en.po{.old,} | grep '+msgid' | wc -l)
          if [ $DIFFCOUNT -gt 0 ]; then
            # Unextracted strings found, fail the build
            echo '***'
            echo $DIFFCOUNT unextracted strings found:
            echo '***'
            diff -u src/locales/en.po{.old,} | grep '+msgid' | cut -c2-
            echo '***'
            echo Please run pnpm i18n:extract
            exit 1
          fi
          rm -f src/locales/en.po.old
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium webkit
      - name: Run UI tests
        working-directory: frontend/viewer
        run: task test:ui-standalone
      - name: Publish test results to TestHistory
        if: always() # run even when the UI tests above failed
        continue-on-error: true # telemetry only — a TestHistory outage must not fail the build
        uses: hahn-kev/TestHistory/.github/actions/upload-results@e5fc439cd7644a145c7553bc3b0077aa643aef8d # master
        with:
          server-url: ${{ vars.TESTHISTORY_SERVER_URL }}
          project-id: ${{ vars.TESTHISTORY_FWLITE_PROJECT_ID }}
          api-token: ${{ secrets.TESTHISTORY_API_TOKEN }}
          files: frontend/viewer/tests/ui/test-results/results.xml
          label: FW Lite Viewer UI
          on-no-files: ignore

      - name: Build viewer
        working-directory: frontend/viewer
        run: pnpm run build

      - name: Check code formatting with Prettier
        working-directory: frontend/viewer
        run: pnpm run format:check

      - name: Upload viewer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fw-lite-viewer-js
          if-no-files-found: error
          path: ${{ env.VIEWER_BUILD_OUTPUT_DIR }}

  frontend-component-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: 'frontend/package.json'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: './frontend/package.json'
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'
      - name: Prepare frontend
        working-directory: frontend
        run: |
          pnpm install
        # vitest is configured to use playwright for stories and other browser-based tests
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-firefox-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend/viewer
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend/viewer
        run: pnpm exec playwright install-deps chromium firefox
      - name: vitest
        working-directory: frontend/viewer
        run: pnpm run test --retry=2 --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-results.xml
      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          check_name: UI unit Tests
          files: ./frontend/viewer/test-results/*.xml
          action_fail_on_inconclusive: true
          comment_mode: off
      - name: Publish test results to TestHistory
        if: always()
        continue-on-error: true # telemetry only — a TestHistory outage must not fail the build
        uses: hahn-kev/TestHistory/.github/actions/upload-results@e5fc439cd7644a145c7553bc3b0077aa643aef8d # master
        with:
          server-url: ${{ vars.TESTHISTORY_SERVER_URL }}
          project-id: ${{ vars.TESTHISTORY_FWLITE_PROJECT_ID }}
          api-token: ${{ secrets.TESTHISTORY_API_TOKEN }}
          files: frontend/viewer/test-results/vitest-results.xml
          label: FW Lite Viewer unit
          on-no-files: ignore

  build-apple:
    name: Build FW Lite for iOS simulator; notarize Mac Catalyst
    needs: [build-and-test, frontend]
    timeout-minutes: 60
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      # Mirrors the HAS_SIGNING_KEY pattern in publish-android (fork PRs get no secrets → unsigned).
      HAS_APPLE_SIGNING: ${{ secrets.SIL_APPLE_DEVELOPER_ID_APPLICATION_CERT_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fw-lite-viewer-js
          path: ${{ env.VIEWER_BUILD_OUTPUT_DIR }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
      - name: Setup Maui
        run: dotnet workload install maui-ios maui-maccatalyst

      # The iOS build targets the simulator (ad-hoc signed, see FwLiteMaui.csproj); there is no iOS
      # device signing here yet. Mac Catalyst is signed with the SIL Developer ID and notarized into a
      # DMG when the signing secret is present (upstream), and built unsigned otherwise (fork PRs).
      # Both run the Mono interpreter with SDK-only linking in Release, matching what was verified on device.
      - name: Build iOS (simulator)
        working-directory: backend/FwLite/FwLiteMaui
        run: |
          dotnet build -f net10.0-ios -c Release -p:BuildAndroid=false -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:ApplicationDisplayVersion=${{ needs.build-and-test.outputs.semver-version }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:InformationalVersion=${{ needs.build-and-test.outputs.version }}

      # Fork PRs have no signing secret: build unsigned so the job stays a compile check.
      - name: Build Mac Catalyst (unsigned)
        if: env.HAS_APPLE_SIGNING != 'true'
        working-directory: backend/FwLite/FwLiteMaui
        run: |
          dotnet build -f net10.0-maccatalyst -c Release -p:BuildAndroid=false -p:RuntimeIdentifier=maccatalyst-arm64 \
            -p:ApplicationDisplayVersion=${{ needs.build-and-test.outputs.semver-version }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:InformationalVersion=${{ needs.build-and-test.outputs.version }}

      - name: Import Developer ID signing certificate
        id: signing
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          CERT_URL: ${{ secrets.SIL_APPLE_DEVELOPER_ID_APPLICATION_CERT_URL }}
          CERT_PASSWORD: ${{ secrets.SIL_APPLE_DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/fw-lite-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          curl -fSL "$CERT_URL" -o "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend our keychain to the search list so the build finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          # Use the certificate's SHA-1 hash, not the display name: the SIL identity name contains a
          # comma ("...Linguistics, Inc..."), and MSBuild splits -p:CodesignKey=<value> on commas
          # (error MSB1006: Property is not valid). The hash has no spaces/commas; codesign -s and
          # MSBuild's CodesignKey both accept it.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the certificate" >&2; exit 1; fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/devid.p12"

      # Universal (x86_64 + arm64) so the DMG runs on both Intel and Apple Silicon. The two RIDs come
      # from RuntimeIdentifiers in FwLiteMaui.csproj (Release + maccatalyst): passing them here as a
      # global -p: property instead leaks the multi-RID value into referenced libraries (NETSDK1083),
      # so we deliberately pass no RuntimeIdentifier and let the csproj drive the universal build.
      # Hardened runtime is required for notarization; Entitlements.DeveloperId.plist grants the
      # executable-memory / library-validation exceptions the .NET interpreter needs to launch under it.
      - name: Build and sign Mac Catalyst (universal, Developer ID, hardened runtime)
        if: env.HAS_APPLE_SIGNING == 'true'
        working-directory: backend/FwLite/FwLiteMaui
        run: |
          dotnet build -f net10.0-maccatalyst -c Release -p:BuildAndroid=false \
            -p:EnableCodeSigning=true -p:UseHardenedRuntime=true \
            -p:CodesignKey="$CODESIGN_IDENTITY" \
            -p:CodesignEntitlements=Platforms/MacCatalyst/Entitlements.DeveloperId.plist \
            -p:ApplicationDisplayVersion=${{ needs.build-and-test.outputs.semver-version }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:InformationalVersion=${{ needs.build-and-test.outputs.version }}

      - name: Package, notarize and staple the DMG
        if: env.HAS_APPLE_SIGNING == 'true'
        working-directory: backend/FwLite/FwLiteMaui
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_APPSTORECONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_APPSTORECONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPLE_APPSTORECONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # The SDK merges and signs the universal bundle here; the maccatalyst-*/ bundles are incomplete intermediates.
          APP="bin/Release/net10.0-maccatalyst/FieldWorks Lite.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for f in index.html _content/FwLiteShared/viewer/main.js; do
            [ -f "$APP/Contents/Resources/wwwroot/$f" ] || { echo "Missing wwwroot/$f in $APP" >&2; exit 1; }
          done
          # Fail loudly if the merged bundle isn't actually universal — the whole point is Intel + Apple Silicon.
          EXE="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          ARCHS="$(lipo -archs "$EXE" 2>/dev/null || true)"
          echo "Universal app archs: $ARCHS"
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "Expected a universal (x86_64 + arm64) build but got: '$ARCHS'" >&2; exit 1 ;;
          esac
          mkdir -p ../artifacts/apple
          DMG="$PWD/../artifacts/apple/FieldWorksLite.dmg"
          # Stage the app beside an /Applications symlink so the DMG is drag-to-install.
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "FieldWorks Lite" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "$DMG"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc.p8"
          # submit --wait exits 0 even when the result is Invalid, so capture the id, always print the
          # detailed notary log (the only place the actual rejection reasons appear), then gate on status.
          SUBMIT_JSON="$(xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --output-format json)"
          echo "$SUBMIT_JSON"
          SUBMIT_ID="$(echo "$SUBMIT_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')"
          xcrun notarytool log "$SUBMIT_ID" --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
          STATUS="$(echo "$SUBMIT_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')"
          rm -f "$RUNNER_TEMP/asc.p8"
          if [ "$STATUS" != "Accepted" ]; then echo "Notarization failed with status: $STATUS" >&2; exit 1; fi
          xcrun stapler staple "$DMG"

      # upload-artifact drops executable bits, so zip the .app bundles with ditto first.
      - name: Zip app bundles
        working-directory: backend/FwLite/FwLiteMaui
        run: |
          mkdir -p ../artifacts/apple
          ditto -c -k --keepParent "bin/Release/net10.0-ios/iossimulator-arm64/FwLiteMaui.app" ../artifacts/apple/fw-lite-ios-simulator.zip
          if [ "$HAS_APPLE_SIGNING" != 'true' ]; then
            ditto -c -k --keepParent "bin/Release/net10.0-maccatalyst/maccatalyst-arm64/FieldWorks Lite.app" ../artifacts/apple/fw-lite-maccatalyst.zip
          fi

      - name: Remove temporary signing keychain
        if: ${{ always() && env.HAS_APPLE_SIGNING == 'true' }}
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

      - name: Upload Apple app bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fw-lite-apple
          if-no-files-found: error
          path: backend/FwLite/artifacts/apple/*

  # Opens the notarized DMG the way a user would, natively on each CPU the universal app supports.
  launch-mac:
    name: Launch the Mac DMG (${{ matrix.arch }})
    needs: build-apple
    if: needs.build-apple.outputs.signed == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fw-lite-apple

      - name: Check Gatekeeper accepts the DMG and the app
        run: |
          set -euo pipefail
          # -vv names what the verdict is based on; require notarization, not just a valid signature.
          gatekeeper() {
            local out; out="$(spctl --assess -vv "$@" 2>&1)" || true
            echo "$out"
            [[ "$out" == *": accepted"* && "$out" == *"source=Notarized Developer ID"* ]]
          }
          xcrun stapler validate FieldWorksLite.dmg
          gatekeeper --type open --context context:primary-signature FieldWorksLite.dmg
          hdiutil attach FieldWorksLite.dmg -nobrowse -readonly -mountpoint /Volumes/FieldWorksLite
          gatekeeper --type execute "/Volumes/FieldWorksLite/FieldWorks Lite.app"

      - name: Launch the app and wait for the viewer to load
        run: |
          set -euo pipefail
          echo "Runner CPU: $(uname -m)"
          OUT="$RUNNER_TEMP/stdout.log"
          # The app is sandboxed, so its app.log lands in its container.
          CONTAINER="$HOME/Library/Containers/org.sil.FwLiteMaui"
          "/Volumes/FieldWorksLite/FieldWorks Lite.app/Contents/MacOS/FwLiteMaui" > "$OUT" 2>&1 &
          PID=$!
          for _ in $(seq 120); do
            grep -rqs 'Viewer loaded' "$OUT" "$CONTAINER" && break
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          cat "$OUT"
          find "$CONTAINER" -name 'app*.log' -exec cat {} + 2>/dev/null || true
          grep -rqs 'Viewer loaded' "$OUT" "$CONTAINER" || { echo "The app never logged 'Viewer loaded'" >&2; exit 1; }

  publish-linux:
    name: Publish FW Lite app for Linux
    needs: [ build-and-test, frontend ]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fw-lite-viewer-js
          path: ${{ env.VIEWER_BUILD_OUTPUT_DIR }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Publish Linux
        working-directory: backend/FwLite/FwLiteWeb
        run: |
            dotnet publish -r linux-x64 --artifacts-path ../artifacts -p:PublishSingleFile=true -p:Version=${{ needs.build-and-test.outputs.semver-version }}
            dotnet publish -r linux-arm64 --artifacts-path ../artifacts -p:PublishSingleFile=true -p:Version=${{ needs.build-and-test.outputs.semver-version }}

      - name: Test Linux executable
        working-directory: backend/FwLite/artifacts/publish/FwLiteWeb/release_linux-x64
        run: |
            set +e
            chmod +x ./FwLiteWeb
            output=$(timeout 10s ./FwLiteWeb 2>&1)
            exit_code=$?
            if [ $exit_code -eq 124 ] || [ $exit_code -eq 0 ]; then
              echo "✅ Linux executable ran without crashing for 10s"
            else
              echo "❌ Linux executable exited with code $exit_code"
              echo "$output"
              exit 1
            fi

      - name: Upload FWLite Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fw-lite-web-linux
          if-no-files-found: error
          path: backend/FwLite/artifacts/publish/FwLiteWeb/*

  publish-android:
    name: Publish FW Lite app for Android
    needs: [ build-and-test, frontend ]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # Signing secrets/vars aren't exposed to workflows triggered from a fork PR,
      # so on those runs we build an unsigned APK instead of failing the job.
      HAS_SIGNING_KEY: ${{ secrets.FW_LITE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fw-lite-viewer-js
          path: ${{ env.VIEWER_BUILD_OUTPUT_DIR }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Setup Maui
        run: dotnet workload install maui-android
      - name: Decode Android Keystore
        id: decodeKeystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.FW_LITE_KEYSTORE_BASE64 }}
        run: |
          echo "KEYSTORE_PATH=${RUNNER_TEMP}/keystore.jks" >> ${GITHUB_OUTPUT}
          base64 -d <<< "$KEYSTORE_BASE64" > ${RUNNER_TEMP}/keystore.jks

      - name: Publish Android (signed)
        if: env.HAS_SIGNING_KEY == 'true'
        working-directory: backend/FwLite/FwLiteMaui
        env:
          KEYSTORE_PATH: ${{ steps.decodeKeystore.outputs.KEYSTORE_PATH }}
          KEYSTORE_PASS: ${{ secrets.FW_LITE_KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ vars.FW_LITE_KEYSTORE_UPLOAD_KEY_ALIAS }}
        run: |
          dotnet publish -f net10.0-android -p:BuildApple=false --artifacts-path ../artifacts \
            -p:ApplicationDisplayVersion=${{ needs.build-and-test.outputs.semver-version }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:InformationalVersion=${{ needs.build-and-test.outputs.version }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=${KEYSTORE_PATH} \
            -p:AndroidSigningKeyPass=env:KEYSTORE_PASS \
            -p:AndroidSigningStorePass=env:KEYSTORE_PASS \
            -p:AndroidSigningKeyAlias=${KEYSTORE_ALIAS}
          rm ${KEYSTORE_PATH}

      - name: Publish Android (unsigned)
        # Fork PRs have no access to the signing key; build an unsigned APK so the job still validates the Android build.
        if: env.HAS_SIGNING_KEY != 'true'
        working-directory: backend/FwLite/FwLiteMaui
        run: |
          echo "::warning::Signing key unavailable (likely a fork PR); building an unsigned Android APK."
          dotnet publish -f net10.0-android -p:BuildApple=false --artifacts-path ../artifacts \
            -p:ApplicationDisplayVersion=${{ needs.build-and-test.outputs.semver-version }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:InformationalVersion=${{ needs.build-and-test.outputs.version }} \
            -p:AndroidKeyStore=false

      - name: Upload FWLite App artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fw-lite-android
          if-no-files-found: error
#          path looks like this: backend/FwLite/artifacts/publish/FwLiteMaui/release_net10.0-android/org.sil.fwlitemaui-signed.apk
          path: backend/FwLite/artifacts/publish/FwLiteMaui/release_net10.0-android/*

  publish-win:
    name: Publish FW Lite app for Windows
    needs: [ build-and-test, frontend ]
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fw-lite-viewer-js
          path: ${{ env.VIEWER_BUILD_OUTPUT_DIR }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/Harmony*.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup Maui
        run: dotnet workload install maui-windows

      - name: Build MAUI tests
        run: dotnet build backend/FwLite/FwLiteMaui.Tests/FwLiteMaui.Tests.csproj -p:BuildAndroid=false

      - name: Test MAUI
        run: dotnet test backend/FwLite/FwLiteMaui.Tests/FwLiteMaui.Tests.csproj --logger GitHubActions --logger trx --results-directory "${{ github.workspace }}/TestResults" --no-build -p:BuildAndroid=false

      - name: Publish MAUI test results to TestHistory
        if: always()
        continue-on-error: true # telemetry only
        uses: hahn-kev/TestHistory/.github/actions/upload-results@e5fc439cd7644a145c7553bc3b0077aa643aef8d # master
        with:
          server-url: ${{ vars.TESTHISTORY_SERVER_URL }}
          project-id: ${{ vars.TESTHISTORY_FWLITE_PROJECT_ID }}
          api-token: ${{ secrets.TESTHISTORY_API_TOKEN }}
          files: TestResults/**/*.trx
          label: FW Lite MAUI Windows
          on-no-files: ignore
      - name: Publish Windows MAUI portable app
        working-directory: backend/FwLite/FwLiteMaui
        run: |
          dotnet publish -f net10.0-windows10.0.19041.0 -p:BuildAndroid=false --artifacts-path ../artifacts -p:WindowsPackageType=None -p:ApplicationDisplayVersion=${{ needs.build-and-test.outputs.semver-version }} -p:InformationalVersion=${{ needs.build-and-test.outputs.version }}
          mkdir -p ../artifacts/sign/portable
          cp -r ../artifacts/publish/FwLiteMaui/* ../artifacts/sign/portable/

      - name: Publish Windows MAUI msix app
        working-directory: backend/FwLite/FwLiteMaui
        run: |
          # AppxPackageDir is the MSIX-targets equivalent of --artifacts-path: without it
          # MAUI 10 writes AppPackages to $(MSBuildProjectDirectory)/AppPackages, ignoring
          # --artifacts-path. Redirect it under artifacts/ so everything lives in one tree.
          dotnet publish -f net10.0-windows10.0.19041.0 -p:BuildAndroid=false --artifacts-path ../artifacts -p:AppxPackageDir=../artifacts/AppPackages/ -p:ApplicationDisplayVersion=${{ needs.build-and-test.outputs.semver-version }} -p:InformationalVersion=${{ needs.build-and-test.outputs.version }}
          mkdir -p ../artifacts/msix
          cp ../artifacts/AppPackages/*/*.msix ../artifacts/msix/

      - name: Bundle MSIX
        working-directory: backend/FwLite/artifacts/msix
        shell: pwsh
        run: |
          $SdkVersion = '10.0.26100.0'
          $Architecture = 'x86'
          $sdkToolsPath = Join-Path -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -ChildPath $SdkVersion -AdditionalChildPath $Architecture
          $env:Path += ";$sdkToolsPath"

          MakeAppx.exe bundle /v /bv ${{ needs.build-and-test.outputs.semver-version }}.1 /d . /p ../sign/FwLiteMaui.msixbundle

      - name: Sign with Trusted Signing
        if: ${{ github.ref_name == 'develop' || github.ref_name == 'main' }}
        uses: sillsdev/codesign/trusted-signing-action@0485c27c94116d62f80febc468cc1979ed7245de # v3.2.0
        with:
          credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
          files-folder: ${{ github.workspace }}/backend/FwLite/artifacts/sign
          files-folder-filter: msixbundle,exe
          files-folder-recurse: true
          files-folder-depth: 4
          description:  'Release for version ${{ needs.build-and-test.outputs.version }} from branch ${{ github.ref_name || github.head_ref }}'
          description-url: 'https://github.com/sillsdev/languageforge-lexbox'

      - name: Launch the portable app and wait for the viewer to load
        shell: pwsh
        run: |
          $exe = Get-ChildItem backend/FwLite/artifacts/sign/portable -Recurse -Filter FwLiteMaui.exe | Select-Object -First 1
          if (-not $exe) { throw 'FwLiteMaui.exe not found in the portable publish output' }
          $env:FwLiteMaui__BaseDataDir = Join-Path $env:RUNNER_TEMP 'fwlite-data'
          $log = Join-Path $env:FwLiteMaui__BaseDataDir 'app.log'
          $app = Start-Process -FilePath $exe.FullName -PassThru
          $loaded = $false
          for ($i = 0; $i -lt 120 -and -not $app.HasExited; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Viewer loaded' -Quiet)) { $loaded = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          if (Test-Path $log) { Get-Content $log }
          if (-not $loaded) { throw "The app never logged 'Viewer loaded'" }

      - name: Upload FWLite Portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fw-lite-portable
          if-no-files-found: error
          path: backend/FwLite/artifacts/sign/portable/*

      - name: Upload FWLite MSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fw-lite-msix
          if-no-files-found: error
          path: backend/FwLite/artifacts/sign/*.msixbundle

  create-release:
    if: ${{ github.ref_name == 'main' }}
    environment:
      name: production
      url: https://lexbox.org/fw-lite
    name: Create Release
    needs: [ build-and-test, publish-win, publish-linux, build-apple, launch-mac, publish-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # secrets aren't allowed directly in step `if:`, so surface presence as an env var (mirrors HAS_SIGNING_KEY above).
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.FW_LITE_PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fw-lite-msix
          path: fw-lite-msix
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fw-lite-portable
          path: fw-lite-portable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fw-lite-web-linux
          path: fw-lite-web-linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fw-lite-android
          path: fw-lite-android
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fw-lite-apple
          path: fw-lite-apple

      - name: Zip artifacts
        run: |
          zip -r fw-lite-portable.zip fw-lite-portable
          chmod +x fw-lite-web-linux/*/FwLiteWeb fw-lite-web-linux/*/*.sh
          zip -r fw-lite-web-linux.zip fw-lite-web-linux
      - name: Rename Installer
        run: |
          mv fw-lite-msix/FwLiteMaui.msixbundle fw-lite-msix/FieldWorksLiteInstaller.msixbundle

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build-and-test.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            fw-lite-msix/*
            fw-lite-portable.zip
            fw-lite-web-linux.zip
            fw-lite-android/*.apk
            fw-lite-android/*.aab
            fw-lite-apple/*.dmg

      - name: Write Play Store release notes
        # The upload action reads notes from files (whatsnew-<locale>, max 500 chars); write it inline here.
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        run: |
          mkdir -p whatsnew
          cat > whatsnew/whatsnew-en-US <<'EOF'
          Bug fixes and improvements.

          Full release notes: https://community.software.sil.org/t/10807
          EOF

      - name: Upload to Play Store (beta)
        # Uploads the upload-key-signed AAB (Play App Signing re-signs with the app key).
        # Guarded on the secret so the release job stays green if the service account isn't configured.
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.FW_LITE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.sil.FwLiteMaui
          releaseFiles: fw-lite-android/org.sil.FwLiteMaui-Signed.aab
          tracks: beta
          status: completed
          releaseName: ${{ needs.build-and-test.outputs.version }}
          whatsNewDirectory: whatsnew

      - name: Invalidate Lexbox Release endpoint
        continue-on-error: true
        run: |
          sleep 10
          curl -X POST https://lexbox.org/api/fwlite-release/new-release


  e2e-test:
    name: E2E Tests
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FW_LITE_BINARY_PATH: ${{ github.workspace }}/backend/FwLite/artifacts/publish/FwLiteWeb/release_linux-x64/FwLiteWeb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fw-lite-viewer-js
          path: ${{ env.VIEWER_BUILD_OUTPUT_DIR }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
      - name: Publish FwLiteWeb (linux-x64)
        working-directory: backend/FwLite/FwLiteWeb
        run: dotnet publish -r linux-x64 --artifacts-path ../artifacts -p:PublishSingleFile=true

      - name: set execute permissions
        shell: bash
        run: chmod +x ${{ env.FW_LITE_BINARY_PATH }}

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: 'frontend/package.json'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: './frontend/package.json'
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install
      - name: Test FwLite launcher
        working-directory: frontend/viewer
        # Call vitest directly (not `task test:launcher`) to add the junit reporter for the
        # TestHistory upload below; the task forwards no CLI args. Mirrors the vitest job above.
        run: pnpm run test:launcher --run --reporter=default --reporter=junit --outputFile.junit=test-results/launcher-results.xml
      - name: Publish launcher test results to TestHistory
        if: always() # run even when the launcher tests above failed
        continue-on-error: true # telemetry only — a TestHistory outage must not fail the build
        uses: hahn-kev/TestHistory/.github/actions/upload-results@e5fc439cd7644a145c7553bc3b0077aa643aef8d # master
        with:
          server-url: ${{ vars.TESTHISTORY_SERVER_URL }}
          project-id: ${{ vars.TESTHISTORY_FWLITE_PROJECT_ID }}
          api-token: ${{ secrets.TESTHISTORY_API_TOKEN }}
          files: frontend/viewer/test-results/launcher-results.xml
          label: FW Lite Launcher
          on-no-files: ignore

      - uses: ./.github/actions/setup-k8s
        with:
          lexbox-api-tag: develop
          ingress-controller-port: '6579' # http; only used by the action's own curl-verify step
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # MSAL refuses any non-https authority. ingress-nginx serves a snake-oil
      # cert that FwLite trusts via --environment Development and playwright via
      # ignoreHTTPSErrors.
      - name: Forward ingress HTTPS port
        shell: bash
        run: |
          kubectl port-forward service/ingress-nginx-controller 6580:443 -n languagedepot >/tmp/https-port-forward.log 2>&1 &
          # Wait for the port-forward to actually be listening
          for i in $(seq 1 30); do
            if curl -sk https://localhost:6580 >/dev/null 2>&1; then
              echo "✅ HTTPS port-forward ready on :6580"
              exit 0
            fi
            sleep 1
          done
          echo "❌ HTTPS port-forward did not become ready"
          cat /tmp/https-port-forward.log
          exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend/viewer
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend/viewer
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        working-directory: frontend/viewer
        env:
          TEST_SERVER_PROTOCOL: https
          TEST_SERVER_PORT: 6580
        run: task test:e2e
      - name: Publish E2E test results to TestHistory
        if: always() # run even when the E2E tests above failed
        continue-on-error: true # telemetry only — a TestHistory outage must not fail the build
        uses: hahn-kev/TestHistory/.github/actions/upload-results@e5fc439cd7644a145c7553bc3b0077aa643aef8d # master
        with:
          server-url: ${{ vars.TESTHISTORY_SERVER_URL }}
          project-id: ${{ vars.TESTHISTORY_FWLITE_PROJECT_ID }}
          api-token: ${{ secrets.TESTHISTORY_API_TOKEN }}
          files: frontend/viewer/tests/e2e/test-results/e2e-results.xml
          label: FW Lite E2E
          on-no-files: ignore

      - name: Upload Playwright results/traces (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fw-lite-e2e-test-results
          if-no-files-found: ignore
          path: frontend/viewer/tests/e2e/test-results/

      - name: Capture k8s pod logs (on failure)
        if: failure()
        shell: bash
        run: |
          mkdir -p k8s-logs
          for app in lexbox ui hg db fw-headless; do
            kubectl describe pods -l "app=${app}" -n languagedepot > k8s-logs/describe-${app}.txt 2>&1 || true
            kubectl logs -l "app=${app}" -n languagedepot --prefix --all-containers --tail=-1 > k8s-logs/logs-${app}.txt 2>&1 || true
          done
          kubectl logs -l 'app.kubernetes.io/name=ingress-nginx' -n languagedepot --prefix --all-containers --tail=-1 > k8s-logs/logs-ingress.txt 2>&1 || true

      - name: Upload k8s logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fw-lite-e2e-k8s-logs
          if-no-files-found: ignore
          path: k8s-logs/*.txt
