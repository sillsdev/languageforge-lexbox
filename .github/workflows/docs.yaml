name: Docs
on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
    branches:
      - develop
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: 'docs/package.json'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: './docs/package.json'
          cache: 'pnpm'
          cache-dependency-path: './docs/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Build for this repo's GitHub Pages URL until the docs get a final home
      # (see the url comment in docusaurus.config.ts).
      - run: pnpm build
        env:
          DOCS_URL: https://${{ github.repository_owner }}.github.io
          DOCS_BASE_URL: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ github.ref == 'refs/heads/develop' }}
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.ref == 'refs/heads/develop' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
