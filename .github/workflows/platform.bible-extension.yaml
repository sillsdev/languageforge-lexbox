name: Platform.Bible extension CI/CD
on:
  push:
    paths:
      - "platform.bible-extension/**"
      - ".github/workflows/platform.bible-extension.yaml"
    branches:
      - develop
  pull_request:
    paths:
      - "platform.bible-extension/**"
      - ".github/workflows/platform.bible-extension.yaml"
    branches:
      - develop
  workflow_dispatch:

# Modified from https://github.com/paranext/paranext-extension-template/blob/main/.github/workflows/lint.yml

permissions:
  contents: read

# Keeps an older build from publishing over a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lexbox
          persist-credentials: false

      - name: Checkout paranext-core repo to use its sub-packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: paranext-core
          repository: paranext/paranext-core
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "npm"
          cache-dependency-path: |
            lexbox/platform.bible-extension/package-lock.json
            paranext-core/package-lock.json
          node-version-file: lexbox/platform.bible-extension/package.json

      - name: Install extension dependencies
        working-directory: lexbox/platform.bible-extension
        run: npm ci

      # platform-bible-react imports editor packages from core's gitignored dev-packages/staging/,
      # which only core's preinstall creates, and --ignore-scripts below skips it.
      - name: Stage core's dev packages
        working-directory: paranext-core
        run: npm run stage-dev-packages

      - name: Install core dependencies
        working-directory: paranext-core
        run: npm ci --ignore-scripts

      # Core's postinstall makes this check; --ignore-scripts above skips it.
      - name: Verify core's staged dev packages match its lockfile
        working-directory: paranext-core
        run: npm run verify:dev-packages

      - name: Run format checking
        working-directory: lexbox/platform.bible-extension
        run: npm run format:check

      - name: Run all linters
        working-directory: lexbox/platform.bible-extension
        run: npm run lint

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      core-sha: ${{ steps.core.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lexbox
          persist-credentials: false

      - name: Checkout paranext-core repo to use its sub-packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: paranext-core
          repository: paranext/paranext-core
          persist-credentials: false

      # Core is not pinned, so record which revision the zip was built against.
      - name: Record paranext-core revision
        id: core
        working-directory: paranext-core
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "paranext-core: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.x"

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: lexbox/frontend/package.json

      # The viewer needs the frontend's Node; the extension below pins an older one.
      - name: Setup Node.js for the viewer
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: lexbox/frontend/package.json
          cache: "pnpm"
          cache-dependency-path: lexbox/frontend/pnpm-lock.yaml

      - name: Build the viewer and FW Lite
        working-directory: lexbox/platform.bible-extension
        run: task build-fw-lite

      - name: Setup Node.js for the extension
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "npm"
          cache-dependency-path: |
            lexbox/platform.bible-extension/package-lock.json
            paranext-core/package-lock.json
          node-version-file: lexbox/platform.bible-extension/package.json

      - name: Install extension dependencies
        working-directory: lexbox/platform.bible-extension
        run: npm ci

      # platform-bible-react imports editor packages from core's gitignored dev-packages/staging/,
      # which only core's preinstall creates, and --ignore-scripts below skips it.
      - name: Stage core's dev packages
        working-directory: paranext-core
        run: npm run stage-dev-packages

      - name: Install core dependencies
        working-directory: paranext-core
        run: npm ci --ignore-scripts

      # Core's postinstall makes this check; --ignore-scripts above skips it.
      - name: Verify core's staged dev packages match its lockfile
        working-directory: paranext-core
        run: npm run verify:dev-packages

      - name: Package the extension
        working-directory: lexbox/platform.bible-extension
        run: npm run package

      - name: Read the version
        id: version
        working-directory: lexbox/platform.bible-extension
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload the extension zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lexicon-extension
          if-no-files-found: error
          path: lexbox/platform.bible-extension/release/lexicon_${{ steps.version.outputs.version }}.zip

  publish:
    needs: [lint, package]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: lexicon-v${{ needs.package.outputs.version }}
      VERSION: ${{ needs.package.outputs.version }}
      ZIP: lexicon_${{ needs.package.outputs.version }}.zip
      NOTES: >-
        Platform.Bible Lexicon extension, built from ${{ github.sha }}
        against paranext-core ${{ needs.package.outputs.core-sha }}. Windows and Linux only.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lexicon-extension

      # The version is not bumped on every change, so an existing release for it is updated in place.
      # Recreating it instead would leave nothing to download if a later step failed.
      - name: Publish the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true --silent
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$ZIP" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Lexicon extension $VERSION" \
              --notes "$NOTES"
          fi
