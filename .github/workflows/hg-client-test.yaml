name: Hg Client Tests
run-name: Test hg ${{ inputs.hg-version }} clients on ${{ inputs.runs-on }} against ${{ inputs.environment }}
on:
  workflow_call:
    inputs:
      environment:
        description: 'The environment to test'
        required: true
        type: string
      runs-on:
        description: 'The runner to use'
        required: true
        type: string
      hg-version:
        description: 'The hg client major version to test (3, 6 or 7)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'The environment to test'
        required: true
        type: string
      runs-on:
        description: 'The runner to use'
        required: true
        type: string
      hg-version:
        description: 'The hg client major version to test (3, 6 or 7)'
        required: true
        type: string

jobs:
  hg-client-test:
    timeout-minutes: 120
    name: Hg ${{ inputs.hg-version }} client tests on ${{ inputs.runs-on }} against ${{ inputs.environment }}
    permissions:
      contents: read
      checks: write
    environment:
      name: ${{ inputs.environment }}
    runs-on: ${{ inputs.runs-on }}
    env:
      # Read by MSBuild as a property: picks the hg and the LibChorus/LfMergeBridge paired with it.
      MercurialVersion: ${{ inputs.hg-version }}
      TEST_EXPECTED_HG_VERSION: ${{ inputs.hg-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
      - uses: MatteoH2O1999/setup-python@429b7dee8a48c31eb72ce0b420ea938ff51c2f11 # v3.2.1
        id: python
        if: ${{ runner.os == 'Linux' && !env.act && inputs.hg-version == '3' }}
        with:
          python-version: '2.7.18'
          cache-build: true
          allow-build: allow
      - name: Link python
        if: ${{ runner.os == 'Linux' && inputs.hg-version == '3' }}
        run: |
          sudo ln -s ${{ steps.python.outputs.python-path }} /usr/bin/python2
      - name: Build for tests
        run: dotnet build backend/HgClientTests/HgClientTests.csproj

      - name: Tests (.NET)
        env:
          TEST_SERVER_HOSTNAME: ${{ vars.TEST_SERVER_HOSTNAME }}
          #      this is not a typo, we need to use the lf domain because it has a cert that hg will validate
          TEST_STANDARD_HG_HOSTNAME: ${{ vars.TEST_STANDARD_HG_HOSTNAME }}
          TEST_RESUMABLE_HG_HOSTNAME: ${{ vars.TEST_RESUMABLE_HG_HOSTNAME }}
          TEST_PROJECT_CODE: 'sena-3'
          TEST_DEFAULT_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: dotnet test backend/HgClientTests/HgClientTests.csproj --no-build --logger trx --results-directory ./test-results --filter Category=HgIntegration

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action/composite@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: ${{ always() && !env.act }}
        with:
          check_name: Hg ${{ inputs.hg-version }} Client Tests ${{ inputs.runs-on }}
          files: ./test-results/*.trx
          comment_mode: off
