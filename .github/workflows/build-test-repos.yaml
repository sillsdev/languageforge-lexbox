name: test-repos

# Builds ghcr.io/sillsdev/lexbox-test-repos: a busybox image with the seed
# Mercurial repos (sena-3, elawa-dev-flex, empty-dev-flex) baked into
# /init-repos. The populate-test-repos init container in deployment/init-repos
# extracts them into the hg PVC on startup. Local dev, GHA integration tests,
# develop and staging all reference the :latest tag, so refresh the seed data
# by running this workflow manually.
on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/sillsdev/lexbox-test-repos
  DOCKER_BUILDKIT: 1

jobs:
  build-test-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Download + verify the seed zips. Google Drive is unreliable for
      # automation (quota pages, virus-scan interstitials that return HTML
      # instead of the file), so retry and verify the checksum every time -
      # a bad download fails the workflow here instead of silently shipping a
      # broken image.
      - name: Download seed repos
        run: |
          set -euo pipefail
          mkdir -p data
          download() {
            name="$1"; id="$2"; sha="$3"
            out="data/${name}.zip"
            for attempt in 1 2 3 4 5; do
              echo "Downloading ${name} (attempt ${attempt})..."
              if curl -fsSL --retry 3 --retry-all-errors --max-time 600 -o "$out" \
                   "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"; then
                if echo "${sha}  ${out}" | sha256sum -c --status; then
                  echo "${name} verified."
                  return 0
                fi
                echo "Checksum mismatch for ${name} (got $(sha256sum "$out" | cut -d' ' -f1))."
              fi
              sleep $((attempt * 5))
            done
            echo "::error::Failed to download a valid ${name}.zip after 5 attempts"
            return 1
          }
          download sena-3 1I-hwc0RHoQqW774gbS5qR-GHa1E7BlsS bec5131799db07bf8d84d8fc1f3169fb2574f2a1f4c37f6898eab563a4ae95b8
          download empty  1p73u-AGdSwNkg_5KEv9-4iLRuN-1V-LD f4eb48d2c7b3294dca93965f14f058e56d797f38d562b86cf0372f774e1b486b
          download elawa  1Jk-eSDho8ATBMS-Kmfatwi-MWQth26ro e3608f1e3188ce5fdb166fbf9d5aad06558db68efa079fb453881572b50cb8e3

      - name: Set version
        id: setVersion
        run: |
          shortSha=$(echo ${{ github.sha }} | cut -c1-8)
          echo "VERSION=v$(date --rfc-3339=date)-$shortSha" >> "${GITHUB_OUTPUT}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.setVersion.outputs.VERSION }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: data
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
