# yaml-language-server: $schema=https://json.schemastore.org/dependabot.json
# Dependabot for languageforge-lexbox
# Target: develop | Schedule: weekly Monday
# NuGet and /frontend npm ignore major versions: we upgrade those by hand, so
# the group PRs stay mergeable. (Ignore rules also apply to security updates;
# a fix only shipped in a new major has to be picked up manually.)
# platform.bible-extension is intentionally excluded (separate npm tree).
version: 2
updates:
  # --- NuGet (CPM in backend/Directory.Packages.props; entry via LexBox.slnx) ---
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 15
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # LexboxAnalyzers pins Roslyn <= the Roslyn of the lowest supported SDK/IDE (see its csproj);
      # a newer Microsoft.CodeAnalysis fails to load in older tooling, so bump it by hand.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.CSharp.Workspaces
      - dependency-name: Microsoft.CodeAnalysis.Analyzers
    groups:
      # More specific groups first — earlier matches win.
      maui:
        patterns:
          - Microsoft.Maui*
          - Microsoft.AspNetCore.Components.WebView.Maui
      hotchocolate:
        patterns:
          - HotChocolate*
      sil:
        patterns:
          - SIL.*
      test:
        patterns:
          - xunit*
          - Xunit*
          - FluentAssertions*
          - Moq*
          - Verify*
          - coverlet*
          - GitHubActionsTestLogger*
          - Meziantou.Extensions.Logging.Xunit*
          - Soenneker.Utils.AutoBogus*
          - Microsoft.NET.Test.Sdk
          - BenchmarkDotNet*
      microsoft-dotnet:
        patterns:
          - Microsoft.*
          - System.*
      # Dependabot runs this entry as two discovered directories (/backend for
      # the projects, /.config for dotnet-tools.json). The /.config job sees
      # every CPM package too, and its catch-all swallowed the groups above and
      # superseded their PRs. Excluding them explicitly keeps "other" to the
      # packages no other group claims.
      other:
        patterns:
          - "*"
        exclude-patterns:
          - Microsoft.*
          - System.*
          - HotChocolate*
          - SIL.*
          - xunit*
          - Xunit*
          - FluentAssertions*
          - Moq*
          - Verify*
          - coverlet*
          - GitHubActionsTestLogger*
          - Meziantou.Extensions.Logging.Xunit*
          - Soenneker.Utils.AutoBogus*
          - BenchmarkDotNet*

  # --- pnpm workspace (frontend + viewer + https-proxy) ---
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  # --- Repo-root npm: nx + @nx/dotnet, used only for affected detection (pr.yaml) ---
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      # nx and its plugins must move together (exact pins, same version).
      nx:
        patterns:
          - nx
          - "@nx/*"

  # --- docs site ---
  - package-ecosystem: npm
    directory: /docs/site
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    # Workflows plus composite actions (.github/actions/*/action.y*ml)
    directories: ["/", "/.github/actions/*"]
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: MatteoH2O1999/setup-python # MatteoH2O1999/setup-python is intentionally excluded, newer version's don't support Python 2.7.18
    groups:
      github-actions:
        patterns:
          - "*"

  # --- Docker base images (one entry per Dockerfile directory) ---
  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /hgweb
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend/FwHeadless
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # The dotnet8 stage is pinned for ChorusMerge; dependabot "bumps" it by deleting the stage.
      - dependency-name: mcr.microsoft.com/dotnet/runtime
        update-types:
          - version-update:semver-major
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend/FwLite/FwLiteWeb
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      docker:
        patterns:
          - "*"
