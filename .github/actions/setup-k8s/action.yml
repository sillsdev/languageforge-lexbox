name: Setup and run lexbox k8s
description: Create a local k8s cluster, deploy lexbox to it at the given image tags, and expose its ingress for tests
inputs:
  lexbox-api-tag:
    required: true
  ingress-controller-port:
    required: true
  repo-token:
    required: true

runs:
  using: composite
  steps:
    - name: Install Task
      uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        repo-token: ${{ inputs.repo-token }}
    - run: task setup-local-env
      shell: bash
    - name: setup k8s
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      with:
        config: deployment/gha/kind.yaml
    - name: Verify k8s
      shell: bash
      run: |
        kubectl cluster-info
        kubectl get nodes
    - name: Update image lexbox-api version
      uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
      with:
        cmd: yq eval -i '(.images.[] | select(.name == "ghcr.io/sillsdev/lexbox-api").newTag) = "${{ inputs.lexbox-api-tag }}"' "./deployment/gha/kustomization.yaml"
    # It's also possible that hgweb, fw-headless, and/or ui image may have changed; if so, pull them and update kustomization.yaml for them as well.
    # Swallow a missing tag (path-filter PRs) so the step stays green — continue-on-error still annotates as failure.
    - name: Pull fw-headless if updated
      id: fw-headless_image
      shell: bash
      run: |
        if docker pull ghcr.io/sillsdev/lexbox-fw-headless:${{ inputs.lexbox-api-tag }}; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "fw-headless:${{ inputs.lexbox-api-tag }} not published; keeping kustomize tag"
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Update image fw-headless version
      if: ${{ steps.fw-headless_image.outputs.found == 'true' }}
      uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
      with:
        cmd: yq eval -i '(.images.[] | select(.name == "ghcr.io/sillsdev/lexbox-fw-headless").newTag) = "${{ inputs.lexbox-api-tag }}"' "./deployment/gha/kustomization.yaml"
    - name: Pull hgweb if updated
      id: hgweb_image
      shell: bash
      run: |
        if docker pull ghcr.io/sillsdev/lexbox-hgweb:${{ inputs.lexbox-api-tag }}; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "hgweb:${{ inputs.lexbox-api-tag }} not published; keeping kustomize tag"
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Update image hgweb version
      if: ${{ steps.hgweb_image.outputs.found == 'true' }}
      uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
      with:
        cmd: yq eval -i '(.images.[] | select(.name == "ghcr.io/sillsdev/lexbox-hgweb").newTag) = "${{ inputs.lexbox-api-tag }}"' "./deployment/gha/kustomization.yaml"
    - name: Pull ui if updated
      id: ui_image
      shell: bash
      run: |
        if docker pull ghcr.io/sillsdev/lexbox-ui:${{ inputs.lexbox-api-tag }}; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "ui:${{ inputs.lexbox-api-tag }} not published; keeping kustomize tag"
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Update image ui version
      if: ${{ steps.ui_image.outputs.found == 'true' }}
      uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
      with:
        cmd: yq eval -i '(.images.[] | select(.name == "ghcr.io/sillsdev/lexbox-ui").newTag) = "${{ inputs.lexbox-api-tag }}"' "./deployment/gha/kustomization.yaml"
    - name: deploy
      shell: bash
      run: |
        kubectl create namespace languagedepot
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.0/cert-manager.yaml
        kubectl wait --for=condition=Available --timeout=180s \
          deployment/cert-manager \
          deployment/cert-manager-cainjector \
          deployment/cert-manager-webhook \
          -n cert-manager
        # Pod Available is not enough: cainjector still has to write a CA
        # that matches the webhook serving cert. cmctl dry-runs a
        # CertificateRequest through both admission webhooks until TLS works.
        curl -fsSL -o /tmp/cmctl \
          https://github.com/cert-manager/cmctl/releases/download/v2.5.0/cmctl_linux_amd64
        chmod +x /tmp/cmctl
        sudo mv /tmp/cmctl /usr/local/bin/cmctl
        cmctl check api --wait=2m
        kubectl apply -k ./deployment/gha
        kubectl wait --for=condition=Ready --timeout=120s pod -l 'app.kubernetes.io/component=controller' -n languagedepot
        kubectl wait --for=condition=Ready --timeout=120s pod -l 'app in (lexbox, ui, hg, db, fw-headless)' -n languagedepot
    - name: forward ingress
      shell: bash
      run: |
        kubectl port-forward service/ingress-nginx-controller ${{inputs.ingress-controller-port}}:80 -n languagedepot &
        kubectl port-forward service/lexbox 1080:1080 -n languagedepot &
    - name: verify ingress
      shell: bash
      run: curl -v http://localhost:${{inputs.ingress-controller-port}}
