name: Set up the frontend
description: Install pnpm and Node (pnpm store cached on frontend/pnpm-lock.yaml), optionally Task, then pnpm install in frontend/.
inputs:
  install-task:
    description: 'Also install Task (arduino/setup-task)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: 'frontend/package.json'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: './frontend/package.json'
        cache: 'pnpm'
        cache-dependency-path: './frontend/pnpm-lock.yaml'
    - name: Install Task
      if: inputs.install-task == 'true'
      uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        repo-token: ${{ github.token }}
    - name: Prepare frontend
      shell: bash
      working-directory: frontend
      run: pnpm install
