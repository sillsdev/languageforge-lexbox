<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictionary Stats</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-alt: #f4f4f5;
    --border: #e4e4e7;
    --text: #09090b;
    --text-muted: #71717a;
    --accent: #005de1;
    --accent-soft: #e8f0fd;
    --accent-fg: #ffffff;
    --good: #15803d;
    --good-soft: #e7f6ec;
    --warn: #b45309;
    --warn-soft: #fdf3e2;
    --bad: #dc2626;
    --bad-soft: #fdecec;
    --shadow: 0 1px 2px rgba(9, 9, 11, 0.06), 0 1px 3px rgba(9, 9, 11, 0.06);
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --vern-font: var(--font);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #09090b;
    --surface: #18181b;
    --surface-alt: #27272a;
    --border: #2e2e33;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --accent: #3b82f6;
    --accent-soft: #172a4d;
    --accent-fg: #ffffff;
    --good: #4ade80;
    --good-soft: #13301f;
    --warn: #fbbf24;
    --warn-soft: #3a2a0c;
    --bad: #f87171;
    --bad-soft: #3d1717;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden], .hidden { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px 24px 32px; }
  .wrap.narrow { max-width: 640px; min-height: 100dvh; display: flex; flex-direction: column; }
  .wrap.full { max-width: none; }
  .canvas { position: fixed; inset: 0; overflow: hidden; }
  h1 { font-size: 1.4rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .subtitle { color: var(--text-muted); margin: 0 0 16px; }
  .vern { font-family: var(--vern-font); }
  .muted { color: var(--text-muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 16px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-alt); }
  .btn:disabled { opacity: 0.5; cursor: default; filter: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; max-width: 100%;
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select { min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px;
    background: var(--surface-alt); color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .center-state { text-align: center; padding: 56px 16px; color: var(--text-muted); }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: var(--bad-soft); color: var(--text); border: 1px solid var(--bad); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; }
  @media (max-width: 600px) {
    .wrap { padding: 12px 12px 24px; }
    h1 { font-size: 1.2rem; }
    .wrap.narrow .actions { position: sticky; bottom: 0; margin: auto -12px -24px; padding: 12px; background: var(--bg); border-top: 1px solid var(--border); }
    .wrap.narrow .actions .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }


  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .tile .label { font-size: 0.82rem; color: var(--text-muted); }
  .tile .value { font-size: 1.9rem; font-weight: 700; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .value small { font-size: 1rem; color: var(--text-muted); font-weight: 600; }
  .panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .panels .card { margin: 0; }
  .bar-row { display: grid; grid-template-columns: minmax(0, 9rem) 1fr 3.5rem; align-items: center; gap: 10px; padding: 4px 0; }
  .bar-label { font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 10px; background: var(--surface-alt); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; min-width: 3px; }
  .bar-count { font-size: 0.85rem; font-weight: 600; text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .domain-row { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border); }
  .domain-row:first-child { border-top: 0; }
  .domain-row .code { color: var(--text-muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; min-width: 4.5rem; }
  .domain-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts { margin-top: 16px; }
  .fact { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); }
  .fact:first-of-type { border-top: 0; }
  .fact .value { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  .progress { max-width: 260px; height: 6px; margin: 12px auto 0; background: var(--surface-alt); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
  .note { margin: 0; }
  @media (max-width: 600px) {
    .tiles { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .tile { padding: 12px; }
    .tile .value { font-size: 1.5rem; }
    .panels { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .facts { margin-top: 12px; }
    .bar-row { grid-template-columns: minmax(0, 7rem) 1fr 3rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dictionary Stats</h1>
  <p class="subtitle" id="subtitle">A snapshot of this project&rsquo;s dictionary.</p>

  <div id="loading" class="center-state">
    <div class="spinner"></div>
    <div id="loading-text">Loading&hellip;</div>
    <div class="progress"><div id="progress-fill"></div></div>
  </div>
  <div id="error" class="error-box" role="alert" hidden></div>
  <div id="empty" class="center-state" hidden>This project has no entries yet. Add some words, then reload.</div>

  <main id="app" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="panels">
      <section class="card">
        <h2>Senses per part of speech</h2>
        <div id="pos-bars"></div>
      </section>
      <section class="card">
        <h2>Top semantic domains</h2>
        <div id="domains"></div>
      </section>
    </div>
    <section class="card facts">
      <h2>Fun facts</h2>
      <div id="facts"></div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';

  function applyTheme() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', fwlite.theme || (dark ? 'dark' : 'light'));
  }
  function applyVernFont(ws) {
    if (ws && ws.font) document.documentElement.style.setProperty('--vern-font', '"' + ws.font.replace(/"/g, '') + '", var(--font)');
  }

  var PAGE = 1000, CAP = 5000;
  async function loadAll(onProgress, cap) {
    cap = cap || CAP;
    var total = await fwlite.countEntries({});
    var target = Math.min(total, cap);
    var entries = [];
    while (entries.length < target) {
      var page = await fwlite.getEntries({limit: Math.min(PAGE, target - entries.length), offset: entries.length});
      if (!page.length) break;
      entries = entries.concat(page);
      if (onProgress) onProgress(entries.length, target);
    }
    return {entries: entries, total: total, capped: total > cap};
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  function show(id, visible) { document.getElementById(id).hidden = !visible; }
  function fmt(n) { return n.toLocaleString(); }

  function computeStats(entries, partsOfSpeech, domains, analysisWs) {
    var senses = 0, withExamples = 0, longest = '', posCounts = {}, domainCounts = {};
    entries.forEach(function (entry) {
      var hw = fwlite.headword(entry);
      if (hw.length > longest.length) longest = hw;
      var list = entry.senses || [];
      senses += list.length;
      if (list.some(function (s) { return s.exampleSentences && s.exampleSentences.length; })) withExamples++;
      list.forEach(function (sense) {
        var posId = (sense.partOfSpeech && sense.partOfSpeech.id) || sense.partOfSpeechId || '';
        posCounts[posId] = (posCounts[posId] || 0) + 1;
        (sense.semanticDomains || []).forEach(function (d) {
          var key = d.code || d.id;
          if (!domainCounts[key]) domainCounts[key] = {domain: d, count: 0};
          domainCounts[key].count++;
        });
      });
    });

    var posById = {};
    partsOfSpeech.forEach(function (pos) { posById[pos.id] = pos; });
    var posBars = Object.keys(posCounts).map(function (id) {
      var label = posById[id] ? fwlite.firstValue(posById[id].name, analysisWs) : '';
      return {label: label || 'None', count: posCounts[id]};
    }).sort(function (a, b) { return b.count - a.count; });

    var domainByCode = {};
    domains.forEach(function (d) { domainByCode[d.code] = d; });
    var topDomains = Object.keys(domainCounts).map(function (key) {
      var d = domainCounts[key].domain;
      var known = domainByCode[d.code] || d;
      return {code: d.code || '', name: fwlite.firstValue(known.name, analysisWs) || 'Unnamed domain', count: domainCounts[key].count};
    }).sort(function (a, b) { return b.count - a.count; }).slice(0, 10);

    return {
      entries: entries.length,
      senses: senses,
      pctExamples: entries.length ? Math.round(withExamples / entries.length * 100) : 0,
      avgSenses: entries.length ? senses / entries.length : 0,
      longest: longest,
      posBars: posBars,
      topDomains: topDomains,
      domainsUsed: Object.keys(domainCounts).length,
    };
  }

  function renderTiles(stats) {
    var tiles = document.getElementById('tiles');
    [
      ['Entries', fmt(stats.entries)],
      ['Senses', fmt(stats.senses)],
      ['With an example', stats.pctExamples, '%'],
      ['Senses per entry', stats.avgSenses.toFixed(1)],
    ].forEach(function (t) {
      var tile = el('div', 'card tile');
      tile.appendChild(el('div', 'label', t[0]));
      var value = el('div', 'value', t[1]);
      if (t[2]) value.appendChild(el('small', '', t[2]));
      tile.appendChild(value);
      tiles.appendChild(tile);
    });
  }

  function renderPos(bars) {
    var box = document.getElementById('pos-bars');
    if (!bars.length) { box.appendChild(el('p', 'muted note', 'No senses yet.')); return; }
    var max = bars[0].count || 1;
    bars.slice(0, 12).forEach(function (bar) {
      var row = el('div', 'bar-row');
      var label = el('div', 'bar-label', bar.label);
      label.title = bar.label;
      var track = el('div', 'bar-track');
      var fill = el('div', 'bar-fill');
      fill.style.width = Math.round(bar.count / max * 100) + '%';
      track.appendChild(fill);
      row.appendChild(label);
      row.appendChild(track);
      row.appendChild(el('div', 'bar-count', fmt(bar.count)));
      box.appendChild(row);
    });
  }

  function renderDomains(list) {
    var box = document.getElementById('domains');
    if (!list.length) { box.appendChild(el('p', 'muted note', 'No senses have a semantic domain yet.')); return; }
    list.forEach(function (d) {
      var row = el('div', 'domain-row');
      row.appendChild(el('span', 'code', d.code));
      var name = el('span', 'name', d.name);
      name.title = d.name;
      row.appendChild(name);
      row.appendChild(el('span', 'chip accent', fmt(d.count)));
      box.appendChild(row);
    });
  }

  function renderFacts(stats) {
    var box = document.getElementById('facts');
    [
      ['Longest headword', stats.longest || '-', true],
      ['Semantic domains in use', fmt(stats.domainsUsed)],
      ['Parts of speech in use', fmt(stats.posBars.filter(function (b) { return b.label !== 'None'; }).length)],
    ].forEach(function (f) {
      var row = el('div', 'fact');
      row.appendChild(el('span', 'muted', f[0]));
      row.appendChild(el('span', 'value' + (f[2] ? ' vern' : ''), f[1]));
      box.appendChild(row);
    });
  }

  async function init() {
    applyTheme();
    try {
      var results = await Promise.all([fwlite.getWritingSystems(), fwlite.getPartsOfSpeech(), fwlite.getSemanticDomains()]);
      applyVernFont((results[0].vernacular || [])[0]);
      var analysisWs = (results[0].analysis || []).filter(function (ws) { return !ws.isAudio; }).map(function (ws) { return ws.wsId; });

      var loaded = await loadAll(function (n, target) {
        document.getElementById('loading-text').textContent = 'Loaded ' + fmt(n) + ' of ' + fmt(target) + ' entries…';
        document.getElementById('progress-fill').style.width = Math.round(n / target * 100) + '%';
      });
      show('loading', false);
      if (!loaded.entries.length) { show('empty', true); return; }

      var stats = computeStats(loaded.entries, results[1], results[2], analysisWs);
      renderTiles(stats);
      renderPos(stats.posBars);
      renderDomains(stats.topDomains);
      renderFacts(stats);
      document.getElementById('subtitle').textContent = loaded.capped
        ? 'Based on the first ' + fmt(loaded.entries.length) + ' of ' + fmt(loaded.total) + ' entries in ' + fwlite.project.projectName + '.'
        : 'A snapshot of ' + fwlite.project.projectName + '.';
      show('app', true);
    } catch (err) {
      show('loading', false);
      var box = document.getElementById('error');
      box.textContent = 'Could not load the stats: ' + (err && err.message ? err.message : String(err));
      box.hidden = false;
    }
  }

  fwlite.ready.then(init);
})();
</script>
</body>
</html>
