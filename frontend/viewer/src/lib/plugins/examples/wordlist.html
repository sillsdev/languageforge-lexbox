<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fwlite-plugin-permissions" content="edit">
<title>Wordlist</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-alt: #f4f4f5;
    --border: #e4e4e7;
    --text: #09090b;
    --text-muted: #71717a;
    --accent: #005de1;
    --accent-soft: #e8f0fd;
    --accent-fg: #ffffff;
    --good: #15803d;
    --good-soft: #e7f6ec;
    --warn: #b45309;
    --warn-soft: #fdf3e2;
    --bad: #dc2626;
    --bad-soft: #fdecec;
    --shadow: 0 1px 2px rgba(9, 9, 11, 0.06), 0 1px 3px rgba(9, 9, 11, 0.06);
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --vern-font: var(--font);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #09090b;
    --surface: #18181b;
    --surface-alt: #27272a;
    --border: #2e2e33;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --accent: #3b82f6;
    --accent-soft: #172a4d;
    --accent-fg: #ffffff;
    --good: #4ade80;
    --good-soft: #13301f;
    --warn: #fbbf24;
    --warn-soft: #3a2a0c;
    --bad: #f87171;
    --bad-soft: #3d1717;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden], .hidden { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px 24px 32px; }
  .wrap.narrow { max-width: 640px; min-height: 100dvh; display: flex; flex-direction: column; }
  .wrap.full { max-width: none; }
  .canvas { position: fixed; inset: 0; overflow: hidden; }
  h1 { font-size: 1.4rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .subtitle { color: var(--text-muted); margin: 0 0 16px; }
  .vern { font-family: var(--vern-font); }
  .muted { color: var(--text-muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 16px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-alt); }
  .btn:disabled { opacity: 0.5; cursor: default; filter: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; max-width: 100%;
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select { min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px;
    background: var(--surface-alt); color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .center-state { text-align: center; padding: 56px 16px; color: var(--text-muted); }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: var(--bad-soft); color: var(--text); border: 1px solid var(--bad); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; }
  @media (max-width: 600px) {
    .wrap { padding: 12px 12px 24px; }
    h1 { font-size: 1.2rem; }
    .wrap.narrow .actions { position: sticky; bottom: 0; margin: auto -12px -24px; padding: 12px; background: var(--bg); border-top: 1px solid var(--border); }
    .wrap.narrow .actions .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
  select, input[type="text"], textarea { width: 100%; }
  textarea { resize: vertical; min-height: 120px; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .link-btn { background: none; border: 0; color: var(--accent); font: inherit; font-size: 0.85rem; cursor: pointer; padding: 8px; margin: -8px; border-radius: 6px; }
  .link-btn:hover { background: var(--accent-soft); }
  .link-btn:disabled { opacity: 0.5; cursor: default; background: none; }

  .stats-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .stats-bar .chip { font-size: 0.85rem; padding: 4px 12px; }
  .stats-bar .chip b { color: var(--text); }
  .chip.streak b { color: var(--warn); }
  .chip.combo { animation: comboPulse 0.6s ease; }
  @keyframes comboPulse { 35% { transform: scale(1.12); box-shadow: 0 0 0 4px var(--accent-soft); } }

  .flow-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }
  .rail { height: 6px; background: var(--surface-alt); border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
  .rail > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s ease; }

  .prompt-card { text-align: center; padding: 20px 16px; position: relative; margin-bottom: 12px; transition: opacity 0.2s ease, transform 0.2s ease; }
  .prompt-card.leaving { opacity: 0; transform: translateX(-22px); }
  .prompt-card.entering { opacity: 0; transform: translateX(22px); transition: none; }
  .prompt-label { font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
  .prompt-word { font-size: 2rem; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .collected-badge { margin-top: 10px; }
  .collected-badge .vern { font-weight: 700; }
  .plus-one { position: absolute; top: 12px; right: 16px; font-weight: 700; color: var(--good); font-size: 1.1rem; opacity: 0; pointer-events: none; }
  .plus-one.fire { animation: plusOne 0.9s ease; }
  @keyframes plusOne {
    0% { opacity: 0; transform: translateY(6px); }
    25% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-22px); }
  }
  .vern-input { font-family: var(--vern-font); font-size: 1.1rem; }
  details.more-ws { margin-bottom: 14px; }
  details.more-ws summary { cursor: pointer; color: var(--accent); font-size: 0.85rem; padding: 6px 0; }
  details.more-ws .field { margin: 10px 0 0; }
  .inline-note { scroll-margin-bottom: 80px; font-size: 0.88rem; padding: 10px 12px; border-radius: var(--radius); margin-top: 12px; }
  .inline-note.warn { background: var(--warn-soft); color: var(--warn); }
  .hint-row { color: var(--text-muted); font-size: 0.8rem; margin-top: 10px; }
  .actions { margin-top: 12px; }
  .actions .primary { flex: 1; }

  .trail { margin-top: 16px; }
  .trail-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
  .trail-list { display: flex; flex-direction: column; gap: 6px; }
  .trail-item { display: flex; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-size: 0.9rem; }
  .trail-item.fresh { animation: pop 0.6s ease; }
  @keyframes pop { from { background: var(--accent-soft); border-color: var(--accent); } }
  .trail-item .meaning { color: var(--text-muted); overflow-wrap: anywhere; }
  .trail-item .word { font-weight: 700; text-align: right; overflow-wrap: anywhere; font-family: var(--vern-font); }

  .done-card { text-align: center; padding: 28px 20px; }
  .done-card .big { font-size: 2.2rem; margin-bottom: 8px; }
  .done-stats { display: flex; justify-content: center; gap: 22px; margin: 20px 0; flex-wrap: wrap; }
  .done-stat .num { font-size: 1.5rem; font-weight: 700; color: var(--good); }
  .done-stat .lbl { font-size: 0.8rem; color: var(--text-muted); }
  .done-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #app { flex: 1; display: flex; flex-direction: column; }
  #flow-view:not([hidden]), #setup-view:not([hidden]) { flex: 1; display: flex; flex-direction: column; }
  @media (pointer: coarse) { .hint-row { display: none; } }
  @media (max-width: 600px) {
    .wrap.narrow .card > .actions { margin: auto -16px -16px; background: var(--surface); border-radius: 0 0 var(--radius) var(--radius); }
  }
</style>
</head>
<body>
<div class="wrap narrow">
  <h1>Wordlist</h1>
  <p class="subtitle">Walk a list of meanings and record the local word for each.</p>

  <div id="loading" class="center-state"><div class="spinner"></div><div id="loading-text">Loading&hellip;</div></div>
  <div id="error" class="error-box" role="alert" hidden></div>

  <main id="app" hidden>
    <section id="setup-view" class="card" hidden>
      <div class="field">
        <label for="list-select">Wordlist</label>
        <select id="list-select">
          <option value="swadesh100">Swadesh 100 (core vocabulary)</option>
          <option value="swadesh207">Swadesh 207 (extended)</option>
          <option value="custom">Paste your own&hellip;</option>
        </select>
      </div>
      <div class="field" id="custom-field" hidden>
        <label for="custom-input">Meanings, one per line</label>
        <textarea id="custom-input" placeholder="water&#10;fire&#10;mother&#10;to walk"></textarea>
      </div>
      <div class="field" id="analysis-field" hidden>
        <label for="analysis-select">Save the meaning as a gloss in</label>
        <select id="analysis-select"></select>
      </div>
      <div class="actions"><button class="btn primary" id="start-btn" type="button">Start collecting</button></div>
    </section>

    <section id="flow-view" hidden>
      <div class="stats-bar">
        <span class="chip" id="session-chip"><b id="stat-session">0</b> added this session</span>
        <span class="chip streak" title="Days in a row you have added at least one word"><b id="stat-streak">0</b> day streak</span>
      </div>
      <div class="flow-top">
        <span id="position">&nbsp;</span>
        <span><button class="link-btn" id="prev-btn" type="button">&larr; Previous</button>
        &nbsp;<button class="link-btn" id="change-list-btn" type="button">Change list</button></span>
      </div>
      <div class="rail"><i id="progress-fill"></i></div>

      <div class="card prompt-card" id="prompt-card">
        <div class="plus-one" id="plus-one">+1</div>
        <div class="prompt-label">Meaning</div>
        <div class="prompt-word" id="prompt-word"></div>
        <div class="chip good collected-badge" id="collected-badge" hidden></div>
      </div>

      <form class="card" id="flow-form" autocomplete="off">
        <div class="field">
          <label for="vern-input-0" id="vern-label-0">Word</label>
          <input type="text" class="vern-input" id="vern-input-0" placeholder="Type the word">
        </div>
        <details class="more-ws" id="more-ws" hidden>
          <summary id="more-ws-summary">Also in other writing systems</summary>
          <div id="more-ws-fields"></div>
        </details>
        <div class="field">
          <label for="gloss-input" id="gloss-label">Gloss</label>
          <input type="text" id="gloss-input">
        </div>
        <div id="form-note" aria-live="polite"></div>
        <div class="hint-row">Enter adds the word and moves on.</div>
        <div class="actions">
          <button class="btn" id="skip-btn" type="button">Skip</button>
          <button class="btn primary" id="add-btn" type="submit">Add &amp; next</button>
        </div>
      </form>

      <div class="trail" id="trail" hidden>
        <div class="trail-title">Recently added</div>
        <div class="trail-list" id="trail-list"></div>
      </div>
    </section>

    <section id="done-view" class="card done-card" hidden>
      <div class="big">&#127881;</div>
      <h2>List complete</h2>
      <p class="subtitle" style="margin-bottom:0;" id="done-message"></p>
      <div class="done-stats">
        <div class="done-stat"><div class="num" id="done-added">0</div><div class="lbl">words added</div></div>
        <div class="done-stat"><div class="num" id="done-skipped">0</div><div class="lbl">skipped</div></div>
        <div class="done-stat"><div class="num" id="done-streak">0</div><div class="lbl">day streak</div></div>
      </div>
      <div class="done-actions">
        <button class="btn" id="review-btn" type="button" hidden>Go back to the skipped ones</button>
        <button class="btn primary" id="startover-btn" type="button">Start another list</button>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';

  var fwlite = window.fwlite;
  var PROGRESS_KEY = 'wordlist-progress-v1';
  var STATS_KEY = 'wordlist-stats-v1';
  var TRAIL_MAX = 6;

  // Standard comparative wordlists (bundled, so it works offline).
  var SWADESH_100 = [
    'I', 'you (singular)', 'we', 'this', 'that', 'who', 'what', 'not', 'all', 'many',
    'one', 'two', 'big', 'long', 'small', 'woman', 'man (adult male)', 'person', 'fish', 'bird',
    'dog', 'louse', 'tree', 'seed', 'leaf', 'root', 'bark (of a tree)', 'skin', 'flesh', 'blood',
    'bone', 'grease (fat)', 'egg', 'horn', 'tail', 'feather', 'hair', 'head', 'ear', 'eye',
    'nose', 'mouth', 'tooth', 'tongue', 'claw', 'foot', 'knee', 'hand', 'belly', 'neck',
    'breast', 'heart', 'liver', 'drink', 'eat', 'bite', 'see', 'hear', 'know', 'sleep',
    'die', 'kill', 'swim', 'fly (verb)', 'walk', 'come', 'lie (recline)', 'sit', 'stand', 'give',
    'say', 'sun', 'moon', 'star', 'water', 'rain', 'stone', 'sand', 'earth (soil)', 'cloud',
    'smoke', 'fire', 'ash', 'burn', 'path (road)', 'mountain', 'red', 'green', 'yellow', 'white',
    'black', 'night', 'hot', 'cold', 'full', 'new', 'good', 'round', 'dry', 'name'
  ];
  var SWADESH_207 = [
    'I', 'you (singular)', 'he', 'we', 'you (plural)', 'they', 'this', 'that', 'here', 'there',
    'who', 'what', 'where', 'when', 'how', 'not', 'all', 'many', 'some', 'few',
    'other', 'one', 'two', 'three', 'four', 'five', 'big', 'long', 'wide', 'thick',
    'heavy', 'small', 'short', 'narrow', 'thin', 'woman', 'man (adult male)', 'man (human being)', 'child', 'wife',
    'husband', 'mother', 'father', 'animal', 'fish', 'bird', 'dog', 'louse', 'snake', 'worm',
    'tree', 'forest', 'stick', 'fruit', 'seed', 'leaf', 'root', 'bark (of a tree)', 'flower', 'grass',
    'rope', 'skin', 'meat', 'blood', 'bone', 'fat (noun)', 'egg', 'horn', 'tail', 'feather',
    'hair', 'head', 'ear', 'eye', 'nose', 'mouth', 'tooth', 'tongue (organ)', 'fingernail', 'foot',
    'leg', 'knee', 'hand', 'wing', 'belly', 'guts', 'neck', 'back', 'breast', 'heart',
    'liver', 'drink', 'eat', 'bite', 'suck', 'spit', 'vomit', 'blow', 'breathe', 'laugh',
    'see', 'hear', 'know', 'think', 'smell', 'fear', 'sleep', 'live', 'die', 'kill',
    'fight', 'hunt', 'hit', 'cut', 'split', 'stab', 'scratch', 'dig', 'swim', 'fly (verb)',
    'walk', 'come', 'lie (as in a bed)', 'sit', 'stand', 'turn (intransitive)', 'fall', 'give', 'hold', 'squeeze',
    'rub', 'wash', 'wipe', 'pull', 'push', 'throw', 'tie', 'sew', 'count', 'say',
    'sing', 'play', 'float', 'flow', 'freeze', 'swell', 'sun', 'moon', 'star', 'water',
    'rain', 'river', 'lake', 'sea', 'salt', 'stone', 'sand', 'dust', 'earth (soil)', 'cloud',
    'fog', 'sky', 'wind', 'snow', 'ice', 'smoke', 'fire', 'ash', 'burn', 'road',
    'mountain', 'red', 'green', 'yellow', 'white', 'black', 'night', 'day', 'year', 'warm',
    'cold', 'full', 'new', 'old', 'good', 'bad', 'rotten', 'dirty', 'straight', 'round',
    'sharp (as a knife)', 'dull (as a knife)', 'smooth', 'wet', 'dry', 'correct', 'near', 'far', 'right (side)', 'left (side)',
    'at', 'in', 'with (accompanying)', 'and', 'if', 'because', 'name'
  ];

  var state = {
    vernWs: [],
    analWs: [],
    analysisWs: '',
    collected: new Map(),  // lowercased gloss -> a headword that already has it
    listId: 'swadesh100',
    items: [],
    statuses: [],          // 'pending' | 'done' | 'skipped', parallel to items
    index: 0,
    trail: [],             // {meaning, word}
    session: 0,
    busy: false,
    stats: {days: {}, bestSession: 0, lifetime: 0},
  };

  function el(id) { return document.getElementById(id); }
  function errText(err) { return err && err.message ? err.message : String(err); }
  function show(id, visible) { el(id).hidden = !visible; }

  function applyTheme() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', fwlite.theme || (dark ? 'dark' : 'light'));
  }
  function applyVernFont(ws) {
    if (ws && ws.font) document.documentElement.style.setProperty('--vern-font', '"' + ws.font.replace(/"/g, '') + '", var(--font)');
  }

  function showError(message) {
    show('loading', false);
    show('app', false);
    show('error', true);
    el('error').textContent = message;
  }

  // Names that occur more than once (e.g. "Sena" for both the orthography and IPA) get their wsId.
  function wsLabel(ws, list) {
    var same = list.filter(function (w) { return w.name === ws.name; }).length;
    return same > 1 ? ws.name + ' (' + ws.wsId + ')' : ws.name;
  }

  function dayKey(date) {
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }
  function computeStreak(days) {
    var d = new Date();
    // A run that ended yesterday still counts (today isn't over).
    if (!days[dayKey(d)]) d.setDate(d.getDate() - 1);
    var streak = 0;
    while (days[dayKey(d)] > 0) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
  }

  // --- What is already in the dictionary --------------------------------------
  async function loadCollected() {
    var PAGE = 1000, CAP = 5000;
    var wsIds = state.analWs.map(function (ws) { return ws.wsId; });
    var total = Math.min(await fwlite.countEntries({}), CAP);
    for (var offset = 0; offset < total; offset += PAGE) {
      var entries = await fwlite.getEntries({limit: Math.min(PAGE, total - offset), offset: offset});
      if (!entries.length) break;
      entries.forEach(function (entry) {
        var headword = fwlite.headword(entry);
        (entry.senses || []).forEach(function (sense) {
          wsIds.forEach(function (wsId) { markCollected(sense.gloss && sense.gloss[wsId], headword); });
        });
      });
      el('loading-text').textContent = 'Checked ' + Math.min(offset + PAGE, total).toLocaleString() + ' of ' + total.toLocaleString() + ' entries…';
    }
  }
  function markCollected(text, headword) {
    var key = text && text.trim().toLowerCase();
    if (key && !state.collected.has(key)) state.collected.set(key, headword || '');
  }

  // --- Persistence -------------------------------------------------------------
  function saveProgress() {
    fwlite.storage.set(PROGRESS_KEY, {
      listId: state.listId, items: state.items, statuses: state.statuses, index: state.index,
      analysisWs: state.analysisWs, trail: state.trail,
    }).catch(function () { /* best-effort */ });
  }
  function saveStats() {
    fwlite.storage.set(STATS_KEY, state.stats).catch(function () { /* best-effort */ });
  }

  // --- Setup -------------------------------------------------------------------
  function populateSetup() {
    var select = el('analysis-select');
    select.textContent = '';
    state.analWs.forEach(function (ws) {
      var option = document.createElement('option');
      option.value = ws.wsId;
      option.textContent = wsLabel(ws, state.analWs);
      select.appendChild(option);
    });
    show('analysis-field', state.analWs.length > 1);
    el('list-select').addEventListener('change', syncCustom);
  }
  function syncCustom() { show('custom-field', el('list-select').value === 'custom'); }

  function listItemsFor(listId, customText) {
    if (listId === 'swadesh207') return SWADESH_207.slice();
    if (listId === 'custom') {
      return (customText || '').split(/\r?\n/).map(function (line) { return line.trim(); })
        .filter(function (line) { return line.length > 0; });
    }
    return SWADESH_100.slice();
  }

  function buildVernacularFields() {
    var first = state.vernWs[0];
    el('vern-input-0').dataset.ws = first.wsId;
    el('vern-label-0').textContent = 'Word in ' + wsLabel(first, state.vernWs);
    var host = el('more-ws-fields');
    host.textContent = '';
    state.vernWs.slice(1).forEach(function (ws, i) {
      var field = document.createElement('div');
      field.className = 'field';
      var label = document.createElement('label');
      label.setAttribute('for', 'vern-input-' + (i + 1));
      label.textContent = wsLabel(ws, state.vernWs);
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'vern-input';
      input.id = 'vern-input-' + (i + 1);
      input.dataset.ws = ws.wsId;
      field.appendChild(label);
      field.appendChild(input);
      host.appendChild(field);
    });
    show('more-ws', state.vernWs.length > 1);
  }

  function vernInputs() { return Array.prototype.slice.call(document.querySelectorAll('#flow-form .vern-input')); }

  function showView(name) {
    ['setup-view', 'flow-view', 'done-view'].forEach(function (id) { show(id, id === name); });
  }

  function startList(opts) {
    if (!opts || !opts.resume) {
      var items = listItemsFor(el('list-select').value, el('custom-input').value);
      if (!items.length) {
        el('custom-input').focus();
        fwlite.notify('That list is empty. Paste at least one meaning.');
        return;
      }
      state.listId = el('list-select').value;
      state.items = items;
      state.statuses = items.map(function () { return 'pending'; });
      state.index = 0;
      state.trail = [];
      state.analysisWs = el('analysis-select').value || state.analWs[0].wsId;
    }
    var anal = state.analWs.filter(function (ws) { return ws.wsId === state.analysisWs; })[0] || state.analWs[0];
    state.analysisWs = anal.wsId;
    el('gloss-label').textContent = 'Gloss in ' + wsLabel(anal, state.analWs);

    showView('flow-view');
    renderStats();
    renderTrail();
    if (allResolved()) { showDone(); return; }
    if (state.statuses[state.index] !== 'pending') {
      var next = state.statuses.indexOf('pending');
      if (next !== -1) state.index = next;
    }
    renderItem();
    saveProgress();
  }

  // --- Flow --------------------------------------------------------------------
  function total() { return state.items.length; }
  function countStatus(value) { return state.statuses.filter(function (s) { return s === value; }).length; }
  function allResolved() { return state.statuses.every(function (s) { return s !== 'pending'; }); }
  function currentMeaning() { return state.items[state.index]; }

  function renderStats() {
    el('stat-session').textContent = String(state.session);
    el('stat-streak').textContent = String(computeStreak(state.stats.days));
  }

  function setFormNote(message, kind) {
    var note = el('form-note');
    note.textContent = '';
    if (!message) return;
    var div = document.createElement('div');
    div.className = 'inline-note ' + (kind || '');
    div.textContent = message;
    note.appendChild(div);
    div.scrollIntoView({block: 'nearest'});
  }

  function updateCollectedBadge() {
    var key = el('gloss-input').value.trim().toLowerCase();
    var badge = el('collected-badge');
    if (!key || !state.collected.has(key)) { badge.hidden = true; return; }
    var headword = state.collected.get(key);
    badge.textContent = '✓ Already in the dictionary' + (headword ? ': ' : '');
    if (headword) {
      var word = document.createElement('span');
      word.className = 'vern';
      word.textContent = headword;
      badge.appendChild(word);
    }
    badge.hidden = false;
  }

  function renderItem() {
    var meaning = currentMeaning();
    el('prompt-word').textContent = meaning == null ? '' : meaning;
    el('position').textContent = 'Meaning ' + (state.index + 1) + ' of ' + total();
    var resolved = countStatus('done') + countStatus('skipped');
    el('progress-fill').style.width = (total() ? (resolved / total() * 100) : 0) + '%';
    el('gloss-input').value = meaning || '';
    vernInputs().forEach(function (input) { input.value = ''; });
    updateCollectedBadge();
    el('prev-btn').disabled = state.index === 0 || state.busy;
    el('vern-input-0').focus({preventScroll: true});
  }

  function renderTrail() {
    var list = el('trail-list');
    list.textContent = '';
    show('trail', state.trail.length > 0);
    state.trail.forEach(function (entry, idx) {
      var item = document.createElement('div');
      item.className = 'trail-item' + (idx === 0 ? ' fresh' : '');
      var meaning = document.createElement('span');
      meaning.className = 'meaning';
      meaning.textContent = entry.meaning;
      var word = document.createElement('span');
      word.className = 'word';
      word.textContent = entry.word;
      item.appendChild(meaning);
      item.appendChild(word);
      list.appendChild(item);
    });
  }

  function setBusy(busy) {
    state.busy = busy;
    el('add-btn').disabled = busy;
    el('skip-btn').disabled = busy;
    el('prev-btn').disabled = busy || state.index === 0;
  }

  function advance() {
    var card = el('prompt-card');
    card.classList.add('leaving');
    setTimeout(function () {
      card.classList.remove('leaving');
      var next = state.index + 1;
      if (next >= total()) {
        var pending = state.statuses.indexOf('pending');
        if (pending === -1) { showDone(); return; }
        next = pending;
      }
      state.index = next;
      saveProgress();
      card.classList.add('entering');
      renderItem();
      requestAnimationFrame(function () { card.classList.remove('entering'); });
    }, 200);
  }

  function goPrevious() {
    if (state.busy || state.index === 0) return;
    setFormNote('');
    state.index -= 1;
    saveProgress();
    renderItem();
  }

  function celebrate() {
    var plus = el('plus-one');
    plus.classList.remove('fire');
    void plus.offsetWidth;
    plus.classList.add('fire');
    if (state.session % 5 === 0) {
      var chip = el('session-chip');
      chip.classList.remove('combo');
      void chip.offsetWidth;
      chip.classList.add('combo');
    }
  }

  function recordSuccess(meaning, word, gloss) {
    var key = dayKey(new Date());
    state.stats.days[key] = (state.stats.days[key] || 0) + 1;
    state.stats.lifetime++;
    state.session++;
    if (state.session > state.stats.bestSession) state.stats.bestSession = state.session;
    saveStats();
    markCollected(gloss, word);
    state.trail.unshift({meaning: meaning, word: word});
    if (state.trail.length > TRAIL_MAX) state.trail.pop();
    renderStats();
    renderTrail();
    celebrate();
  }

  function handleAdd() {
    if (state.busy) return;
    var meaning = currentMeaning();
    if (meaning == null) return;

    var gloss = el('gloss-input').value.trim();
    var words = vernInputs().map(function (input) { return {ws: input.dataset.ws, value: input.value.trim()}; });
    var primary = words.filter(function (w) { return w.value; })[0];
    if (!primary) {
      setFormNote('Type the word first.', 'warn');
      el('vern-input-0').focus();
      return;
    }
    if (!gloss) {
      setFormNote('Add a gloss (the meaning).', 'warn');
      el('gloss-input').focus();
      return;
    }

    var lexemeForm = {};
    words.forEach(function (w) { if (w.value) lexemeForm[w.ws] = w.value; });
    var glossField = {};
    glossField[state.analysisWs] = gloss;

    setBusy(true);
    setFormNote('');
    fwlite.createEntry({lexemeForm: lexemeForm, senses: [{gloss: glossField}]}).then(function () {
      setBusy(false);
      state.statuses[state.index] = 'done';
      recordSuccess(meaning, primary.value, gloss);
      advance();
    }).catch(function (err) {
      setBusy(false);
      var code = err && err.code;
      if (code === 'preview') setFormNote('This is a preview, so the word was not saved. Once the plugin is added to the project, approving saves it.', 'warn');
      else if (code === 'permission-denied') setFormNote('Not saved, because the change wasn’t approved. Edit and try again, or skip.', 'warn');
      else setFormNote('Could not save: ' + errText(err), 'warn');
    });
  }

  function handleSkip() {
    if (state.busy || currentMeaning() == null) return;
    setFormNote('');
    state.statuses[state.index] = 'skipped';
    advance();
  }

  function showDone() {
    showView('done-view');
    var added = countStatus('done');
    var skipped = countStatus('skipped');
    el('done-added').textContent = String(added);
    el('done-skipped').textContent = String(skipped);
    el('done-streak').textContent = String(computeStreak(state.stats.days));
    el('done-message').textContent = added > 0
      ? 'You recorded ' + added + (added === 1 ? ' word' : ' words') + ' from this list.'
      : 'You reached the end of the list.';
    show('review-btn', skipped > 0);
    saveProgress();
  }

  function reviewSkipped() {
    var skipped = state.statuses.indexOf('skipped');
    if (skipped === -1) return;
    state.statuses = state.statuses.map(function (s) { return s === 'skipped' ? 'pending' : s; });
    state.index = skipped;
    showView('flow-view');
    setFormNote('');
    renderItem();
    saveProgress();
  }

  function backToSetup() {
    showView('setup-view');
    el('list-select').value = state.listId;
    syncCustom();
  }

  function wireEvents() {
    el('start-btn').addEventListener('click', function () { startList({resume: false}); });
    el('startover-btn').addEventListener('click', backToSetup);
    el('change-list-btn').addEventListener('click', backToSetup);
    el('review-btn').addEventListener('click', reviewSkipped);
    el('skip-btn').addEventListener('click', handleSkip);
    el('prev-btn').addEventListener('click', goPrevious);
    el('flow-form').addEventListener('submit', function (event) {
      event.preventDefault();
      handleAdd();
    });
    el('gloss-input').addEventListener('input', updateCollectedBadge);
  }

  function restoreProgress(saved) {
    if (!saved || typeof saved !== 'object' || !Array.isArray(saved.items) || saved.items.length === 0) return false;
    if (!Array.isArray(saved.statuses) || saved.statuses.length !== saved.items.length) return false;
    state.listId = saved.listId || 'custom';
    state.items = saved.items;
    state.statuses = saved.statuses;
    state.index = Math.min(Math.max(saved.index || 0, 0), saved.items.length - 1);
    state.analysisWs = saved.analysisWs;
    state.trail = Array.isArray(saved.trail) ? saved.trail.slice(0, TRAIL_MAX) : [];
    return true;
  }

  async function init() {
    applyTheme();
    try {
      var results = await Promise.all([fwlite.getWritingSystems(), fwlite.storage.get(STATS_KEY), fwlite.storage.get(PROGRESS_KEY)]);
      var writingSystems = results[0] || {};
      state.vernWs = (writingSystems.vernacular || []).filter(function (ws) { return !ws.isAudio; });
      state.analWs = (writingSystems.analysis || []).filter(function (ws) { return !ws.isAudio; });
      if (results[1] && typeof results[1] === 'object') {
        state.stats = {days: results[1].days || {}, bestSession: results[1].bestSession || 0, lifetime: results[1].lifetime || 0};
      }
      if (!state.vernWs.length || !state.analWs.length) {
        showError('Wordlist needs a vernacular writing system (the language you are documenting) and an analysis writing system (for the meanings). Add the missing one in the project settings, then reopen this plugin.');
        return;
      }
      applyVernFont(state.vernWs[0]);
      wireEvents();
      populateSetup();
      buildVernacularFields();
      el('loading-text').textContent = 'Checking what is already in the dictionary…';
      await loadCollected();
      show('loading', false);
      show('app', true);
      if (restoreProgress(results[2]) && !allResolved()) startList({resume: true});
      else showView('setup-view');
    } catch (err) {
      showError('Could not load the project: ' + errText(err));
    }
  }

  fwlite.ready.then(init);
})();
</script>
</body>
</html>
