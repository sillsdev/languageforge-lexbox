<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexicon Galaxy</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-alt: #f4f4f5;
    --border: #e4e4e7;
    --text: #09090b;
    --text-muted: #71717a;
    --accent: #005de1;
    --accent-soft: #e8f0fd;
    --accent-fg: #ffffff;
    --good: #15803d;
    --good-soft: #e7f6ec;
    --warn: #b45309;
    --warn-soft: #fdf3e2;
    --bad: #dc2626;
    --bad-soft: #fdecec;
    --shadow: 0 1px 2px rgba(9, 9, 11, 0.06), 0 1px 3px rgba(9, 9, 11, 0.06);
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --vern-font: var(--font);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #09090b;
    --surface: #18181b;
    --surface-alt: #27272a;
    --border: #2e2e33;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --accent: #3b82f6;
    --accent-soft: #172a4d;
    --accent-fg: #ffffff;
    --good: #4ade80;
    --good-soft: #13301f;
    --warn: #fbbf24;
    --warn-soft: #3a2a0c;
    --bad: #f87171;
    --bad-soft: #3d1717;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden], .hidden { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px 24px 32px; }
  .wrap.narrow { max-width: 640px; min-height: 100dvh; display: flex; flex-direction: column; }
  .wrap.full { max-width: none; }
  .canvas { position: fixed; inset: 0; overflow: hidden; }
  h1 { font-size: 1.4rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .subtitle { color: var(--text-muted); margin: 0 0 16px; }
  .vern { font-family: var(--vern-font); }
  .muted { color: var(--text-muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 16px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-alt); }
  .btn:disabled { opacity: 0.5; cursor: default; filter: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; max-width: 100%;
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select { min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px;
    background: var(--surface-alt); color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .center-state { text-align: center; padding: 56px 16px; color: var(--text-muted); }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: var(--bad-soft); color: var(--text); border: 1px solid var(--bad); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; }
  @media (max-width: 600px) {
    .wrap { padding: 12px 12px 24px; }
    h1 { font-size: 1.2rem; }
    .wrap.narrow .actions { position: sticky; bottom: 0; margin: auto -12px -24px; padding: 12px; background: var(--bg); border-top: 1px solid var(--border); }
    .wrap.narrow .actions .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

  /* ---- Lexicon Galaxy ---- */
  body { background: #05060d; overflow: hidden; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #sky.dragging { cursor: grabbing; }
  #sky.over-star { cursor: pointer; }
  .panel {
    position: absolute; z-index: 2;
    background: rgba(24, 24, 27, 0.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
  .icon-btn { width: 44px; padding: 0; flex-shrink: 0; font-size: 1.15rem; }
  .icon-btn svg { width: 20px; height: 20px; }

  #topbar { position: fixed; top: 12px; left: 12px; width: min(480px, calc(100% - 24px)); padding: 6px 6px 8px 14px; z-index: 5; }
  .bar-row { display: flex; align-items: center; gap: 6px; }
  #topbar h1 { font-size: 1.05rem; margin: 0 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .search-box { position: relative; flex: 1 1 0; min-width: 110px; }
  #search { width: 100%; border-radius: 999px; padding-left: 14px; background: var(--surface-alt); }
  #results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    max-height: 60dvh; overflow-y: auto; z-index: 6;
  }
  #results li { padding: 8px 10px; border-radius: 8px; cursor: pointer; min-height: 44px; display: flex; flex-direction: column; justify-content: center; }
  #results li[aria-selected="true"], #results li:hover { background: var(--surface-alt); }
  #results li.none { cursor: default; color: var(--text-muted); }
  #results .r-hw { font-weight: 600; font-family: var(--vern-font); overflow-wrap: anywhere; }
  #results .r-sub { font-size: 0.8rem; color: var(--text-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #subtitle { margin: 2px 0 0; font-size: 0.8rem; }
  #crumbs { display: flex; align-items: center; gap: 2px; margin-top: 4px; min-width: 0; }
  #crumbs .btn { min-height: 40px; padding: 0 10px; }
  #crumbs .icon-btn { width: 40px; padding: 0; }
  #crumb-text { flex: 1; min-width: 0; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #crumb-text b { color: var(--text); }

  .sheet { display: flex; flex-direction: column; overflow: hidden; }
  .sheet-head { display: flex; align-items: flex-start; gap: 8px; padding: 10px 6px 6px 16px; }
  .sheet-title { flex: 1; min-width: 0; padding-top: 8px; }
  .sheet-title h2 { margin: 0; font-size: 1.1rem; overflow-wrap: anywhere; }
  .sheet-title .muted { font-size: 0.82rem; }
  .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 16px 16px; overscroll-behavior: contain; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }

  .hw-big { font-family: var(--vern-font); font-size: 1.5rem; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
  .meanings { margin: 8px 0 12px; padding-left: 1.3em; }
  .meanings li { margin-bottom: 4px; }
  .meanings .pos { color: var(--text-muted); font-size: 0.82rem; margin-right: 4px; }
  .dom-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .dom-chips button { border: none; font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; min-height: 32px; }
  .dom-chips button:hover { filter: brightness(1.2); }
  .card-actions { display: flex; gap: 8px; }
  .card-actions .btn.primary { flex: 1; }

  .list-group { margin: 10px 0 4px; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; }
  .row-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 6px 8px; margin: 0;
    background: none; border: none; border-radius: 8px; color: var(--text); font: inherit; text-align: left; cursor: pointer;
  }
  .row-btn:hover, .row-btn.current { background: var(--surface-alt); }
  .row-btn .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-btn .ct { color: var(--text-muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .row-btn .w-hw { font-family: var(--vern-font); font-weight: 600; flex-shrink: 0; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-btn .w-gl { flex: 1; min-width: 0; color: var(--text-muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fine { font-size: 0.8rem; color: var(--text-muted); margin: 10px 0 0; }

  #zoom { right: 12px; bottom: calc(var(--sheet-h, 0px) + 12px); display: flex; flex-direction: column; padding: 4px; gap: 2px; }
  #zoom .btn { border: none; background: transparent; }
  #zoom .btn:hover { background: var(--surface-alt); }
  #hint {
    left: 50%; transform: translateX(-50%); bottom: calc(var(--sheet-h, 0px) + 16px); padding: 8px 14px;
    font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; pointer-events: none; transition: opacity 0.4s;
    max-width: calc(100% - 140px); overflow: hidden; text-overflow: ellipsis;
  }
  #tooltip {
    position: absolute; z-index: 3; pointer-events: none; padding: 6px 10px; max-width: 240px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    transform: translate(-50%, calc(-100% - 12px)); font-size: 0.85rem;
  }
  #tooltip .t-hw { font-weight: 700; font-family: var(--vern-font); }
  #tooltip .t-gl { color: var(--text-muted); font-size: 0.8rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .state { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 16px 16px; }
  .state .error-box { max-width: 460px; }

  @media (min-width: 601px) {
    #card { top: 12px; right: 12px; width: 330px; max-height: calc(100% - 172px); }
    #list-panel { left: 12px; top: var(--top-h, 120px); bottom: 12px; width: 270px; }
  }
  @media (min-width: 601px) and (max-width: 899px) {
    #card { top: var(--top-h, 120px); max-height: calc(100% - var(--top-h, 120px) - 160px); }
  }
  @media (max-width: 600px) {
    #topbar { top: 8px; left: 8px; width: calc(100% - 16px); padding-left: 12px; }
    #subtitle { font-size: 0.75rem; }
    .sheet { left: 0; right: 0; bottom: 0; max-height: 50dvh; border-radius: 16px 16px 0 0; border-bottom: none; }
    #zoom { right: 8px; bottom: calc(var(--sheet-h, 0px) + 8px); }
    #hint { left: 8px; right: 8px; top: var(--top-h, 100px); bottom: auto; transform: none; max-width: none; white-space: normal; text-align: center; }
  }
</style>
</head>
<body>
<header id="topbar" class="panel">
  <div class="bar-row">
    <h1>Lexicon Galaxy</h1>
    <div class="search-box">
      <input id="search" type="search" placeholder="Find a word" autocomplete="off" spellcheck="false" disabled
        role="combobox" aria-label="Find a word" aria-autocomplete="list" aria-expanded="false" aria-controls="results">
      <ul id="results" role="listbox" hidden></ul>
    </div>
    <button type="button" class="btn icon-btn" id="list-btn" aria-label="Constellations" title="Constellations" aria-expanded="false" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="6" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="5" cy="18" r="1.6"/><path d="M10 6h10M10 12h10M10 18h10"/></svg>
    </button>
  </div>
  <p id="subtitle" class="subtitle"></p>
  <nav id="crumbs" aria-label="Focused constellation" hidden>
    <button type="button" class="btn ghost" id="crumb-all">&lsaquo; All</button>
    <span id="crumb-text" class="muted"></span>
    <button type="button" class="btn ghost icon-btn" id="crumb-prev" aria-label="Previous constellation">&lsaquo;</button>
    <button type="button" class="btn ghost icon-btn" id="crumb-next" aria-label="Next constellation">&rsaquo;</button>
  </nav>
</header>

<div id="loading" class="state center-state"><div class="spinner"></div><div id="loading-text">Mapping the sky&hellip;</div></div>
<div id="error" class="state" role="alert" hidden><div class="error-box"><p id="error-text" style="margin:0 0 10px"></p><button type="button" class="btn" id="retry">Try again</button></div></div>
<div id="empty" class="state center-state" hidden>There are no entries yet, so the sky is empty. Add some words in FW Lite, then reload.</div>

<main id="app" class="canvas" hidden>
  <canvas id="sky" tabindex="0" role="img"
    aria-label="Star map of the dictionary. Arrow keys move, plus and minus zoom, 0 shows everything. Use the Constellations list or search to reach words."></canvas>
  <div id="tooltip" hidden><div class="t-hw"></div><div class="t-gl"></div></div>
  <aside id="list-panel" class="panel sheet" aria-label="Constellations" hidden>
    <div class="sheet-head">
      <div class="sheet-title"><h2>Constellations</h2></div>
      <button type="button" class="btn ghost icon-btn" id="list-close" aria-label="Close">&#x2715;</button>
    </div>
    <div class="sheet-body" id="list-body"></div>
  </aside>
  <aside id="card" class="panel sheet" aria-live="off" hidden>
    <div class="sheet-head">
      <div class="sheet-title" id="card-title"></div>
      <button type="button" class="btn ghost icon-btn" id="card-close" aria-label="Close">&#x2715;</button>
    </div>
    <div class="sheet-body" id="card-body"></div>
  </aside>
  <div id="zoom" class="panel">
    <button type="button" class="btn icon-btn" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
    <button type="button" class="btn icon-btn" id="zoom-out" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>
    <button type="button" class="btn icon-btn" id="zoom-fit" aria-label="Show everything" title="Show everything (0)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
  <div id="hint" class="panel" hidden></div>
  <div id="live" class="sr" aria-live="polite"></div>
</main>

<script>
(function () {
  'use strict';
  function applyVernFont(ws) {
    if (ws && ws.font) document.documentElement.style.setProperty('--vern-font', '"' + ws.font.replace(/"/g, '') + '", var(--font)');
  }
  var PAGE = 1000, CAP = 5000;
  async function loadAll(onProgress, cap) {
    cap = cap || CAP;
    var total = await fwlite.countEntries({});
    var target = Math.min(total, cap);
    var entries = [];
    while (entries.length < target) {
      var page = await fwlite.getEntries({limit: Math.min(PAGE, target - entries.length), offset: entries.length});
      if (!page.length) break;
      entries = entries.concat(page);
      if (onProgress) onProgress(entries.length, target);
    }
    return {entries: entries, total: total, capped: total > cap};
  }

  var TOP_DOMAINS = {'1': 'Universe, creation', '2': 'Person', '3': 'Language and thought', '4': 'Social behavior',
    '5': 'Daily life', '6': 'Work and occupation', '7': 'Physical actions', '8': 'States', '9': 'Grammar'};
  var SECOND_DOMAINS = {
    '1.1': 'Sky', '1.2': 'World', '1.3': 'Water', '1.4': 'Living things', '1.5': 'Plant', '1.6': 'Animal', '1.7': 'Nature, environment',
    '2.1': 'Body', '2.2': 'Body functions', '2.3': 'Sense, perceive', '2.4': 'Body condition', '2.5': 'Healthy', '2.6': 'Life',
    '3.1': 'Soul, spirit', '3.2': 'Think', '3.3': 'Want', '3.4': 'Emotion', '3.5': 'Communication', '3.6': 'Teach',
    '4.1': 'Relationships', '4.2': 'Social activity', '4.3': 'Behavior', '4.4': 'Prosperity, trouble', '4.5': 'Authority',
    '4.6': 'Government', '4.7': 'Law', '4.8': 'Conflict', '4.9': 'Religion',
    '5.1': 'Household equipment', '5.2': 'Food', '5.3': 'Clothing', '5.4': 'Adornment', '5.5': 'Fire', '5.6': 'Cleaning',
    '5.7': 'Sleep', '5.8': 'Manage a house', '5.9': 'Live, stay',
    '6.1': 'Work', '6.2': 'Agriculture', '6.3': 'Animal husbandry', '6.4': 'Hunt and fish', '6.5': 'Working with buildings',
    '6.6': 'Occupation', '6.7': 'Tool', '6.8': 'Finance', '6.9': 'Business organization',
    '7.1': 'Posture', '7.2': 'Move', '7.3': 'Move something', '7.4': 'Have, be with', '7.5': 'Arrange', '7.6': 'Hide',
    '7.7': 'Physical impact', '7.8': 'Divide into pieces', '7.9': 'Break, wear out',
    '8.1': 'Quantity', '8.2': 'Big', '8.3': 'Quality', '8.4': 'Time', '8.5': 'Location', '8.6': 'Parts of things',
    '9.1': 'General words', '9.2': 'Part of speech', '9.3': 'Very', '9.4': 'Verb meanings', '9.5': 'Case',
    '9.6': 'Connected with, related', '9.7': 'Name'
  };
  var PALETTE = ['#7dd3fc', '#fda4af', '#c4b5fd', '#fcd34d', '#86efac', '#fdba74', '#f0abfc', '#5eead4', '#cbd5e1', '#a5b4fc', '#fca5a5', '#bef264'];
  var DUST = '#94a3b8';
  var SYS = 'system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif';
  var SPACING = 14, GOLDEN = 2.399963229728653, MIN_CHARTED = 20, LIST_CAP = 300;

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function fmt(n) { return n.toLocaleString(); }
  function plural(n, one, many) { return fmt(n) + ' ' + (n === 1 ? one : many); }
  function fold(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function hashStr(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed) {
    var a = seed;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function codeKey(code) { return String(code).split('.').map(function (n) { return ('000' + n).slice(-3); }).join('.'); }
  function reducedMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function narrow() { return window.innerWidth <= 600; }
  function trunc(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  var analysisWs = [], vernFamily = SYS;
  var stars = [], clusters = [], regions = [], dust = null, groupedBy = 'domain';
  var cam = {x: 0, y: 0, zoom: 1}, W = 0, H = 0, dpr = 1;
  var canvas = $('sky'), ctx = canvas.getContext('2d');
  var bgCanvas = document.createElement('canvas');
  var sprites = {}, nebula = {};
  var focus = null, selected = null, hovered = null, matches = null, matchSet = null;
  var labelHits = [];
  var tween = null, rafPending = false;
  var mapBounds = null, allBounds = null;
  var cardMode = null;
  var untouched = true;

  function meaningOf(sense) {
    var g = fwlite.firstValue(sense.gloss, analysisWs);
    if (g) return g.trim();
    var d = fwlite.asText(fwlite.firstValue(sense.definition, analysisWs)).trim();
    return trunc(d, 120);
  }
  function posName(sense) {
    return sense.partOfSpeech ? fwlite.firstValue(sense.partOfSpeech.name, analysisWs) : '';
  }

  function domainNamer(listDomains, entries) {
    var fromSenses = {}, fromList = {};
    entries.forEach(function (e) {
      (e.senses || []).forEach(function (s) {
        (s.semanticDomains || []).forEach(function (d) { if (!fromSenses[d.code]) fromSenses[d.code] = fwlite.firstValue(d.name, analysisWs); });
      });
    });
    // A list without sub-domains is a stub (the demo project has one); its top-level names would mislabel whole regions.
    var realList = listDomains.some(function (d) { return String(d.code).indexOf('.') > 0; });
    if (realList) listDomains.forEach(function (d) { fromList[d.code] = fwlite.firstValue(d.name, analysisWs); });
    return function (code) {
      return fromList[code] || fromSenses[code] || TOP_DOMAINS[code] || SECOND_DOMAINS[code] || ('Domain ' + code);

      var sub = groupedBy === 'domain'
        ? plural(stars.length, 'word', 'words') + ' · ' + fmt(chartedCount) + ' charted in ' + plural(clusters.length, 'constellation', 'constellations')
        : groupedBy === 'pos' ? 'No semantic domains yet, so words are grouped by part of speech.'
        : 'No semantic domains yet, so words are grouped by first letter.';
      if (loaded.capped) sub += ' · first ' + fmt(CAP) + ' of ' + fmt(loaded.total);
      $('subtitle').textContent = sub;
      $('search').disabled = false; $('list-btn').disabled = false;

      setupInput();
      wireChrome();
      if (window.innerWidth >= 900) toggleList(true);
      resize();
      fitAll(false);
      var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      var hint = $('hint');
      hint.textContent = coarse ? 'Drag to move · pinch to zoom · tap a star' : 'Drag to move · scroll to zoom · click a star for details';
      hint.hidden = false;
      setTimeout(dismissHint, 7000);
      window.addEventListener('resize', resize);
    } catch (err) {
      show('loading', false);
      $('error-text').textContent = 'Could not map the dictionary: ' + (err && err.message ? err.message : String(err));
      show('error', true);
    }
  }

  // The sky is always night, so the panels use the dark palette whatever the app theme.
  document.documentElement.setAttribute('data-theme', 'dark');
  $('retry').addEventListener('click', load);
  fwlite.ready.then(load);
})();
</script>
</body>
</html>
