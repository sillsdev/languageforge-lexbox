<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duplicate Finder</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-alt: #f4f4f5;
    --border: #e4e4e7;
    --text: #09090b;
    --text-muted: #71717a;
    --accent: #005de1;
    --accent-soft: #e8f0fd;
    --accent-fg: #ffffff;
    --good: #15803d;
    --good-soft: #e7f6ec;
    --warn: #b45309;
    --warn-soft: #fdf3e2;
    --bad: #dc2626;
    --bad-soft: #fdecec;
    --shadow: 0 1px 2px rgba(9, 9, 11, 0.06), 0 1px 3px rgba(9, 9, 11, 0.06);
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --vern-font: var(--font);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #09090b;
    --surface: #18181b;
    --surface-alt: #27272a;
    --border: #2e2e33;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --accent: #3b82f6;
    --accent-soft: #172a4d;
    --accent-fg: #ffffff;
    --good: #4ade80;
    --good-soft: #13301f;
    --warn: #fbbf24;
    --warn-soft: #3a2a0c;
    --bad: #f87171;
    --bad-soft: #3d1717;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden], .hidden { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px 24px 32px; }
  .wrap.narrow { max-width: 640px; min-height: 100dvh; display: flex; flex-direction: column; }
  .canvas { position: fixed; inset: 0; overflow: hidden; }
  h1 { font-size: 1.4rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .subtitle { color: var(--text-muted); margin: 0 0 16px; }
  .vern { font-family: var(--vern-font); }
  .muted { color: var(--text-muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 16px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-alt); }
  .btn:disabled { opacity: 0.5; cursor: default; filter: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; max-width: 100%;
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select { min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px;
    background: var(--surface-alt); color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .center-state { text-align: center; padding: 56px 16px; color: var(--text-muted); }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: var(--bad-soft); color: var(--text); border: 1px solid var(--bad); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; }
  @media (max-width: 600px) {
    .wrap { padding: 12px 12px 24px; }
    h1 { font-size: 1.2rem; }
    .wrap.narrow .actions { position: sticky; bottom: 0; margin: auto -12px -24px; padding: 12px; background: var(--bg); border-top: 1px solid var(--border); }
    .wrap.narrow .actions .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  .toolbar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 180px; min-width: 0; }
  .field label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
  .field select { width: 100%; }

  .summary { color: var(--text-muted); margin: 0 0 12px; }
  .summary b { color: var(--text); }
  .cap-note { margin: 0 0 12px; }

  .tabs { display: flex; gap: 4px 16px; margin-bottom: 12px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .tab {
    appearance: none; background: none; border: none; font: inherit; cursor: pointer; white-space: nowrap;
    min-height: 44px; padding: 0 2px; margin-bottom: -1px; color: var(--text-muted); font-weight: 600;
    border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tab[aria-selected="true"] .chip { background: var(--accent-soft); color: var(--accent); }
  .tab-hint { color: var(--text-muted); font-size: 0.9rem; margin: 0 0 12px; }

  .clusters { display: flex; flex-direction: column; gap: 12px; }
  .cluster-head { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .cluster-title { font-weight: 700; font-size: 1.05rem; font-family: var(--vern-font); word-break: break-word; }
  .cluster-title.plain { font-family: inherit; }
  .cluster-meta { color: var(--text-muted); font-size: 0.85rem; margin-left: auto; white-space: nowrap; }
  .members { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
  .member {
    text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; min-height: 44px;
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .member:hover { border-color: var(--accent); }
  .member-top { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
  .member .hw { font-weight: 700; font-family: var(--vern-font); word-break: break-word; }
  .member .open { color: var(--accent); font-size: 0.8rem; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .member .meta { color: var(--text-muted); font-size: 0.85rem; word-break: break-word; }
  .member .meta .sep { opacity: 0.5; margin: 0 6px; }
  .member .meta .pos { font-style: italic; }
  .member .meta .muted { font-style: italic; }
  .more-row { text-align: center; padding: 4px 0 8px; }

  .celebrate { text-align: center; padding: 44px 20px; }
  .celebrate .big { font-size: 2.6rem; }
  .celebrate .msg { font-weight: 600; color: var(--good); margin-top: 10px; }
  .celebrate .sub { color: var(--text-muted); font-size: 0.9rem; margin-top: 6px; }
  .scan-bar { max-width: 320px; margin: 16px auto 0; background: var(--surface-alt); border-radius: 999px; height: 10px; overflow: hidden; }
  .scan-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.35s ease; }

  @media (max-width: 600px) {
    .field { flex-basis: calc(50% - 6px); }
    .field.wide { flex-basis: 100%; }
    .cluster { padding: 12px; }
    .members { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .member { padding: 8px 10px; }
    .member .open { display: none; }
    #summary, .tab .opt { display: none; }
    .tabs { gap: 4px 10px; }
    .tab { gap: 5px; }
    .tab .chip { padding: 2px 7px; }
    .tab .label { display: inline-block; }
    .tab .label::first-letter { text-transform: uppercase; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Duplicate Finder</h1>
  <p class="subtitle" id="subtitle">Spotting entries that may be duplicates, so you can review them.</p>

  <div id="loading" class="center-state">
    <div class="spinner"></div>
    <div id="loading-text">Loading entries&hellip;</div>
    <div class="scan-bar"><i id="scan-fill" style="width:0%"></i></div>
  </div>

  <div id="empty" class="center-state" hidden>
    This project has no entries yet. Add some words, then come back to check for duplicates.
  </div>

  <div id="error" class="error-box" role="alert" hidden></div>

  <main id="app" hidden>
    <div class="toolbar">
      <div class="field">
        <label for="vern-ws">Compare headwords in</label>
        <select id="vern-ws"></select>
      </div>
      <div class="field" id="anal-ws-field" hidden>
        <label for="anal-ws">Compare glosses in</label>
        <select id="anal-ws"></select>
      </div>
      <div class="field wide">
        <label for="sensitivity">Near matches</label>
        <select id="sensitivity">
          <option value="exact">Off</option>
          <option value="fold">Accents and letter case only</option>
          <option value="distance">Also one-letter spelling differences</option>
        </select>
      </div>
    </div>

    <p class="summary" id="summary"></p>
    <div id="cap-note" class="chip warn cap-note" hidden></div>

    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" type="button" role="tab" data-tab="exact" aria-selected="true">
        <span class="label"><span class="opt">Same </span>headword</span><span class="chip" id="badge-exact">0</span>
      </button>
      <button class="tab" type="button" role="tab" data-tab="near" aria-selected="false">
        <span class="label"><span class="opt">Similar </span>spelling</span><span class="chip" id="badge-near">0</span>
      </button>
      <button class="tab" type="button" role="tab" data-tab="gloss" aria-selected="false">
        <span class="label"><span class="opt">Same </span>gloss</span><span class="chip" id="badge-gloss">0</span>
      </button>
    </div>

    <p class="tab-hint" id="tab-hint"></p>
    <div class="clusters" id="clusters"></div>

    <div id="all-clear" class="celebrate" hidden>
      <div class="big">&#9989;</div>
      <div class="msg" id="all-clear-msg"></div>
      <div class="sub" id="all-clear-sub"></div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  var PAGE = 1000;              // API max per call
  var CAP = 5000;               // safety cap on entries scanned
  var MAX_COMPARISONS = 3000000; // guard for the distance-1 near-match scan
  var MAX_KEY_LEN = 45;         // skip deletion-variant indexing of very long headwords
  // Shorter words differ by one letter all the time (minimal pairs), so they only match on accents/case.
  var MIN_EDIT_LEN = 4;
  var GROUP_PAGE = 30;
  // Grammatical tags and noun-class numbers ("PST", "3SG", "17") say nothing about meaning.
  var TAG_GLOSS = /^[A-Z0-9.+:_-]+$/;
  var PREFS_KEY = 'duplicate-finder-prefs';

  var state = {
    entries: [],
    vernacular: [],   // [{wsId, name, font}]
    analysis: [],     // [{wsId, name}]
    analysisIds: [],
    vernWs: null,
    analWs: null,
    sensitivity: 'distance',
    activeTab: 'exact',
    shown: GROUP_PAGE,
    capped: false,
    nearCapped: false,
    results: {exact: [], near: [], gloss: []},
  };

  function $(id) { return document.getElementById(id); }
  var F = window.fwlite;

  function applyTheme() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', F.theme || (dark ? 'dark' : 'light'));
  }
  function showError(msg) {
    $('loading').hidden = true;
    $('app').hidden = true;
    var b = $('error'); b.hidden = false; b.textContent = msg;
  }
  function notify(msg) { try { F.notify(msg); } catch (e) { /* toast is best-effort */ } }
  function errMsg(err) { return err && err.message ? err.message : String(err); }

  // --- Text helpers ---------------------------------------------------------
  function textVal(multi, ws) {
    if (!ws || !multi || multi[ws] == null) return '';
    return F.asText(multi[ws]).trim();
  }
  // The app's headword (with affix markers, so "a-" and "a" differ) for the default vernacular;
  // other writing systems read citation form, else lexeme form.
  function headwordOf(entry) {
    if (state.vernacular[0] && state.vernWs === state.vernacular[0].wsId) return F.headword(entry);
    return textVal(entry.citationForm, state.vernWs) || textVal(entry.lexemeForm, state.vernWs);
  }
  function glossKeys(entry) {
    var keys = {};
    (entry.senses || []).forEach(function (sense) {
      state.analysisIds.forEach(function (ws) {
        var g = textVal(sense.gloss, ws);
        if (g && !TAG_GLOSS.test(g)) keys[exactKey(g)] = true;
      });
    });
    return keys;
  }
  function shareGloss(a, b) {
    var ka = a.glosses || (a.glosses = glossKeys(a.entry));
    var kb = b.glosses || (b.glosses = glossKeys(b.entry));
    return Object.keys(ka).some(function (k) { return kb[k]; });
  }
  function hasGloss(item) {
    return !!firstGlossOf(item.entry);
  }
  function firstGlossOf(entry) {
    var senses = entry.senses || [];
    for (var i = 0; i < senses.length; i++) {
      if (state.analWs) { var g = textVal(senses[i].gloss, state.analWs); if (g) return g; }
      var any = F.firstValue(senses[i].gloss || {}, state.analysisIds);
      if (any) return any;
    }
    return '';
  }
  function posOf(entry) {
    var senses = entry.senses || [];
    for (var i = 0; i < senses.length; i++) {
      var pos = senses[i].partOfSpeech;
      if (pos && pos.name) {
        var n = F.firstValue(pos.name, state.analysisIds) || Object.values(pos.name)[0];
        if (n) return n;
      }
    }
    return '';
  }

  // --- Normalization --------------------------------------------------------
  // Exact key: NFC, trimmed, whitespace-collapsed, case-folded (keeps diacritics).
  function exactKey(s) {
    return s.normalize('NFC').trim().replace(/\s+/g, ' ').toLowerCase();
  }
  // Fold key: exact key with combining diacritics stripped.
  function foldKey(exact) {
    return exact.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  // --- Loading --------------------------------------------------------------
  function fetchAll(total) {
    var target = Math.min(total, CAP);
    var out = [];
    function loadNext() {
      if (out.length >= target) return Promise.resolve(out);
      var limit = Math.min(PAGE, target - out.length);
      return F.getEntries({limit: limit, offset: out.length}).then(function (page) {
        out = out.concat(page);
        var pct = target ? Math.round(out.length / target * 100) : 100;
        $('scan-fill').style.width = pct + '%';
        $('loading-text').textContent = 'Loaded ' + out.length.toLocaleString() + ' of ' + target.toLocaleString() + ' entries…';
        if (!page.length || out.length >= target) return out;
        return loadNext();
      });
    }
    return loadNext();
  }

  // --- Union-find -----------------------------------------------------------
  function makeDSU(n) {
    var parent = new Array(n);
    for (var i = 0; i < n; i++) parent[i] = i;
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function union(a, b) { var ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }
    return {find: find, union: union};
  }

  // Bounded edit-distance check: true iff Levenshtein(a, b) <= 1. No full DP.
  function within1(a, b) {
    if (a === b) return true;
    var la = a.length, lb = b.length;
    if (Math.abs(la - lb) > 1) return false;
    if (la === lb) {
      var diff = 0;
      for (var i = 0; i < la; i++) { if (a[i] !== b[i] && ++diff > 1) return false; }
      return true;
    }
    var s = la < lb ? a : b, l = la < lb ? b : a;   // s shorter, l longer by 1
    var si = 0, li = 0, edits = 0;
    while (si < s.length && li < l.length) {
      if (s[si] === l[li]) { si++; li++; }
      else { if (++edits > 1) return false; li++; }
    }
    return true;
  }
  function deletionVariants(k) {
    var out = [];
    for (var i = 0; i < k.length; i++) out.push(k.slice(0, i) + k.slice(i + 1));
    return out;
  }

  // --- Compute clusters -----------------------------------------------------
  // Build the eligible-headword list once for the chosen vernacular WS.
  function eligibleHeadwords() {
    var list = [];
    state.entries.forEach(function (entry) {
      var hw = headwordOf(entry);
      if (!hw) return;
      var ex = exactKey(hw);
      list.push({entry: entry, hw: hw, ex: ex, fold: foldKey(ex)});
    });
    return list;
  }

  function computeExact(list) {
    var groups = {};
    list.forEach(function (item) {
      (groups[item.ex] || (groups[item.ex] = [])).push(item);
    });
    var out = [];
    Object.keys(groups).forEach(function (key) {
      var members = groups[key];
      if (members.length < 2) return;
      var sameMeaning = members.some(function (m, i) {
        return members.slice(i + 1).some(function (n) { return shareGloss(m, n); });
      });
      out.push({
        members: members,
        title: members[0].hw,
        titlePlain: false,
        strong: sameMeaning,
        tag: sameMeaning ? {cls: 'warn', label: 'Same gloss too'} : null,
      });
    });
    return out;
  }

  function computeNear(list, sensitivity) {
    state.nearCapped = false;
    if (sensitivity === 'exact' || list.length < 2) return [];

    var dsu = makeDSU(list.length);

    // Level 1: union headwords equal after accent/case folding.
    var byFold = {};
    list.forEach(function (item, idx) {
      var f = item.fold;
      if (byFold[f] === undefined) byFold[f] = idx;
      else dsu.union(byFold[f], idx);
    });

    // Level 2: union headwords within edit distance 1, via a deletion-neighbour index.
    if (sensitivity === 'distance') {
      var index = {};
      function addKey(key, idx) { (index[key] || (index[key] = [])).push(idx); }
      list.forEach(function (item, idx) {
        addKey(item.fold, idx);
        if (item.fold.length <= MAX_KEY_LEN) {
          deletionVariants(item.fold).forEach(function (v) { addKey(v, idx); });
        }
      });
      var comparisons = 0;
      var keys = Object.keys(index);
      for (var k = 0; k < keys.length && !state.nearCapped; k++) {
        var bucket = index[keys[k]];
        if (bucket.length < 2) continue;
        for (var i = 0; i < bucket.length && !state.nearCapped; i++) {
          for (var j = i + 1; j < bucket.length; j++) {
            if (dsu.find(bucket[i]) === dsu.find(bucket[j])) continue;
            var a = list[bucket[i]], b = list[bucket[j]];
            if (Array.from(a.fold).length < MIN_EDIT_LEN || Array.from(b.fold).length < MIN_EDIT_LEN) continue;
            if (++comparisons > MAX_COMPARISONS) { state.nearCapped = true; break; }
            // A one-letter difference alone is usually a different word; ask for a shared or missing gloss too.
            if (!within1(a.fold, b.fold)) continue;
            if (shareGloss(a, b) || !hasGloss(a) || !hasGloss(b)) dsu.union(bucket[i], bucket[j]);
          }
        }
      }
    }

    // Gather clusters; drop those that are purely exact duplicates (all same exact key).
    var groups = {};
    list.forEach(function (item, idx) {
      var root = dsu.find(idx);
      (groups[root] || (groups[root] = [])).push(item);
    });
    var out = [];
    Object.keys(groups).forEach(function (root) {
      var members = groups[root];
      if (members.length < 2) return;
      var firstEx = members[0].ex;
      if (members.every(function (m) { return m.ex === firstEx; })) return; // exact-only, shown elsewhere
      var firstFold = members[0].fold;
      var sameFold = members.every(function (m) { return m.fold === firstFold; });
      out.push({
        members: members,
        title: members[0].hw,
        titlePlain: false,
        tag: sameFold
          ? {cls: 'warn', label: 'Accents or case differ'}
          : {cls: 'accent', label: 'One letter differs'},
      });
    });
    return out;
  }

  function computeGloss() {
    if (!state.analWs) return [];
    var groups = {};   // glossKey -> {gloss, entries:[], ids:{}}
    state.entries.forEach(function (entry) {
      var seen = {};
      (entry.senses || []).forEach(function (sense) {
        var g = textVal(sense.gloss, state.analWs);
        if (!g || TAG_GLOSS.test(g)) return;
        var key = exactKey(g);
        if (seen[key]) return;      // count each entry once per gloss
        seen[key] = true;
        var grp = groups[key] || (groups[key] = {gloss: g, members: [], ids: {}});
        if (!grp.ids[entry.id]) { grp.ids[entry.id] = true; grp.members.push({entry: entry, hw: headwordOf(entry)}); }
      });
    });
    var out = [];
    Object.keys(groups).forEach(function (key) {
      var grp = groups[key];
      if (grp.members.length < 2) return;
      out.push({
        members: grp.members,
        title: '“' + grp.gloss + '”',
        titlePlain: true,
        tag: {cls: 'good', label: 'Shared gloss'},
      });
    });
    return out;
  }

  // Likeliest duplicates first, then most members, then alphabetically.
  function sortClusters(clusters) {
    clusters.sort(function (a, b) {
      if (!!b.strong !== !!a.strong) return b.strong ? 1 : -1;
      if (b.members.length !== a.members.length) return b.members.length - a.members.length;
      return a.title.localeCompare(b.title);
    });
    return clusters;
  }

  function computeAll() {
    var list = eligibleHeadwords();
    state.results.exact = sortClusters(computeExact(list));
    state.results.near = sortClusters(computeNear(list, state.sensitivity));
    state.results.gloss = sortClusters(computeGloss());
  }

  // --- Rendering ------------------------------------------------------------
  function countEntries(clusters) {
    var seen = {}, n = 0;
    clusters.forEach(function (c) {
      c.members.forEach(function (m) { if (!seen[m.entry.id]) { seen[m.entry.id] = true; n++; } });
    });
    return n;
  }
  function pluralGroups(n) { return n.toLocaleString() + ' group' + (n === 1 ? '' : 's'); }
  function pluralEntries(n) { return n.toLocaleString() + ' entr' + (n === 1 ? 'y' : 'ies'); }

  function renderMember(m) {
    var btn = document.createElement('button');
    btn.className = 'member';
    btn.type = 'button';

    var top = document.createElement('div');
    top.className = 'member-top';
    var hw = document.createElement('span');
    hw.className = 'hw';
    hw.textContent = m.hw || '(no headword)';
    top.appendChild(hw);
    var open = document.createElement('span');
    open.className = 'open';
    open.textContent = 'Open ↗';
    top.appendChild(open);
    btn.appendChild(top);

    var meta = document.createElement('div');
    meta.className = 'meta';
    var gloss = firstGlossOf(m.entry);
    if (gloss) { var g = document.createElement('span'); g.textContent = gloss; meta.appendChild(g); }
    else { var ng = document.createElement('span'); ng.className = 'muted'; ng.textContent = 'no gloss'; meta.appendChild(ng); }

    var pos = posOf(m.entry);
    if (pos) {
      meta.appendChild(sep());
      var p = document.createElement('span'); p.className = 'pos'; p.textContent = pos; meta.appendChild(p);
    }
    var nSenses = (m.entry.senses || []).length;
    meta.appendChild(sep());
    var sc = document.createElement('span');
    sc.textContent = nSenses + ' sense' + (nSenses === 1 ? '' : 's');
    meta.appendChild(sc);
    btn.appendChild(meta);

    btn.addEventListener('click', function () {
      try { F.openEntry(m.entry.id); } catch (e) { notify('Could not open that entry: ' + errMsg(e)); }
    });
    return btn;
  }
  function sep() { var s = document.createElement('span'); s.className = 'sep'; s.textContent = '·'; return s; }

  function renderCluster(cluster) {
    var card = document.createElement('div');
    card.className = 'cluster';

    var head = document.createElement('div');
    head.className = 'cluster-head';
    if (cluster.tag) {
      var tag = document.createElement('span');
      tag.className = 'chip ' + cluster.tag.cls;
      tag.textContent = cluster.tag.label;
      head.appendChild(tag);
    }
    var title = document.createElement('span');
    title.className = 'cluster-title' + (cluster.titlePlain ? ' plain' : '');
    title.textContent = cluster.title;
    head.appendChild(title);
    var meta = document.createElement('span');
    meta.className = 'cluster-meta';
    meta.textContent = pluralEntries(cluster.members.length);
    head.appendChild(meta);
    card.appendChild(head);

    var members = document.createElement('div');
    members.className = 'members';
    cluster.members.forEach(function (m) { members.appendChild(renderMember(m)); });
    card.appendChild(members);
    return card;
  }

  var TAB_HINTS = {
    exact: 'Entries with the same headword. Ones that also share a gloss come first; the rest may be real homographs.',
    near: 'Headwords that differ only in accents or letter case, or by one letter while sharing a gloss.',
    gloss: 'Different entries with the same gloss. Could be synonyms, or the same word entered twice.',
  };
  var ALL_CLEAR = {
    exact: {msg: 'No shared headwords.', sub: 'Every headword in this writing system is unique.'},
    near: {msg: 'No near-identical headwords.', sub: 'Nothing matched at the current sensitivity.'},
    gloss: {msg: 'No shared glosses.', sub: 'No two entries share the same gloss in this language.'},
  };

  function renderActiveTab() {
    var tab = state.activeTab;
    $('tab-hint').textContent = TAB_HINTS[tab];
    var clusters = state.results[tab];
    var host = $('clusters');
    host.innerHTML = '';

    if (tab === 'near' && state.sensitivity === 'exact') {
      host.hidden = true;
      $('all-clear').hidden = false;
      $('all-clear-msg').textContent = 'Near-match scanning is off.';
      $('all-clear-sub').textContent = 'Choose a sensitivity above to include accent/case or close-spelling matches.';
      return;
    }
    if (!clusters.length) {
      host.hidden = true;
      $('all-clear').hidden = false;
      $('all-clear-msg').textContent = ALL_CLEAR[tab].msg;
      $('all-clear-sub').textContent = ALL_CLEAR[tab].sub;
      return;
    }
    $('all-clear').hidden = true;
    host.hidden = false;
    renderClusterPage(host, clusters, 0);

    if (tab === 'near' && state.nearCapped) {
      var note = document.createElement('p');
      note.className = 'tab-hint';
      note.textContent = 'Near-match scanning stopped early on this large project, so some matches may be missing.';
      host.appendChild(note);
    }
  }

  function renderClusterPage(host, clusters, from) {
    var old = host.querySelector('.more-row');
    if (old) old.remove();
    var frag = document.createDocumentFragment();
    var to = Math.min(clusters.length, from + GROUP_PAGE);
    for (var i = from; i < to; i++) frag.appendChild(renderCluster(clusters[i]));
    var rest = clusters.length - to;
    if (rest > 0) {
      var more = document.createElement('div');
      more.className = 'more-row';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn';
      btn.textContent = 'Show ' + Math.min(GROUP_PAGE, rest) + ' more (' + rest.toLocaleString() + ' left)';
      btn.addEventListener('click', function () { renderClusterPage(host, clusters, to); });
      more.appendChild(btn);
      frag.appendChild(more);
    }
    host.appendChild(frag);
  }

  function updateBadges() {
    $('badge-exact').textContent = state.results.exact.length.toLocaleString();
    $('badge-near').textContent = state.results.near.length.toLocaleString();
    $('badge-gloss').textContent = state.results.gloss.length.toLocaleString();
  }

  function updateSummary() {
    var ex = state.results.exact, near = state.results.near, gl = state.results.gloss;
    var totalGroups = ex.length + near.length + gl.length;
    if (totalGroups === 0) {
      $('summary').innerHTML = '';
      $('summary').textContent = 'No possible duplicates found. Your lexicon looks clean.';
      return;
    }
    var parts = [];
    var strong = ex.filter(function (c) { return c.strong; }).length;
    if (ex.length) parts.push(pluralGroups(ex.length) + ' sharing a headword (' + strong.toLocaleString() + ' with the same gloss too)');
    if (near.length) parts.push(pluralGroups(near.length) + ' with similar spelling');
    if (gl.length) parts.push(pluralGroups(gl.length) + ' of shared glosses');
    var s = $('summary');
    s.innerHTML = '';
    s.appendChild(document.createTextNode('Found '));
    parts.forEach(function (p, i) {
      var b = document.createElement('b');
      // Bold only the leading count of each part for scannability.
      var m = p.match(/^(\S+\s\S+)([\s\S]*)$/);
      if (m) { b.textContent = m[1]; s.appendChild(b); s.appendChild(document.createTextNode(m[2])); }
      else { s.appendChild(document.createTextNode(p)); }
      if (i < parts.length - 1) s.appendChild(document.createTextNode(i === parts.length - 2 ? ', and ' : ', '));
    });
    s.appendChild(document.createTextNode('. Open an entry to compare and fix it by hand.'));
  }

  function refresh() {
    computeAll();
    updateBadges();
    updateSummary();
    renderActiveTab();
  }

  function savePrefs() {
    F.storage.set(PREFS_KEY, {
      vernWs: state.vernWs, analWs: state.analWs,
      sensitivity: state.sensitivity, activeTab: state.activeTab,
    }).catch(function () {});
  }

  function selectTab(tab) {
    state.activeTab = tab;
    Array.prototype.forEach.call($('tabs').querySelectorAll('.tab'), function (btn) {
      btn.setAttribute('aria-selected', btn.getAttribute('data-tab') === tab ? 'true' : 'false');
    });
    savePrefs();
    renderActiveTab();
  }

  function setVernFont() {
    var ws = state.vernacular.filter(function (w) { return w.wsId === state.vernWs; })[0];
    var font = ws && ws.font;
    document.documentElement.style.setProperty('--vern-font', (font ? '"' + font + '", ' : '') + 'inherit');
  }

  function fillSelect(select, list, chosen) {
    select.innerHTML = '';
    list.forEach(function (w) {
      var opt = document.createElement('option');
      opt.value = w.wsId;
      opt.textContent = w.name || w.wsId;
      if (w.wsId === chosen) opt.selected = true;
      select.appendChild(opt);
    });
    select.disabled = list.length <= 1;
  }

  // --- Init -----------------------------------------------------------------
  function init(context) {
    applyTheme();
    $('subtitle').textContent = 'Reviewing ' + context.project.projectName + ' for entries that may be duplicates.';

    Promise.all([
      F.getWritingSystems(),
      F.countEntries({}),
      F.storage.get(PREFS_KEY),
    ]).then(function (res) {
      var ws = res[0], total = res[1], prefs = res[2] || {};

      state.vernacular = (ws.vernacular || []).filter(function (w) { return !w.isAudio; })
        .map(function (w) { return {wsId: w.wsId, name: w.name || w.wsId, font: w.font}; });
      state.analysis = (ws.analysis || []).filter(function (w) { return !w.isAudio; })
        .map(function (w) { return {wsId: w.wsId, name: w.name || w.wsId}; });
      state.analysisIds = state.analysis.map(function (w) { return w.wsId; });

      var vernIds = state.vernacular.map(function (w) { return w.wsId; });
      state.vernWs = (prefs.vernWs && vernIds.indexOf(prefs.vernWs) >= 0) ? prefs.vernWs : (vernIds[0] || null);
      state.analWs = (prefs.analWs && state.analysisIds.indexOf(prefs.analWs) >= 0) ? prefs.analWs : (state.analysisIds[0] || null);
      if (prefs.sensitivity && ['exact', 'fold', 'distance'].indexOf(prefs.sensitivity) >= 0) state.sensitivity = prefs.sensitivity;
      if (prefs.activeTab && ['exact', 'near', 'gloss'].indexOf(prefs.activeTab) >= 0) state.activeTab = prefs.activeTab;

      if (total === 0) {
        $('loading').hidden = true;
        $('empty').hidden = false;
        return;
      }
      if (!state.vernWs) {
        showError('This project has no text vernacular writing system to compare headwords on.');
        return;
      }
      state.capped = total > CAP;

      return fetchAll(total).then(function (entries) {
        state.entries = entries;
        setVernFont();

        fillSelect($('vern-ws'), state.vernacular, state.vernWs);
        if (state.analysis.length > 1) {
          $('anal-ws-field').hidden = false;
          fillSelect($('anal-ws'), state.analysis, state.analWs);
        }
        $('sensitivity').value = state.sensitivity;

        $('vern-ws').addEventListener('change', function () {
          state.vernWs = this.value; setVernFont(); savePrefs(); refresh();
        });
        $('anal-ws').addEventListener('change', function () {
          state.analWs = this.value; savePrefs(); refresh();
        });
        $('sensitivity').addEventListener('change', function () {
          state.sensitivity = this.value; savePrefs(); refresh();
        });
        Array.prototype.forEach.call($('tabs').querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });

        if (state.capped) {
          $('cap-note').hidden = false;
          $('cap-note').textContent = 'Scanned the first ' + CAP.toLocaleString() +
            ' entries only. Duplicates beyond that are not shown.';
        }

        selectTab(state.activeTab);   // sets aria state
        refresh();
        $('loading').hidden = true;
        $('app').hidden = false;
      });
    }).catch(function (err) {
      showError('Could not scan for duplicates: ' + errMsg(err));
    });
  }

  F.ready.then(init);
})();
</script>
</body>
</html>
