<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fwlite-plugin-permissions" content="edit">
<title>Sentence Sprint</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-alt: #f4f4f5;
    --border: #e4e4e7;
    --text: #09090b;
    --text-muted: #71717a;
    --accent: #005de1;
    --accent-soft: #e8f0fd;
    --accent-fg: #ffffff;
    --good: #15803d;
    --good-soft: #e7f6ec;
    --warn: #b45309;
    --warn-soft: #fdf3e2;
    --bad: #dc2626;
    --bad-soft: #fdecec;
    --shadow: 0 1px 2px rgba(9, 9, 11, 0.06), 0 1px 3px rgba(9, 9, 11, 0.06);
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --vern-font: var(--font);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #09090b;
    --surface: #18181b;
    --surface-alt: #27272a;
    --border: #2e2e33;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --accent: #3b82f6;
    --accent-soft: #172a4d;
    --accent-fg: #ffffff;
    --good: #4ade80;
    --good-soft: #13301f;
    --warn: #fbbf24;
    --warn-soft: #3a2a0c;
    --bad: #f87171;
    --bad-soft: #3d1717;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden], .hidden { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px 24px 32px; }
  .wrap.narrow { max-width: 640px; min-height: 100dvh; display: flex; flex-direction: column; }
  .canvas { position: fixed; inset: 0; overflow: hidden; }
  h1 { font-size: 1.4rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .subtitle { color: var(--text-muted); margin: 0 0 16px; }
  .vern { font-family: var(--vern-font); }
  .muted { color: var(--text-muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 16px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-alt); }
  .btn:disabled { opacity: 0.5; cursor: default; filter: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; max-width: 100%;
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select { min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px;
    background: var(--surface-alt); color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .center-state { text-align: center; padding: 56px 16px; color: var(--text-muted); }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: var(--bad-soft); color: var(--text); border: 1px solid var(--bad); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; }
  @media (max-width: 600px) {
    .wrap { padding: 12px 12px 24px; }
    h1 { font-size: 1.2rem; }
    .wrap.narrow .actions { position: sticky; bottom: 0; margin: auto -12px -24px; padding: 12px; background: var(--bg); border-top: 1px solid var(--border); }
    .wrap.narrow .actions .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
  select, input[type="text"], textarea { width: 100%; }
  textarea { resize: vertical; min-height: 88px; }
  .field { margin-bottom: 14px; }
  label.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 0.9rem; margin: 0 0 14px; }
  label.check input { width: 18px; height: 18px; }

  .stats-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .stats-bar .chip { font-size: 0.85rem; padding: 4px 12px; }
  .stats-bar .chip b { color: var(--text); }
  .chip.streak b { color: var(--warn); }
  .chip.combo { animation: comboPulse 0.6s ease; }
  @keyframes comboPulse { 35% { transform: scale(1.12); box-shadow: 0 0 0 4px var(--accent-soft); } }
  .remaining { color: var(--text-muted); font-size: 0.85rem; margin-left: auto; }

  .target-card { margin-bottom: 12px; transition: opacity 0.22s ease, transform 0.22s ease; }
  .target-card.leaving { opacity: 0; transform: translateX(-24px); }
  .target-card.entering { opacity: 0; transform: translateX(24px); transition: none; }
  .headword { font-family: var(--vern-font); font-size: 1.8rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .sense-line { margin-top: 6px; font-size: 1.02rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  .pos { color: var(--text-muted); font-style: italic; font-size: 0.9rem; }
  .domain-chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .sentence { font-family: var(--vern-font); font-size: 1.05rem; }
  .inline-note { scroll-margin-bottom: 80px; font-size: 0.88rem; padding: 10px 12px; border-radius: var(--radius); margin-bottom: 12px; }
  .inline-note.warn { background: var(--warn-soft); color: var(--warn); }
  .inline-note.good { background: var(--good-soft); color: var(--good); }
  .hint-row { color: var(--text-muted); font-size: 0.8rem; }
  .actions { margin-top: 12px; }
  .actions .primary { flex: 1; }

  .done-card { text-align: center; padding: 28px 20px; }
  .done-card .big { font-size: 2.2rem; margin-bottom: 8px; }
  .done-stats { display: flex; justify-content: center; gap: 22px; margin: 20px 0; flex-wrap: wrap; }
  .done-stat .num { font-size: 1.5rem; font-weight: 700; color: var(--good); }
  .done-stat .lbl { font-size: 0.8rem; color: var(--text-muted); }
  .done-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #app { flex: 1; display: flex; flex-direction: column; }
  #sprint-view:not([hidden]) { flex: 1; display: flex; flex-direction: column; }
  #sprint-form { flex: 1; display: flex; flex-direction: column; }
  @media (pointer: coarse) { .hint-row { display: none; } }
  @media (max-width: 600px) {
    .wrap.narrow .card > .actions { margin: auto -16px -16px; background: var(--surface); border-radius: 0 0 var(--radius) var(--radius); }
  }
</style>
</head>
<body>
<div class="wrap narrow">
  <h1>Sentence Sprint</h1>
  <p class="subtitle">Add example sentences to senses that don't have one yet.</p>

  <div id="loading" class="center-state"><div class="spinner"></div><div id="loading-text">Loading&hellip;</div></div>
  <div id="error" class="error-box" role="alert" hidden></div>

  <main id="app" hidden>
    <section id="setup-view" class="card" hidden>
      <div class="field">
        <label for="vern-select">Write sentences in</label>
        <select id="vern-select"></select>
      </div>
      <div class="field">
        <label for="anal-select">Translate them into</label>
        <select id="anal-select"></select>
      </div>
      <div class="field">
        <label for="domain-select">Only senses in this semantic domain</label>
        <select id="domain-select"></select>
      </div>
      <label class="check"><input type="checkbox" id="content-only" checked> Skip affixes and grammatical words</label>
      <button class="btn primary" id="start-btn" type="button" style="width:100%;">Start sprint</button>
    </section>

    <section id="sprint-view" hidden>
      <div class="stats-bar">
        <span class="chip streak" title="Days in a row with at least one example added"><b id="stat-streak">0</b> day streak</span>
        <span class="chip" id="session-chip"><b id="stat-session">0</b> this session</span>
        <span class="chip" title="Examples added with this plugin on this device"><b id="stat-lifetime">0</b> in total</span>
        <span class="remaining" id="remaining"></span>
      </div>

      <div class="card target-card" id="target-card">
        <div class="headword" id="headword"></div>
        <div class="sense-line">
          <span class="chip" id="sense-tag"></span>
          <span id="gloss"></span>
          <span class="pos" id="pos"></span>
        </div>
        <div class="domain-chips" id="domain-chips"></div>
      </div>

      <form class="card" id="sprint-form" autocomplete="off">
        <div class="field">
          <label for="sentence-input" id="sentence-label">Example sentence</label>
          <textarea id="sentence-input" class="sentence" rows="3" placeholder="Write a sentence that uses this word"></textarea>
        </div>
        <div class="field">
          <label for="translation-input" id="translation-label">Translation (optional)</label>
          <input type="text" id="translation-input">
        </div>
        <div id="form-note" aria-live="polite"></div>
        <div class="hint-row">Enter adds the example. Shift+Enter starts a new line.</div>
        <div class="actions">
          <button class="btn" id="skip-btn" type="button">Skip</button>
          <button class="btn primary" id="submit-btn" type="submit">Add example</button>
        </div>
      </form>
    </section>

    <section id="done-view" class="card done-card" hidden>
      <div class="big">&#127881;</div>
      <h2 id="done-title">All caught up</h2>
      <p class="subtitle" style="margin-bottom:0;" id="done-message"></p>
      <div class="done-stats">
        <div class="done-stat"><div class="num" id="done-session">0</div><div class="lbl">added this session</div></div>
        <div class="done-stat"><div class="num" id="done-best">0</div><div class="lbl">best session</div></div>
        <div class="done-stat"><div class="num" id="done-streak">0</div><div class="lbl">day streak</div></div>
      </div>
      <div class="done-actions">
        <button class="btn" id="settings-btn" type="button">Change settings</button>
        <button class="btn primary" id="rescan-btn" type="button">Check again</button>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';

  var fwlite = window.fwlite;
  var STATS_KEY = 'sentence-sprint-stats-v1';
  var SETTINGS_KEY = 'sentence-sprint-settings-v1';
  var PAGE_SIZE = 80;
  var REFILL_THRESHOLD = 5;
  var AFFIX_TYPES = ['Prefix', 'Suffix', 'Infix', 'Circumfix', 'Simulfix', 'Suprafix', 'Clitic', 'Enclitic', 'Proclitic',
    'BoundRoot', 'BoundStem', 'PrefixingInterfix', 'InfixingInterfix', 'SuffixingInterfix'];

  var state = {
    vernWs: [],
    analWs: [],
    domains: [],
    sentenceWs: '',
    translationWs: '',
    domainCode: '',        // '' = all domains
    contentOnly: true,
    queue: [],
    seen: {},              // 'entryId:senseId' -> true
    offset: 0,
    exhausted: false,
    fetching: null,
    remaining: null,
    session: 0,
    skipped: 0,
    busy: false,
    stats: {days: {}, bestSession: 0, lifetime: 0},
  };

  function el(id) { return document.getElementById(id); }
  function show(id, visible) { el(id).hidden = !visible; }
  function errText(err) { return err && err.message ? err.message : String(err); }
  function analysisWsIds() { return state.analWs.map(function (ws) { return ws.wsId; }); }

  function applyTheme() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', fwlite.theme || (dark ? 'dark' : 'light'));
  }
  function applyVernFont(ws) {
    if (ws && ws.font) document.documentElement.style.setProperty('--vern-font', '"' + ws.font.replace(/"/g, '') + '", var(--font)');
  }

  function showError(message) {
    show('loading', false);
    show('app', false);
    show('error', true);
    el('error').textContent = message;
  }

  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    var bytes = crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    var hex = Array.from(bytes, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
  }

  function dayKey(date) {
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }
  function computeStreak(days) {
    var d = new Date();
    // A run that ended yesterday still counts (today isn't over).
    if (!days[dayKey(d)]) d.setDate(d.getDate() - 1);
    var streak = 0;
    while (days[dayKey(d)] > 0) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
  }

  // Names that occur more than once (e.g. "Sena" for both the orthography and IPA) get their wsId.
  function wsLabel(ws, list) {
    var same = list.filter(function (w) { return w.name === ws.name; }).length;
    return same > 1 ? ws.name + ' (' + ws.wsId + ')' : ws.name;
  }
  function wsById(list, id) { return list.filter(function (w) { return w.wsId === id; })[0]; }

  function isContentWord(entry, gloss) {
    if (entry.morphType && AFFIX_TYPES.indexOf(entry.morphType) >= 0) return false;
    var hw = fwlite.headword(entry);
    if (!hw || /^[-=]|[-=]$/.test(hw)) return false;
    return !gloss || !/^[A-Z0-9.+:_-]{2,}$/.test(gloss.trim());
  }

  function senseHasExampleIn(sense, wsId) {
    return (sense.exampleSentences || []).some(function (example) {
      var rich = example.sentence && example.sentence[wsId];
      return !!(rich && fwlite.asText(rich).trim());
    });
  }
  function senseInDomain(sense, code) {
    return (sense.semanticDomains || []).some(function (domain) { return domain.code === code; });
  }

  function buildQueueItems(entry) {
    var items = [];
    var senses = entry.senses || [];
    senses.forEach(function (sense, index) {
      if (senseHasExampleIn(sense, state.sentenceWs)) return;
      if (state.domainCode && !senseInDomain(sense, state.domainCode)) return;
      var gloss = fwlite.firstValue(sense.gloss || {}, analysisWsIds()) || '';
      if (state.contentOnly && !isContentWord(entry, gloss)) return;
      var key = entry.id + ':' + sense.id;
      if (state.seen[key]) return;
      state.seen[key] = true;
      items.push({
        entryId: entry.id,
        senseId: sense.id,
        headword: fwlite.headword(entry) || '(no headword)',
        gloss: gloss || fwlite.firstValue(sense.definition || {}, analysisWsIds()) || '(no gloss)',
        pos: sense.partOfSpeech ? (fwlite.firstValue(sense.partOfSpeech.name, analysisWsIds()) || '') : '',
        senseNumber: index + 1,
        senseTotal: senses.length,
        domains: (sense.semanticDomains || []).map(function (domain) {
          return domain.code + ' ' + (fwlite.firstValue(domain.name, analysisWsIds()) || '');
        }),
      });
    });
    return items;
  }

  function entryFilter() {
    var filter = {missingExampleWs: state.sentenceWs};
    if (state.domainCode) filter.semanticDomainCode = state.domainCode;
    return filter;
  }

  function refillQueue() {
    if (state.fetching) return state.fetching;
    if (state.exhausted || state.queue.length >= REFILL_THRESHOLD) return Promise.resolve();
    state.fetching = fwlite.getEntries({limit: PAGE_SIZE, offset: state.offset, filter: entryFilter()})
      .then(function (entries) {
        state.offset += entries.length;
        if (entries.length < PAGE_SIZE) state.exhausted = true;
        entries.forEach(function (entry) { state.queue = state.queue.concat(buildQueueItems(entry)); });
        state.fetching = null;
        // Pages can be all misses (senses filtered out client-side), so keep going until there's a buffer.
        if (state.queue.length < REFILL_THRESHOLD && !state.exhausted) return refillQueue();
      })
      .catch(function (err) {
        state.fetching = null;
        throw err;
      });
    return state.fetching;
  }

  function refreshRemaining() {
    fwlite.countEntries({filter: entryFilter()}).then(function (count) {
      state.remaining = count;
      renderRemaining();
    }).catch(function () { /* the count is decorative */ });
  }
  function renderRemaining() {
    el('remaining').textContent = state.remaining == null ? ''
      : 'about ' + state.remaining.toLocaleString() + (state.remaining === 1 ? ' entry' : ' entries') + ' to go';
  }

  function renderStats() {
    el('stat-streak').textContent = String(computeStreak(state.stats.days));
    el('stat-session').textContent = String(state.session);
    el('stat-lifetime').textContent = String(state.stats.lifetime);
  }

  function setFormNote(message, kind) {
    var note = el('form-note');
    note.textContent = '';
    if (!message) return;
    var div = document.createElement('div');
    div.className = 'inline-note ' + (kind || '');
    div.textContent = message;
    note.appendChild(div);
    div.scrollIntoView({block: 'nearest'});
  }

  function currentItem() { return state.queue[0] || null; }

  function renderTarget() {
    var item = currentItem();
    if (!item) return;
    el('headword').textContent = item.headword;
    el('gloss').textContent = item.gloss;
    el('pos').textContent = item.pos;
    el('sense-tag').textContent = item.senseTotal > 1 ? 'Sense ' + item.senseNumber + ' of ' + item.senseTotal : 'Sense';
    var chips = el('domain-chips');
    chips.textContent = '';
    item.domains.forEach(function (label) {
      var chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = label;
      chips.appendChild(chip);
    });
    el('sentence-input').value = '';
    el('translation-input').value = '';
    el('sentence-input').focus({preventScroll: true});
  }

  function showDone() {
    showView('done-view');
    el('done-session').textContent = String(state.session);
    el('done-best').textContent = String(state.stats.bestSession);
    el('done-streak').textContent = String(computeStreak(state.stats.days));
    el('done-title').textContent = state.skipped ? 'End of the list' : 'All caught up';
    var scope = state.domainCode ? 'in this domain' : 'in this project';
    if (state.skipped) {
      el('done-message').textContent = 'You skipped ' + state.skipped + (state.skipped === 1 ? ' sense' : ' senses') +
        '. Check again to go back to them.';
    } else {
      el('done-message').textContent = state.session > 0
        ? 'Every sense ' + scope + ' now has an example sentence. Well done.'
        : 'No senses ' + scope + ' are missing an example sentence.';
    }
  }

  function advance() {
    state.queue.shift();
    if (state.remaining != null && state.remaining > 0) {
      state.remaining--;
      renderRemaining();
    }
    var card = el('target-card');
    card.classList.add('leaving');
    setTimeout(function () {
      card.classList.remove('leaving');
      refillQueue().catch(function (err) {
        setFormNote('Could not load more entries: ' + errText(err), 'warn');
      }).then(function () {
        if (!currentItem()) { showDone(); return; }
        card.classList.add('entering');
        renderTarget();
        requestAnimationFrame(function () { card.classList.remove('entering'); });
      });
    }, 220);
  }

  function richText(text, wsId) { return {spans: [{text: text, ws: wsId}]}; }

  function recordSuccess() {
    var key = dayKey(new Date());
    state.stats.days[key] = (state.stats.days[key] || 0) + 1;
    state.stats.lifetime++;
    state.session++;
    if (state.session > state.stats.bestSession) state.stats.bestSession = state.session;
    fwlite.storage.set(STATS_KEY, state.stats).catch(function () { /* best-effort */ });
    renderStats();
    if (state.session % 5 === 0) {
      var chip = el('session-chip');
      chip.classList.remove('combo');
      void chip.offsetWidth;
      chip.classList.add('combo');
    }
  }

  function setBusy(busy) {
    state.busy = busy;
    el('submit-btn').disabled = busy;
    el('skip-btn').disabled = busy;
  }

  async function handleSubmit() {
    var item = currentItem();
    if (!item || state.busy) return;
    var sentence = el('sentence-input').value.trim();
    var translation = el('translation-input').value.trim();
    if (!sentence) {
      setFormNote('Write a sentence first.', 'warn');
      el('sentence-input').focus();
      return;
    }
    setBusy(true);
    setFormNote('');
    try {
      var before = await fwlite.getEntry(item.entryId);
      var after = before && JSON.parse(JSON.stringify(before));
      var sense = after && (after.senses || []).filter(function (s) { return s.id === item.senseId; })[0];
      if (!sense) {
        setBusy(false);
        fwlite.notify('That sense was deleted elsewhere, so it was skipped.');
        advance();
        return;
      }
      if (senseHasExampleIn(sense, state.sentenceWs)) {
        setBusy(false);
        fwlite.notify('Someone else just added an example to that sense, so it was skipped.');
        advance();
        return;
      }
      var example = {id: uuid(), senseId: sense.id, sentence: {}, translations: []};
      example.sentence[state.sentenceWs] = richText(sentence, state.sentenceWs);
      if (translation) {
        var text = {};
        text[state.translationWs] = richText(translation, state.translationWs);
        example.translations.push({id: uuid(), text: text});
      }
      sense.exampleSentences = (sense.exampleSentences || []).concat([example]);
      await fwlite.updateEntry(before, after);
      // The server-side filter now skips this entry, so the next page starts one earlier.
      if (after.senses.every(function (s) { return senseHasExampleIn(s, state.sentenceWs); })) state.offset = Math.max(0, state.offset - 1);
      setBusy(false);
      recordSuccess();
      advance();
    } catch (err) {
      setBusy(false);
      var code = err && err.code;
      if (code === 'preview') setFormNote('This is a preview, so the example was not saved. Once the plugin is added to the project, approving saves it.', 'warn');
      else if (code === 'permission-denied') setFormNote('Not saved, because the change wasn’t approved. Your sentence is still here, so you can try again or skip.', 'warn');
      else setFormNote('Could not save: ' + errText(err), 'warn');
    }
  }

  function fillWsSelect(select, systems) {
    select.textContent = '';
    systems.forEach(function (ws) {
      var option = document.createElement('option');
      option.value = ws.wsId;
      option.textContent = wsLabel(ws, systems);
      select.appendChild(option);
    });
  }

  function populateSetup() {
    fillWsSelect(el('vern-select'), state.vernWs);
    fillWsSelect(el('anal-select'), state.analWs);
    var domainSelect = el('domain-select');
    domainSelect.textContent = '';
    var all = document.createElement('option');
    all.value = '';
    all.textContent = 'Any domain';
    domainSelect.appendChild(all);
    state.domains.slice().sort(function (a, b) {
      return a.code.localeCompare(b.code, undefined, {numeric: true});
    }).forEach(function (domain) {
      var option = document.createElement('option');
      option.value = domain.code;
      option.textContent = domain.code + ' ' + (fwlite.firstValue(domain.name, analysisWsIds()) || '');
      domainSelect.appendChild(option);
    });
  }

  function applySavedSettings(saved) {
    if (!saved || typeof saved !== 'object') return;
    if (wsById(state.vernWs, saved.sentenceWs)) el('vern-select').value = saved.sentenceWs;
    if (wsById(state.analWs, saved.translationWs)) el('anal-select').value = saved.translationWs;
    if (saved.domainCode && state.domains.some(function (d) { return d.code === saved.domainCode; })) {
      el('domain-select').value = saved.domainCode;
    }
    if (typeof saved.contentOnly === 'boolean') el('content-only').checked = saved.contentOnly;
  }

  function showView(name) {
    ['setup-view', 'sprint-view', 'done-view'].forEach(function (id) { show(id, id === name); });
  }

  function startSprint() {
    state.sentenceWs = el('vern-select').value;
    state.translationWs = el('anal-select').value;
    state.domainCode = el('domain-select').value;
    state.contentOnly = el('content-only').checked;
    fwlite.storage.set(SETTINGS_KEY, {
      sentenceWs: state.sentenceWs, translationWs: state.translationWs,
      domainCode: state.domainCode, contentOnly: state.contentOnly,
    }).catch(function () { /* best-effort */ });

    var vern = wsById(state.vernWs, state.sentenceWs);
    applyVernFont(vern);
    el('sentence-label').textContent = 'Example sentence in ' + wsLabel(vern, state.vernWs);
    el('translation-label').textContent = 'Translation in ' + wsLabel(wsById(state.analWs, state.translationWs), state.analWs) + ' (optional)';

    state.queue = [];
    state.seen = {};
    state.offset = 0;
    state.exhausted = false;
    state.remaining = null;
    state.session = 0;
    state.skipped = 0;
    setFormNote('');

    showView('');
    show('loading', true);
    refreshRemaining();
    refillQueue().then(function () {
      show('loading', false);
      renderStats();
      if (!currentItem()) { showDone(); return; }
      showView('sprint-view');
      renderTarget();
    }).catch(function (err) {
      showError('Could not load entries: ' + errText(err));
    });
  }

  function wireEvents() {
    el('start-btn').addEventListener('click', startSprint);
    el('rescan-btn').addEventListener('click', startSprint);
    el('settings-btn').addEventListener('click', function () { showView('setup-view'); });
    el('sprint-form').addEventListener('submit', function (event) {
      event.preventDefault();
      handleSubmit();
    });
    el('skip-btn').addEventListener('click', function () {
      if (state.busy || !currentItem()) return;
      state.skipped++;
      setFormNote('');
      advance();
    });
    el('sentence-input').addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        handleSubmit();
      }
    });
  }

  async function init() {
    applyTheme();
    try {
      var results = await Promise.all([
        fwlite.getWritingSystems(), fwlite.getSemanticDomains(), fwlite.storage.get(STATS_KEY), fwlite.storage.get(SETTINGS_KEY),
      ]);
      state.vernWs = (results[0].vernacular || []).filter(function (ws) { return !ws.isAudio; });
      state.analWs = (results[0].analysis || []).filter(function (ws) { return !ws.isAudio; });
      state.domains = results[1] || [];
      if (results[2] && typeof results[2] === 'object') {
        state.stats = {days: results[2].days || {}, bestSession: results[2].bestSession || 0, lifetime: results[2].lifetime || 0};
      }
      if (!state.vernWs.length || !state.analWs.length) {
        showError('Sentence Sprint needs a vernacular writing system for the sentences and an analysis writing system for translations. Add the missing one in the project settings, then reopen this plugin.');
        return;
      }
      wireEvents();
      populateSetup();
      applySavedSettings(results[3]);
      show('loading', false);
      show('app', true);
      showView('setup-view');
    } catch (err) {
      showError('Could not load the project: ' + errText(err));
    }
  }

  fwlite.ready.then(init);
})();
</script>
</body>
</html>
