<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fwlite-plugin-requires" content="history">
<title>Change Review</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-alt: #f4f4f5;
    --border: #e4e4e7;
    --text: #09090b;
    --text-muted: #71717a;
    --accent: #005de1;
    --accent-soft: #e8f0fd;
    --accent-fg: #ffffff;
    --good: #15803d;
    --good-soft: #e7f6ec;
    --warn: #b45309;
    --warn-soft: #fdf3e2;
    --bad: #dc2626;
    --bad-soft: #fdecec;
    --shadow: 0 1px 2px rgba(9, 9, 11, 0.06), 0 1px 3px rgba(9, 9, 11, 0.06);
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --vern-font: var(--font);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #09090b;
    --surface: #18181b;
    --surface-alt: #27272a;
    --border: #2e2e33;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --accent: #3b82f6;
    --accent-soft: #172a4d;
    --accent-fg: #ffffff;
    --good: #4ade80;
    --good-soft: #13301f;
    --warn: #fbbf24;
    --warn-soft: #3a2a0c;
    --bad: #f87171;
    --bad-soft: #3d1717;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden], .hidden { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px 24px 32px; }
  .wrap.narrow { max-width: 640px; min-height: 100dvh; display: flex; flex-direction: column; }
  .canvas { position: fixed; inset: 0; overflow: hidden; }
  h1 { font-size: 1.4rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .subtitle { color: var(--text-muted); margin: 0 0 16px; }
  .vern { font-family: var(--vern-font); }
  .muted { color: var(--text-muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 16px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-alt); }
  .btn:disabled { opacity: 0.5; cursor: default; filter: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; max-width: 100%;
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select { min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px;
    background: var(--surface-alt); color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .center-state { text-align: center; padding: 56px 16px; color: var(--text-muted); }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: var(--bad-soft); color: var(--text); border: 1px solid var(--bad); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; }
  @media (max-width: 600px) {
    .wrap { padding: 12px 12px 24px; }
    h1 { font-size: 1.2rem; }
    .wrap.narrow .actions { position: sticky; bottom: 0; margin: auto -12px -24px; padding: 12px; background: var(--bg); border-top: 1px solid var(--border); }
    .wrap.narrow .actions .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  .headline { margin-bottom: 14px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .headline .big { font-size: 2.3rem; font-weight: 800; line-height: 1; color: var(--accent); }
  .headline.done .big { color: var(--good); }
  .headline .hbody { flex: 1; min-width: 190px; }
  .headline .hmsg { font-weight: 600; margin-bottom: 8px; }
  .headline .hsub { color: var(--text-muted); font-size: 0.85rem; margin-top: 8px; }
  .bar { background: var(--surface-alt); border-radius: 999px; height: 9px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.35s ease; }
  .headline.done .bar > i { background: var(--good); }

  .toolbar {
    position: sticky; top: 0; z-index: 6; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
    margin: 0 -24px 4px; padding: 8px 24px 10px; background: var(--bg);
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
  .toggle { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; user-select: none; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .spacer { flex: 1 1 auto; }
  .showing { color: var(--text-muted); font-size: 0.85rem; margin: 2px 2px 10px; min-height: 1em; }

  .day { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin: 16px 2px 8px; }
  ul.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .row.reviewed { opacity: 0.6; }
  .row.reviewed .head { background: var(--surface-alt); }
  .head { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; }
  .head-main { flex: 1; min-width: 0; cursor: pointer; }
  .head-main:focus-visible { border-radius: 8px; }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 0.7rem; font-weight: 700; color: #fff; }
  .author { font-weight: 600; font-size: 0.9rem; }
  .time { color: var(--text-muted); font-size: 0.85rem; }
  .cname { font-size: 0.95rem; font-weight: 600; overflow-wrap: anywhere; }
  .multi { color: var(--text-muted); font-weight: 400; font-size: 0.85rem; }
  .targets { font-size: 0.9rem; color: var(--text-muted); margin-top: 2px; overflow-wrap: anywhere; }
  .targets .hw { color: var(--text); font-weight: 600; font-family: var(--vern-font); }
  .caret { color: var(--accent); font-size: 0.85rem; font-weight: 600; margin-top: 6px; }
  .review-check {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex-shrink: 0;
    min-width: 44px; min-height: 44px; cursor: pointer; user-select: none; font-size: 0.75rem; color: var(--text-muted); font-weight: 600;
  }
  .review-check input { width: 22px; height: 22px; accent-color: var(--good); cursor: pointer; margin: 0; }

  .detail { border-top: 1px solid var(--border); padding: 14px; background: var(--surface-alt); }
  .detail .dline { font-size: 0.875rem; margin-bottom: 10px; }
  .detail .dlabel { color: var(--text-muted); }
  .entry-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .entry-chip {
    display: inline-flex; align-items: center; gap: 8px; font-size: 0.875rem; max-width: 100%;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 4px 4px 12px;
  }
  .entry-chip .hw { font-weight: 600; font-family: var(--vern-font); overflow-wrap: anywhere; }
  .entry-chip .btn { min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 0.85rem; }
  .raw-toggle { background: none; border: none; color: var(--accent); font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 8px 0; }
  .raw-toggle:hover { text-decoration: underline; }
  pre.raw {
    margin: 8px 0 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.8rem; line-height: 1.5; overflow-x: auto; max-height: 320px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .dmuted { color: var(--text-muted); font-size: 0.875rem; }
  .more { display: flex; margin: 16px auto 0; }
  .big-emoji { font-size: 2.4rem; }
  .headmsg { font-size: 1.05rem; color: var(--text); margin: 8px 0 4px; font-weight: 600; }
  .hint { max-width: 460px; margin: 0 auto; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 600px) {
    .toolbar { position: static; margin: 0 0 4px; padding: 0 0 8px; }
    .field { flex: 1 1 140px; }
    .field select { width: 100%; }
    .spacer { display: none; }
    .toolbar .actions { width: 100%; }
    .toolbar .actions .btn { flex: 1; }
    .headline .big { font-size: 1.9rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Change Review</h1>
  <p class="subtitle" id="subtitle">Work through recent changes to the dictionary and check each one off.</p>

  <div id="live" class="sr" aria-live="polite"></div>

  <div id="loading" class="center-state">
    <div class="spinner"></div>
    <div>Loading change history&hellip;</div>
  </div>

  <div id="empty" class="center-state" hidden>
    <div class="big-emoji" aria-hidden="true">&#128220;</div>
    <div class="headmsg">Change history isn&rsquo;t available for this project</div>
    <p class="hint">This project doesn&rsquo;t keep a change history, so there&rsquo;s nothing to review here. The demo project is one of these.</p>
  </div>

  <div id="error" class="error-box" role="alert" hidden></div>

  <main id="app" hidden>
    <div class="headline card" id="headline">
      <div class="big" id="headline-num">&mdash;</div>
      <div class="hbody">
        <div class="hmsg" id="headline-msg"></div>
        <div class="bar"><i id="headline-fill" style="width:0%"></i></div>
        <div class="hsub" id="headline-sub"></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="field">
        <label for="author-filter">Author</label>
        <select id="author-filter"></select>
      </div>
      <div class="field">
        <label for="type-filter">Change type</label>
        <select id="type-filter"></select>
      </div>
      <label class="toggle"><input type="checkbox" id="unreviewed-only"> Unreviewed only</label>
      <div class="spacer"></div>
      <div class="actions">
        <button class="btn" id="mark-visible" type="button">Mark shown as reviewed</button>
        <button class="btn" id="refresh" type="button">Refresh</button>
      </div>
    </div>

    <div class="showing" id="showing"></div>
    <div id="feed"></div>
    <div id="feed-empty" class="center-state" hidden></div>
  </main>
</div>

<script>
(function () {
  'use strict';

  var F = window.fwlite;
  var TAKE = 40;
  var LOAD_MORE_PAGE_CAP = 6;   // when "unreviewed only" is on, keep paging up to this many pages per click
  var RAW_CAP = 4000;           // cap raw JSON detail length
  var STATE_KEY = 'change-review-state-v1';
  var PREFS_KEY = 'change-review-prefs-v1';
  var UNKNOWN_AUTHOR_KEY = '__unknown__';
  var SYSTEM_AUTHOR_KEY = '00000000-0000-0000-0000-000000000001';
  var AVATAR_COLORS = ['#4f46e5', '#0891b2', '#059669', '#d97706', '#db2777', '#7c3aed', '#0284c7', '#65a30d'];

  var state = {
    rows: [],              // IProjectActivity[] (deduped by commitId)
    seen: {},              // commitId -> 1
    reviewed: {},          // commitId -> 1 (persisted)
    authors: [],           // {authorId?, authorName?, commitCount}
    typeLabels: {},        // changeType key -> label
    totalCommits: null,    // project-wide commit total (from authors), or null if unknown
    authorFilter: '',      // '' = all, else author filter key
    typeFilter: '',        // '' = all, else change type key
    unreviewedOnly: false,
    skip: 0,
    done: false,
    loading: false,
    detailOpen: {},
    vernIds: [],        // commitId -> 1 (which rows are expanded)
  };

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    if (text != null) e.appendChild(document.createTextNode(text));
    return e;
  }
  function $(id) { return document.getElementById(id); }
  function errMsg(err) { return err && err.message ? err.message : String(err); }
  function notify(msg) { try { F.notify(msg); } catch (e) { /* toast is best-effort */ } }
  function announce(msg) { $('live').textContent = msg; }

  function applyTheme() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', fwlite.theme || (dark ? 'dark' : 'light'));
  }
  function applyVernFont(ws) {
    if (ws && ws.font) document.documentElement.style.setProperty('--vern-font', '"' + ws.font.replace(/"/g, '') + '", var(--font)');
  }

  // --- Author helpers (mirror the app's author filter key derivation) --------
  function authorKeyOf(author) {
    if (!author) return UNKNOWN_AUTHOR_KEY;
    if (!author.authorId && !author.authorName) return UNKNOWN_AUTHOR_KEY;
    if (author.authorId) return author.authorId;
    return 'name:' + author.authorName;
  }
  function authorKeyOfActivity(activity) {
    var meta = (activity && activity.metadata) || {};
    return authorKeyOf({authorId: meta.authorId, authorName: meta.authorName});
  }
  function authorLabel(author) {
    var key = authorKeyOf(author);
    if (key === UNKNOWN_AUTHOR_KEY) return 'Unknown';
    if (key === SYSTEM_AUTHOR_KEY) return 'System';
    return author.authorName || author.authorId || 'Unknown';
  }
  function activityAuthorName(activity) {
    var meta = (activity && activity.metadata) || {};
    var key = authorKeyOfActivity(activity);
    if (key === UNKNOWN_AUTHOR_KEY) return 'Unknown';
    if (key === SYSTEM_AUTHOR_KEY) return 'System';
    return meta.authorName || meta.authorId || 'Unknown';
  }
  function initials(name) {
    if (!name) return '?';
    var parts = String(name).trim().split(/\s+/);
    var s = (parts[0] ? parts[0][0] : '') + (parts.length > 1 ? parts[parts.length - 1][0] : '');
    return s.toUpperCase() || '?';
  }
  function avatarColor(name) {
    var h = 0, str = name || '?';
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  // --- Time helpers ----------------------------------------------------------
  function relTime(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return '';
    var s = Math.floor((Date.now() - t) / 1000);
    if (s < 45) return 'just now';
    var m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24); if (d < 7) return d + 'd ago';
    return new Date(t).toLocaleDateString(undefined, {day: 'numeric', month: 'short'});
  }
  function dayLabel(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return 'Earlier';
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diff = Math.round((today - that) / 86400000);
    if (diff <= 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 7) return diff + ' days ago';
    return d.toLocaleDateString(undefined, {day: 'numeric', month: 'short', year: 'numeric'});
  }

  function humanizeType(key) {
    if (!key) return '';
    var label = key.replace(/Change$/, '').replace(/([a-z])([A-Z])/g, '$1 $2').trim();
    return label || key;
  }

  // --- Persistence -----------------------------------------------------------
  function loadReviewed(raw) {
    // Versioned envelope: {v:1, reviewed:{commitId:true}}. Tolerate older/plain shapes.
    if (raw && typeof raw === 'object') {
      if (raw.reviewed && typeof raw.reviewed === 'object') return Object.assign({}, raw.reviewed);
      if (raw.v === undefined && !raw.reviewed) return Object.assign({}, raw); // plain map fallback
    }
    return {};
  }
  function saveReviewed() {
    F.storage.set(STATE_KEY, {v: 1, reviewed: state.reviewed}).catch(function () { /* storage best-effort */ });
  }
  function loadPrefs(raw) {
    if (!raw || typeof raw !== 'object') return;
    if (typeof raw.authorFilter === 'string') state.authorFilter = raw.authorFilter;
    if (typeof raw.typeFilter === 'string') state.typeFilter = raw.typeFilter;
    if (typeof raw.unreviewedOnly === 'boolean') state.unreviewedOnly = raw.unreviewedOnly;
  }
  function savePrefs() {
    F.storage.set(PREFS_KEY, {
      v: 1,
      authorFilter: state.authorFilter,
      typeFilter: state.typeFilter,
      unreviewedOnly: state.unreviewedOnly,
    }).catch(function () {});
  }

  function reviewedCount() { return Object.keys(state.reviewed).length; }

  // --- Filtering (server params + client-side safety net) --------------------
  function serverParams() {
    var p = {take: TAKE, skip: state.skip, sort: 'NewestFirst'};
    if (state.authorFilter) p.authorFilterKeys = [state.authorFilter];
    if (state.typeFilter) p.changeTypeKeys = [state.typeFilter];
    return p;
  }
  function passesFilter(activity) {
    if (state.authorFilter && authorKeyOfActivity(activity) !== state.authorFilter) return false;
    if (state.unreviewedOnly && state.reviewed[activity.commitId]) return false;
    return true;
  }
  function visibleRows() {
    return state.rows.filter(passesFilter);
  }

  // --- Headline / progress ---------------------------------------------------
  function updateHeadline() {
    var total = state.totalCommits;
    var reviewed = reviewedCount();
    var num = $('headline-num');
    var fill = $('headline-fill');
    var msg = $('headline-msg');
    var sub = $('headline-sub');
    var headline = $('headline');

    if (total && total > 0) {
      var unreviewed = Math.max(0, total - reviewed);
      var reviewedShown = Math.min(reviewed, total);
      var pct = Math.round(reviewedShown / total * 100);
      var done = unreviewed === 0;
      headline.classList.toggle('done', done);
      num.textContent = String(unreviewed);
      fill.style.width = pct + '%';
      msg.textContent = done
        ? 'Every change has been reviewed. All caught up!'
        : unreviewed + ' change' + (unreviewed === 1 ? '' : 's') + ' still to review';
      sub.textContent = reviewedShown.toLocaleString() + ' of ' + total.toLocaleString() +
        ' change' + (total === 1 ? '' : 's') + ' reviewed (' + pct + '%)';
    } else {
      // Total unknown: fall back to what we've loaded.
      var loadedUnreviewed = state.rows.filter(function (a) { return !state.reviewed[a.commitId]; }).length;
      headline.classList.toggle('done', loadedUnreviewed === 0 && state.done && state.rows.length > 0);
      num.textContent = String(loadedUnreviewed);
      fill.style.width = '0%';
      msg.textContent = loadedUnreviewed + ' unreviewed among loaded changes';
      sub.textContent = state.done
        ? reviewed.toLocaleString() + ' reviewed so far'
        : 'Load more to see the rest. ' + reviewed.toLocaleString() + ' reviewed so far';
    }
  }

  function updateShowing() {
    var vis = visibleRows().length;
    var filtered = state.authorFilter || state.typeFilter || state.unreviewedOnly;
    $('showing').textContent = filtered
      ? 'Showing ' + vis + ' change' + (vis === 1 ? '' : 's') + ' in this view' + (state.done ? '' : ' so far')
      : '';
  }

  // --- Rendering the feed ----------------------------------------------------
  function render() {
    updateHeadline();
    updateShowing();

    var feed = $('feed');
    var emptyBox = $('feed-empty');
    feed.textContent = '';

    var rows = visibleRows();
    if (rows.length === 0) {
      feed.hidden = true;
      emptyBox.hidden = false;
      emptyBox.textContent = '';
      if (state.loading && !state.done) {
        emptyBox.appendChild(el('div', {class: 'spinner'}));
        emptyBox.appendChild(el('div', {}, 'Loading changes…'));
      } else {
        renderEmpty(emptyBox);
      }
      return;
    }
    feed.hidden = false;
    emptyBox.hidden = true;

    var groups = [], map = {};
    rows.forEach(function (a) {
      var d = dayLabel(a.timestamp);
      if (!map[d]) { map[d] = []; groups.push(d); }
      map[d].push(a);
    });
    groups.forEach(function (d) {
      feed.appendChild(el('h2', {class: 'day'}, d));
      var ul = el('ul', {class: 'feed'});
      map[d].forEach(function (a) { ul.appendChild(renderRow(a)); });
      feed.appendChild(ul);
    });

    if (!state.done) {
      var more = el('button', {class: 'btn more', type: 'button'}, 'Load more changes');
      more.addEventListener('click', loadMore);
      feed.appendChild(more);
    }
  }

  function renderEmpty(box) {
    if (state.unreviewedOnly && reviewedCount() > 0) {
      box.appendChild(el('div', {class: 'big-emoji', 'aria-hidden': 'true'}, '🎉'));
      box.appendChild(el('div', {class: 'headmsg'}, 'You’re all caught up.'));
      box.appendChild(el('div', {}, 'No unreviewed changes in this view.'));
    } else if (state.authorFilter || state.typeFilter) {
      box.appendChild(el('div', {class: 'headmsg'}, 'No changes match these filters.'));
      box.appendChild(el('div', {}, 'Try clearing the author or change-type filter.'));
    } else {
      box.appendChild(el('div', {class: 'big-emoji', 'aria-hidden': 'true'}, '📭'));
      box.appendChild(el('div', {class: 'headmsg'}, 'No changes yet'));
      box.appendChild(el('div', {}, 'When edits are made to this project, they’ll show up here to review.'));
    }
  }

  function renderRow(activity) {
    var isReviewed = !!state.reviewed[activity.commitId];
    var li = el('li', {});
    var row = el('div', {class: 'row' + (isReviewed ? ' reviewed' : '')});
    row.setAttribute('data-commit', activity.commitId);

    var head = el('div', {class: 'head'});

    // Main clickable area (expands detail)
    var main = el('div', {class: 'head-main', role: 'button', tabindex: '0'});
    main.setAttribute('aria-expanded', state.detailOpen[activity.commitId] ? 'true' : 'false');

    var meta = el('div', {class: 'meta'});
    var name = activityAuthorName(activity);
    var av = el('span', {class: 'avatar', 'aria-hidden': 'true'}, initials(name));
    av.style.background = avatarColor(name);
    meta.appendChild(av);
    meta.appendChild(el('span', {class: 'author'}, name));
    var time = el('time', {class: 'time'}, relTime(activity.timestamp));
    if (activity.timestamp) {
      time.setAttribute('datetime', activity.timestamp);
      try { time.title = new Date(activity.timestamp).toLocaleString(); } catch (e) {}
    }
    meta.appendChild(time);
    main.appendChild(meta);

    var cname = el('div', {class: 'cname'}, activity.changeName || 'Change');
    var changeCount = Array.isArray(activity.changes) ? activity.changes.length : 0;
    if (changeCount > 1) cname.appendChild(el('span', {class: 'multi'}, '  · ' + changeCount + ' changes'));
    main.appendChild(cname);

    var targets = targetEntries(activity);
    if (targets.length) {
      var line = el('div', {class: 'targets'}, 'on ');
      targets.slice(0, 3).forEach(function (name, i) {
        if (i) line.appendChild(document.createTextNode(', '));
        line.appendChild(el('span', {class: 'hw'}, name));
      });
      if (targets.length > 3) line.appendChild(document.createTextNode(' and ' + (targets.length - 3) + ' more'));
      main.appendChild(line);
    }

    var caret = el('div', {class: 'caret'}, state.detailOpen[activity.commitId] ? 'Hide details ▴' : 'Show details ▾');
    main.appendChild(caret);

    function toggleDetail() {
      if (state.detailOpen[activity.commitId]) delete state.detailOpen[activity.commitId];
      else state.detailOpen[activity.commitId] = 1;
      var open = !!state.detailOpen[activity.commitId];
      main.setAttribute('aria-expanded', open ? 'true' : 'false');
      caret.textContent = open ? 'Hide details ▴' : 'Show details ▾';
      var existing = row.querySelector('.detail');
      if (existing) existing.parentNode.removeChild(existing);
      if (open) row.appendChild(buildDetail(activity));
    }
    main.addEventListener('click', toggleDetail);
    main.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDetail(); }
    });
    head.appendChild(main);

    // Reviewed checkbox
    var check = el('label', {class: 'review-check'});
    var box = el('input', {type: 'checkbox'});
    box.checked = isReviewed;
    box.setAttribute('aria-label', 'Reviewed: ' + (activity.changeName || 'change'));
    box.addEventListener('change', function () {
      setReviewed(activity.commitId, box.checked);
      row.classList.toggle('reviewed', box.checked);
      // If we're hiding reviewed rows, a newly-reviewed row should drop out.
      if (state.unreviewedOnly && box.checked) { render(); }
      else { updateHeadline(); updateShowing(); }
    });
    check.appendChild(box);
    check.appendChild(el('span', {}, 'Reviewed'));
    head.appendChild(check);

    row.appendChild(head);
    if (state.detailOpen[activity.commitId]) row.appendChild(buildDetail(activity));
    li.appendChild(row);
    return li;
  }

  // History calls return raw entries without the computed `headword`, so fall back to the forms.
  function rawHeadword(entry) {
    return F.headword(entry) || F.firstValue(entry.citationForm, state.vernIds) || F.firstValue(entry.lexemeForm, state.vernIds) || '';
  }

  function targetEntries(activity) {
    var seen = {}, names = [];
    (Array.isArray(activity.changes) ? activity.changes : []).forEach(function (c) {
      var entry = c && c.info && c.info.entry;
      if (!entry || !entry.id || seen[entry.id]) return;
      seen[entry.id] = 1;
      names.push((entry.headword || 'Untitled entry') + (entry.homographNumber ? ' ' + entry.homographNumber : ''));
    });
    return names;
  }

  function setReviewed(commitId, on) {
    if (on) state.reviewed[commitId] = 1;
    else delete state.reviewed[commitId];
    saveReviewed();
  }

  // --- Detail (defensive rendering of a loosely-specified ChangeContext) -----
  function buildDetail(activity) {
    var detail = el('div', {class: 'detail'});
    var loading = el('div', {class: 'dmuted'}, 'Loading details…');
    detail.appendChild(loading);

    var changeIndex = 0;
    if (Array.isArray(activity.changes) && activity.changes[0] && typeof activity.changes[0].index === 'number') {
      changeIndex = activity.changes[0].index;
    }

    F.getChangeContext({commitId: activity.commitId, changeIndex: changeIndex}).then(function (ctx) {
      detail.textContent = '';
      renderDetail(detail, activity, ctx);
    }).catch(function (err) {
      detail.textContent = '';
      var box = el('div', {class: 'dmuted'});
      box.textContent = (err && err.code === 'not-supported')
        ? 'Details aren’t available for this change.'
        : 'Couldn’t load the details for this change.';
      detail.appendChild(box);
    });
    return detail;
  }

  function renderDetail(detail, activity, ctx) {
    ctx = (ctx && typeof ctx === 'object') ? ctx : {};

    var cname = ctx.changeName || activity.changeName;
    if (cname) {
      var line = el('div', {class: 'dline'});
      line.appendChild(el('span', {class: 'dlabel'}, 'Change: '));
      line.appendChild(document.createTextNode(String(cname)));
      detail.appendChild(line);
    }

    if (ctx.entityType) {
      var etype = el('div', {class: 'dline'});
      etype.appendChild(el('span', {class: 'dlabel'}, 'Affected: '));
      etype.appendChild(document.createTextNode(humanizeType(String(ctx.entityType))));
      detail.appendChild(etype);
    }

    // Affected entries -> offer Open + show headword. Degrade gracefully if none.
    var entries = Array.isArray(ctx.affectedEntries) ? ctx.affectedEntries : [];
    if (entries.length) {
      var chips = el('div', {class: 'entry-chips'});
      entries.forEach(function (entry) {
        if (!entry || typeof entry !== 'object') return;
        var chip = el('div', {class: 'entry-chip'});
        var hw = rawHeadword(entry) || 'Untitled entry';
        chip.appendChild(el('span', {class: 'hw'}, hw));
        var id = typeof entry.id === 'string' ? entry.id : null;
        if (id) {
          var open = el('button', {class: 'btn primary', type: 'button'}, 'Open');
          open.addEventListener('click', function () {
            try { F.openEntry(id, {mode: 'view'}); } catch (e) { notify('Could not open the entry.'); }
          });
          chip.appendChild(open);
        }
        chips.appendChild(chip);
      });
      if (chips.childNodes.length) detail.appendChild(chips);
    } else {
      detail.appendChild(el('div', {class: 'dmuted'}, 'No linked entry for this change.'));
    }

    // Raw snapshot (fully defensive: whatever the shape, JSON.stringify + textContent, capped).
    if (ctx.snapshot && typeof ctx.snapshot === 'object') {
      var raw = null;
      var toggle = el('button', {class: 'raw-toggle', type: 'button'}, 'Show raw change data');
      detail.appendChild(toggle);
      toggle.addEventListener('click', function () {
        if (raw) { raw.parentNode.removeChild(raw); raw = null; toggle.textContent = 'Show raw change data'; return; }
        raw = el('pre', {class: 'raw'});
        var text;
        try { text = JSON.stringify(ctx.snapshot, null, 2); } catch (e) { text = String(ctx.snapshot); }
        if (typeof text === 'string' && text.length > RAW_CAP) text = text.slice(0, RAW_CAP) + '\n… (truncated)';
        raw.textContent = text;
        detail.appendChild(raw);
        toggle.textContent = 'Hide raw change data';
      });
    }
  }

  // --- Loading pages ---------------------------------------------------------
  function loadPage() {
    return F.getActivity(serverParams()).then(function (activities) {
      activities = Array.isArray(activities) ? activities : [];
      if (activities.length < TAKE) state.done = true;
      state.skip += activities.length;
      var gained = 0;
      activities.forEach(function (a) {
        if (!a || !a.commitId) return;
        if (state.seen[a.commitId]) return;
        state.seen[a.commitId] = 1;
        state.rows.push(a);
        if (passesFilter(a)) gained++;
      });
      return gained;
    });
  }

  function loadMore() {
    if (state.loading || state.done) return;
    state.loading = true;
    var btn = $('feed').querySelector('.more');
    if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }

    // When hiding reviewed rows, one page may be entirely reviewed and add nothing
    // visible, so keep paging (up to a cap) until we surface at least one new row.
    var pagesLeft = LOAD_MORE_PAGE_CAP;
    function step() {
      return loadPage().then(function (gained) {
        pagesLeft--;
        if (!state.done && pagesLeft > 0 && state.unreviewedOnly && gained === 0) return step();
      });
    }
    step().then(function () {
      state.loading = false;
      render();
      var vis = visibleRows().length;
      announce(vis + ' change' + (vis === 1 ? '' : 's') + ' shown');
    }).catch(function (err) {
      state.loading = false;
      state.done = true;
      render();
      notify('Could not load more changes: ' + errMsg(err));
    });
  }

  // --- Reset + reload (filter change / refresh) ------------------------------
  function reload() {
    state.rows = [];
    state.seen = {};
    state.skip = 0;
    state.done = false;
    state.loading = true;
    $('feed').textContent = '';
    $('feed-empty').hidden = true;
    render();
    loadPage().then(function () {
      state.loading = false;
      render();
    }).catch(function (err) {
      state.loading = false;
      state.done = true;
      renderError(err);
    });
  }

  function renderError(err) {
    $('loading').hidden = true;
    $('app').hidden = true;
    $('empty').hidden = true;
    var box = $('error');
    box.hidden = false;
    box.textContent = (err && err.code === 'not-supported')
      ? 'Change history isn’t available for this project.'
      : 'Could not load the change history: ' + errMsg(err) + '. Reload the plugin to try again.';
  }

  function showNotSupported() {
    $('loading').hidden = true;
    $('app').hidden = true;
    $('error').hidden = true;
    $('empty').hidden = false;
  }

  // --- Filter controls -------------------------------------------------------
  function populateFilters() {
    var authorSel = $('author-filter');
    authorSel.textContent = '';
    authorSel.appendChild(new Option('All authors', ''));
    var sorted = state.authors.slice().sort(function (a, b) {
      return authorLabel(a).localeCompare(authorLabel(b));
    });
    sorted.forEach(function (a) {
      var key = authorKeyOf(a);
      var opt = new Option(authorLabel(a) + ' (' + (a.commitCount || 0) + ')', key);
      authorSel.appendChild(opt);
    });
    if (state.authorFilter && !sorted.some(function (a) { return authorKeyOf(a) === state.authorFilter; })) {
      state.authorFilter = '';
    }
    authorSel.value = state.authorFilter;

    var typeSel = $('type-filter');
    typeSel.textContent = '';
    typeSel.appendChild(new Option('All change types', ''));
    var typeList = Object.keys(state.typeLabels).map(function (k) {
      return {key: k, label: state.typeLabels[k]};
    }).sort(function (a, b) { return a.label.localeCompare(b.label); });
    typeList.forEach(function (t) { typeSel.appendChild(new Option(t.label, t.key)); });
    if (state.typeFilter && !state.typeLabels[state.typeFilter]) state.typeFilter = '';
    typeSel.value = state.typeFilter;

    $('unreviewed-only').checked = state.unreviewedOnly;
  }

  function wireControls() {
    $('author-filter').addEventListener('change', function () {
      state.authorFilter = this.value; savePrefs(); reload();
    });
    $('type-filter').addEventListener('change', function () {
      state.typeFilter = this.value; savePrefs(); reload();
    });
    $('unreviewed-only').addEventListener('change', function () {
      state.unreviewedOnly = this.checked; savePrefs(); render();
    });
    $('refresh').addEventListener('click', function () {
      var btn = this; btn.disabled = true;
      refreshTotals().then(function () { reload(); }).then(function () { btn.disabled = false; }, function () { btn.disabled = false; });
    });
    $('mark-visible').addEventListener('click', function () {
      var rows = visibleRows();
      var changed = 0;
      rows.forEach(function (a) { if (!state.reviewed[a.commitId]) { state.reviewed[a.commitId] = 1; changed++; } });
      if (changed === 0) { notify('Nothing new to mark here.'); return; }
      saveReviewed();
      render();
      notify('Marked ' + changed + ' change' + (changed === 1 ? '' : 's') + ' reviewed.');
      announce(changed + ' changes marked reviewed');
    });
  }

  function refreshTotals() {
    return Promise.all([
      F.listActivityAuthors().catch(function () { return state.authors; }),
      F.listActivityChangeTypes().catch(function () { return null; }),
    ]).then(function (res) {
      if (Array.isArray(res[0])) {
        state.authors = res[0];
        var total = 0, ok = false;
        res[0].forEach(function (a) {
          if (a && typeof a.commitCount === 'number') { total += a.commitCount; ok = true; }
        });
        state.totalCommits = ok ? total : null;
      }
      if (Array.isArray(res[1])) {
        state.typeLabels = {};
        res[1].forEach(function (t) {
          if (t && typeof t.key === 'string') state.typeLabels[t.key] = t.label || humanizeType(t.key);
        });
      }
      populateFilters();
    });
  }

  // --- Init ------------------------------------------------------------------
  function init() {
    applyTheme();
    if (F.project && F.project.projectName) {
      $('subtitle').textContent = 'Work through recent changes to ' + F.project.projectName + ' and check each one off.';
    }

    if (!F.capabilities.history) { showNotSupported(); return; }

    F.getWritingSystems().then(function (ws) {
      var vern = (ws.vernacular || []).filter(function (w) { return !w.isAudio; });
      state.vernIds = vern.map(function (w) { return w.wsId; });
      applyVernFont(vern[0]);
    }).catch(function () {});

    Promise.all([
      F.storage.get(STATE_KEY).catch(function () { return null; }),
      F.storage.get(PREFS_KEY).catch(function () { return null; }),
    ]).then(function (stored) {
      state.reviewed = loadReviewed(stored[0]);
      loadPrefs(stored[1]);

      // Authors + change types gate history support: they reject with 'not-supported'
      // when the project has no history at all.
      return Promise.all([F.listActivityAuthors(), F.listActivityChangeTypes()]);
    }).then(function (res) {
      if (Array.isArray(res[0])) {
        state.authors = res[0];
        var total = 0, ok = false;
        res[0].forEach(function (a) {
          if (a && typeof a.commitCount === 'number') { total += a.commitCount; ok = true; }
        });
        state.totalCommits = ok ? total : null;
      }
      if (Array.isArray(res[1])) {
        res[1].forEach(function (t) {
          if (t && typeof t.key === 'string') state.typeLabels[t.key] = t.label || humanizeType(t.key);
        });
      }

      populateFilters();
      wireControls();

      $('loading').hidden = true;
      $('app').hidden = false;

      // First page of the feed.
      state.loading = true;
      render();
      return loadPage().then(function () {
        state.loading = false;
        render();
      });
    }).catch(function (err) {
      if (err && err.code === 'not-supported') showNotSupported();
      else renderError(err);
    });
  }

  F.ready.then(init);
})();
</script>
</body>
</html>
