<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reversal Index</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-alt: #f4f4f5;
    --border: #e4e4e7;
    --text: #09090b;
    --text-muted: #71717a;
    --accent: #005de1;
    --accent-soft: #e8f0fd;
    --accent-fg: #ffffff;
    --good: #15803d;
    --good-soft: #e7f6ec;
    --warn: #b45309;
    --warn-soft: #fdf3e2;
    --bad: #dc2626;
    --bad-soft: #fdecec;
    --shadow: 0 1px 2px rgba(9, 9, 11, 0.06), 0 1px 3px rgba(9, 9, 11, 0.06);
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --vern-font: var(--font);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #09090b;
    --surface: #18181b;
    --surface-alt: #27272a;
    --border: #2e2e33;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --accent: #3b82f6;
    --accent-soft: #172a4d;
    --accent-fg: #ffffff;
    --good: #4ade80;
    --good-soft: #13301f;
    --warn: #fbbf24;
    --warn-soft: #3a2a0c;
    --bad: #f87171;
    --bad-soft: #3d1717;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden], .hidden { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px 24px 32px; }
  .wrap.narrow { max-width: 640px; min-height: 100dvh; display: flex; flex-direction: column; }
  .canvas { position: fixed; inset: 0; overflow: hidden; }
  h1 { font-size: 1.4rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .subtitle { color: var(--text-muted); margin: 0 0 16px; }
  .vern { font-family: var(--vern-font); }
  .muted { color: var(--text-muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 16px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-alt); }
  .btn:disabled { opacity: 0.5; cursor: default; filter: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; max-width: 100%;
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select { min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px;
    background: var(--surface-alt); color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .center-state { text-align: center; padding: 56px 16px; color: var(--text-muted); }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: var(--bad-soft); color: var(--text); border: 1px solid var(--bad); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; }
  @media (max-width: 600px) {
    .wrap { padding: 12px 12px 24px; }
    h1 { font-size: 1.2rem; }
    .wrap.narrow .actions { position: sticky; bottom: 0; margin: auto -12px -24px; padding: 12px; background: var(--bg); border-top: 1px solid var(--border); }
    .wrap.narrow .actions .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  /* Letter pages */
  :root { --serif: Charter, "Bitstream Charter", "Sitka Text", Georgia, "Times New Roman", serif; --vern-font: var(--serif); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
  .field.grow { flex: 1 1 220px; }
  .field.grow input { width: 100%; }
  .print-col { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .print-hint { font-size: 0.78rem; color: var(--text-muted); }
  @media (max-width: 600px) {
    .controls { gap: 10px; }
    .controls .field:not(.grow) { flex: 1 1 40%; }
    .controls select { width: 100%; }
    .controls .field.grow { flex: 1 1 200px; }
    .print-hint, .print-wide { display: none; }
    .toggle { flex: 1 1 50%; }
  }
  .status { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 10px; min-height: 1.2em; }
  .linkish { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .letters { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; margin-bottom: 12px; background: var(--bg); }
  .letters button {
    font: inherit; font-weight: 600; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
  }
  .letters button:hover { background: var(--accent-soft); }
  .letters button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 800; }
  @media (pointer: coarse) { .letters button { min-width: 40px; height: 40px; } }
  @media (min-width: 768px) { .letters.sticky { position: sticky; top: 0; z-index: 5; } }
  .letter-head { font-size: 1.5rem; margin: 0 0 8px; scroll-margin-top: var(--letters-h, 0px); }
  .letter-head:focus { outline: none; }
  .letter-head .n { font-size: 0.9rem; font-weight: 400; color: var(--text-muted); margin-left: 6px; }
  .pager { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-top: 16px; }
  .pager .btn { flex: 1 1 0; }
  .pager .top { flex: 0 0 auto; }
  .more { width: 100%; margin-top: 12px; }

  /* Print: an offscreen, mm-sized copy is paginated by measuring, so guide words match the printed pages. */
  #print-root { position: absolute; left: -10000px; top: 0; width: 178mm; visibility: hidden; }
  .psheet { width: 178mm; padding: 0; background: #fff; color: #000; font-family: var(--serif); font-size: 10pt; line-height: 1.3; }
  .psheet + .psheet { margin-top: 10mm; }
  .pband { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1.5pt solid #000; padding-bottom: 1.5mm; margin-bottom: 3mm; height: 9mm; overflow: hidden; }
  .pband .gw { font-weight: 700; font-size: 11pt; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  .pband .gt { font-size: 8pt; color: #555; }
  .pbody { columns: 2; column-gap: 7mm; column-rule: 0.5pt solid #bbb; column-fill: auto; height: 225mm; overflow: hidden; }
  .pdiv { break-inside: avoid; break-after: avoid; font-weight: 700; font-size: 13pt; border-bottom: 0.5pt solid #bbb; margin: 2mm 0 1.5mm; }
  .pdiv:first-child { margin-top: 0; }
  @page { margin: 18mm 16mm; }
  @media print {
    html, body { background: #fff !important; min-height: 0; }
    .wrap { display: none !important; }
    #print-root { position: static; visibility: visible; }
    .psheet + .psheet { margin-top: 0; }
    .psheet { break-after: page; }
    .psheet:last-child { break-after: auto; }
  }
  .toggle { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; font-size: 0.9rem; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
  .index { padding: 16px 24px 20px; }
  @media (max-width: 600px) { .index { padding: 12px 14px 16px; } }
  .index .letter-head { color: var(--accent); border-bottom: 2px solid var(--border); padding-bottom: 4px; margin-bottom: 10px; }
  .index + .index { margin-top: 16px; }
  .words { columns: 2; column-gap: 36px; }
  @media (max-width: 700px) { .words { columns: 1; } }
  .rev-word { break-inside: avoid; margin: 0 0 10px; line-height: 1.4; }
  .rev-term { font-weight: 700; }
  .rev-refs { padding-left: 16px; }
  .ref {
    font: inherit; font-family: var(--vern-font); color: var(--accent); background: none; border: 0;
    padding: 4px 0; margin: 0; cursor: pointer; text-align: left;
  }
  .ref:hover { text-decoration: underline; }
  .ref sup, .pref sup { font-size: 0.7em; line-height: 0; }
  .ref-pos { font-style: italic; color: var(--text-muted); font-size: 0.85em; margin-left: 3px; }
  .ref-sep { color: var(--text-muted); }

  .pentry { break-inside: avoid; margin: 0 0 1.2mm; padding-left: 4mm; text-indent: -4mm; }
  .pentry .t { font-weight: 700; }
  .pentry .h { font-family: var(--vern-font); }
  .pentry .p { font-style: italic; color: #444; font-size: 0.9em; margin-left: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Reversal Index</h1>
  <p class="subtitle" id="subtitle">Meanings in alphabetical order, each pointing back to the words that mean it.</p>
  <div id="loading" class="center-state"><div class="spinner"></div><div id="loading-text">Loading&hellip;</div></div>
  <div id="error" class="error-box" role="alert" hidden></div>
  <div id="empty" class="center-state" hidden>No entries yet. Add some in FW Lite, then reload.</div>
  <main id="app" hidden>
    <div class="controls">
      <div class="field">
        <label for="ws-select">Index language</label>
        <select id="ws-select"></select>
      </div>
      <label class="toggle"><input type="checkbox" id="defs-toggle"> Include words from definitions</label>
      <div class="field grow">
        <label for="search">Find a meaning</label>
        <input id="search" type="search" placeholder="Type a meaning" autocomplete="off">
      </div>
      <div class="print-col">
        <button class="btn primary" id="print-btn" type="button" title="Prints every letter">Print<span class="print-wide">&nbsp;or save PDF</span></button>
        <span class="print-hint" id="print-hint">Prints every letter.</span>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <nav class="letters" id="letters" aria-label="Letters"></nav>
    <div id="view"></div>
  </main>
</div>
<div id="print-root" aria-hidden="true"></div>

<script>
(function () {
  'use strict';
  var fwlite = window.fwlite;
  var LETTER_PAGE = 300, SEARCH_CAP = 300;
  // Dropped when splitting English meanings into words; the whole phrase ("to run") is always indexed too.
  var EN_STOPWORDS = {a: 1, an: 1, the: 1, to: 1, of: 1, in: 1, on: 1, at: 1, by: 1, for: 1, and: 1, or: 1,
    is: 1, are: 1, be: 1, as: 1, it: 1, its: 1, that: 1, this: 1, with: 1};
  function applyTheme() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', fwlite.theme || (dark ? 'dark' : 'light'));
  }
  function applyVernFont(ws) {
    if (ws && ws.font) document.documentElement.style.setProperty('--vern-font', '"' + ws.font.replace(/"/g, '') + '", var(--serif)');
  }

  var PAGE = 1000, CAP = 5000;
  async function loadAll(onProgress, cap) {
    cap = cap || CAP;
    var total = await fwlite.countEntries({});
    var target = Math.min(total, cap);
    var entries = [];
    while (entries.length < target) {
      var page = await fwlite.getEntries({limit: Math.min(PAGE, target - entries.length), offset: entries.length});
      if (!page.length) break;
      entries = entries.concat(page);
      if (onProgress) onProgress(entries.length, target);
    }
    return {entries: entries, total: total, capped: total > cap};
  }

  function el(id) { return document.getElementById(id); }
  function make(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function lowerIn(locale, t) { try { return t.toLocaleLowerCase(locale || undefined); } catch (e) { return t.toLowerCase(); } }
  function upperIn(locale, t) { try { return t.toLocaleUpperCase(locale || undefined); } catch (e) { return t.toUpperCase(); } }
  // Only the listed writing systems, never a fallback to "any key": that could be an audio file name.
  function textIn(ms, wsList) {
    if (!ms) return '';
    for (var i = 0; i < wsList.length; i++) {
      var t = fwlite.asText(ms[wsList[i]]);
      if (t) return t.normalize('NFC');
    }
    return '';
  }
  function makeCollator(locale) {
    try { return new Intl.Collator(locale || undefined, {sensitivity: 'base', numeric: true, ignorePunctuation: true}); }
    catch (e) { return new Intl.Collator(undefined, {sensitivity: 'base', numeric: true, ignorePunctuation: true}); }
  }
  // Accent- and case-insensitive form for search.
  function fold(locale, t) { return lowerIn(locale, t.normalize('NFD').replace(/\p{M}/gu, '')); }

  // The letter a word files under: the longest alphabet (exemplar) match, so "ng" wins over "n";
  // otherwise its first letter without accents. Leading "-", "=", "*" and the like are skipped.
  function makeAlphabet(exemplars, locale, collator) {
    var order = [];
    (exemplars || []).forEach(function (e) {
      var k = lowerIn(locale, String(e).normalize('NFC').trim());
      if (k && order.indexOf(k) < 0) order.push(k);
    });
    var longestFirst = order.slice().sort(function (a, b) { return Array.from(b).length - Array.from(a).length; });
    function keyOf(text) {
      var t = lowerIn(locale, String(text || '').normalize('NFC')).replace(/^[^\p{L}\p{N}]+/u, '');
      for (var i = 0; i < longestFirst.length; i++) if (t.indexOf(longestFirst[i]) === 0) return longestFirst[i];
      var first = Array.from(t)[0] || '';
      if (!/\p{L}/u.test(first)) return '#';
      return Array.from(first.normalize('NFD'))[0];
    }
    function label(key) {
      if (key === '#') return '#';
      var cs = Array.from(key);
      return upperIn(locale, cs[0]) + cs.slice(1).join('');
    }
    function compare(a, b) {
      if (a === b) return 0;
      if (a === '#') return 1;
      if (b === '#') return -1;
      var ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia >= 0 && ib >= 0) return ia - ib;
      return collator.compare(a, b) || (a < b ? -1 : 1);
    }
    return {keyOf: keyOf, label: label, compare: compare};
  }

  // Groups sorted items into [{key, label, items}] in alphabet order.
  function groupByLetter(items, alphabet, wordOf) {
    var map = {}, keys = [];
    items.forEach(function (it) {
      var k = alphabet.keyOf(wordOf(it));
      if (!map[k]) { map[k] = []; keys.push(k); }
      map[k].push(it);
    });
    keys.sort(alphabet.compare);
    return keys.map(function (k) { return {key: k, label: alphabet.label(k), items: map[k]}; });
  }

  function renderLetterBar(bar, sections, currentKey, onPick) {
    bar.textContent = '';
    bar.hidden = sections.length < 2;
    sections.forEach(function (sec) {
      var b = make('button', null, sec.label);
      b.type = 'button';
      b.setAttribute('aria-label', sec.label + ', ' + sec.items.length.toLocaleString());
      if (sec.key === currentKey) b.setAttribute('aria-current', 'true');
      b.addEventListener('click', function () { onPick(sec.key); });
      bar.appendChild(b);
    });
    // Sticky only while it stays short; a 4-row bar would eat the screen.
    bar.classList.toggle('sticky', bar.offsetHeight > 0 && bar.offsetHeight <= 96);
    document.documentElement.style.setProperty('--letters-h', (bar.classList.contains('sticky') ? bar.offsetHeight : 0) + 'px');
  }

  // Lays items out on fixed-size print sheets, measuring as it goes so each sheet's guide words are
  // its real first and last word. items: {divider: label} | {node: () => Element, guide: text}.
  function paginate(root, items, title) {
    root.textContent = '';
    var cur;
    function newSheet() {
      var sheet = make('div', 'psheet');
      var band = make('div', 'pband');
      var g1 = make('span', 'gw'), g2 = make('span', 'gw');
      band.appendChild(g1); band.appendChild(make('span', 'gt', title)); band.appendChild(g2);
      var body = make('div', 'pbody');
      sheet.appendChild(band); sheet.appendChild(body);
      root.appendChild(sheet);
      cur = {body: body, g1: g1, g2: g2, first: '', last: ''};
    }
    function finish() { cur.g1.textContent = cur.first; cur.g2.textContent = cur.last; }
    function overflowed() { return cur.body.scrollWidth > cur.body.clientWidth + 1 || cur.body.scrollHeight > cur.body.clientHeight + 1; }
    newSheet();
    items.forEach(function (item) {
      var node = item.divider ? make('div', 'pdiv', item.divider) : item.node();
      cur.body.appendChild(node);
      if (cur.body.childNodes.length > 1 && overflowed()) {
        cur.body.removeChild(node);
        var last = cur.body.lastChild;
        var carry = !item.divider && last && last.className === 'pdiv' && cur.body.childNodes.length > 1 ? last : null;
        if (carry) cur.body.removeChild(carry);
        finish();
        newSheet();
        if (carry) cur.body.appendChild(carry);
        cur.body.appendChild(node);
      }
      if (!item.divider) { if (!cur.first) cur.first = item.guide; cur.last = item.guide; }
    });
    finish();
    return root.childNodes.length;
  }

  var state = {
    entries: [], records: [], sections: [], letter: null, query: '',
    ws: '', vernacular: [], analysis: [], posById: {}, includeDefs: false,
    alphabet: null, projectName: '', capped: false, total: 0,
  };

  function posLabel(sense) {
    var pos = sense.partOfSpeech || state.posById[sense.partOfSpeechId];
    if (!pos) return '';
    var langs = [state.ws].concat(state.analysis.map(function (w) { return w.wsId; }));
    return textIn(pos.abbreviation, langs) || textIn(pos.name, langs);
  }

  function rebuild() {
    var ws = state.ws, records = {};
    var stop = /^en\b/i.test(ws) ? EN_STOPWORDS : {};
    var vernCollator = makeCollator(state.vernacular.length ? state.vernacular[0].wsId : '');
    function add(surface, entry, pos) {
      var key = lowerIn(ws, surface);
      var rec = records[key] || (records[key] = {key: key, find: fold(ws, surface), surfaces: {}, refs: {}, refList: []});
      rec.surfaces[surface] = (rec.surfaces[surface] || 0) + 1;
      var ref = rec.refs[entry.id];
      if (!ref) {
        ref = rec.refs[entry.id] = {id: entry.id, hw: fwlite.headword(entry).normalize('NFC'), homograph: entry.homographNumber || 0, pos: []};
        rec.refList.push(ref);
      }
      if (pos && ref.pos.indexOf(pos) < 0) ref.pos.push(pos);
    }
    function indexMeaning(text, entry, pos) {
      var phrase = text.trim().replace(/\s+/g, ' ');
      if (!phrase) return;
      add(phrase, entry, pos);
      var words = phrase.split(/[^\p{L}\p{M}\p{N}]+/u).filter(Boolean);
      if (words.length > 1) words.forEach(function (w) { if (!stop[lowerIn(ws, w)]) add(w, entry, pos); });
    }
    state.entries.forEach(function (entry) {
      if (!fwlite.headword(entry)) return;
      (entry.senses || []).forEach(function (sense) {
        var pos = posLabel(sense);
        indexMeaning(textIn(sense.gloss, [ws]), entry, pos);
        if (state.includeDefs) indexMeaning(textIn(sense.definition, [ws]), entry, pos);
      });
    });
    var collator = makeCollator(ws);
    var list = Object.keys(records).map(function (k) {
      var rec = records[k], best = '', n = -1;
      Object.keys(rec.surfaces).forEach(function (s) { if (rec.surfaces[s] > n) { n = rec.surfaces[s]; best = s; } });
      rec.display = best;
      rec.refList.sort(function (a, b) { return vernCollator.compare(a.hw, b.hw) || a.homograph - b.homograph; });
      return rec;
    });
    list.sort(function (a, b) { return collator.compare(a.display, b.display) || (a.display < b.display ? -1 : 1); });
    var wsMeta = state.analysis.find(function (w) { return w.wsId === ws; });
    state.alphabet = makeAlphabet(wsMeta && wsMeta.exemplars, ws, collator);
    state.records = list;
    state.sections = groupByLetter(list, state.alphabet, function (r) { return r.display; });
    if (!state.sections.some(function (s) { return s.key === state.letter; })) state.letter = state.sections.length ? state.sections[0].key : null;
    render();
  }

  function refLabel(parent, ref) {
    parent.appendChild(document.createTextNode(ref.hw || '—'));
    if (ref.homograph) parent.appendChild(make('sup', null, String(ref.homograph)));
  }

  function renderWord(rec) {
    var word = make('div', 'rev-word');
    word.appendChild(make('div', 'rev-term', rec.display));
    var refs = make('div', 'rev-refs');
    rec.refList.forEach(function (ref, i) {
      if (i) refs.appendChild(make('span', 'ref-sep', ', '));
      var b = make('button', 'ref');
      b.type = 'button';
      refLabel(b, ref);
      b.addEventListener('click', function () {
        Promise.resolve(fwlite.openEntry(ref.id)).catch(function () { fwlite.notify('Could not open that entry.'); });
      });
      refs.appendChild(b);
      if (ref.pos.length) refs.appendChild(make('span', 'ref-pos', ref.pos.join(', ')));
    });
    word.appendChild(refs);
    return word;
  }

  function printWord(rec) {
    var div = make('div', 'pentry');
    div.appendChild(make('span', 't', rec.display));
    div.appendChild(document.createTextNode('  '));
    rec.refList.forEach(function (ref, i) {
      if (i) div.appendChild(document.createTextNode(', '));
      var h = make('span', 'h');
      refLabel(h, ref);
      div.appendChild(h);
      if (ref.pos.length) div.appendChild(make('span', 'p', ref.pos.join(', ')));
    });
    return div;
  }

  function letterPage(sec, count) {
    var page = make('section', 'card index');
    var head = make('h2', 'letter-head', sec.label);
    head.tabIndex = -1;
    head.appendChild(make('span', 'n', count.toLocaleString() + (count === 1 ? ' word' : ' words')));
    page.appendChild(head);
    var list = make('div', 'words');
    page.appendChild(list);
    return {page: page, head: head, list: list};
  }

  function render() {
    var view = el('view');
    view.textContent = '';
    var q = state.query ? fold(state.ws, state.query.normalize('NFC')) : '';
    renderLetterBar(el('letters'), state.sections, q ? null : state.letter, pickLetter);
    if (!state.records.length) {
      el('status').textContent = '';
      view.appendChild(make('div', 'center-state', state.includeDefs
        ? 'No glosses or definitions in this language yet. Pick another language above.'
        : 'No glosses in this language yet. Pick another language, or include words from definitions.'));
      return;
    }
    if (q) return renderSearch(view, q);
    var idx = state.sections.findIndex(function (s) { return s.key === state.letter; });
    var sec = state.sections[idx];
    var parts = [state.records.length.toLocaleString() + ' index words'];
    if (state.capped) parts.push('from the first ' + CAP.toLocaleString() + ' of ' + state.total.toLocaleString() + ' entries');
    el('status').textContent = parts.join(' ');
    var p = letterPage(sec, sec.items.length);
    view.appendChild(p.page);
    var more = make('button', 'btn more');
    more.type = 'button';
    p.page.appendChild(more);
    var shown = 0;
    function showMore() {
      sec.items.slice(shown, shown + LETTER_PAGE).forEach(function (r) { p.list.appendChild(renderWord(r)); });
      shown = Math.min(sec.items.length, shown + LETTER_PAGE);
      more.hidden = shown >= sec.items.length;
      more.textContent = 'Show more ' + sec.label + ' (' + (sec.items.length - shown).toLocaleString() + ' left)';
    }
    more.addEventListener('click', showMore);
    showMore();
    view.appendChild(pager(idx));
    return p.head;
  }

  function renderSearch(view, q) {
    var hits = state.records.filter(function (r) { return r.find.indexOf(q) >= 0; });
    var status = el('status');
    status.textContent = hits.length
      ? (hits.length > SEARCH_CAP ? 'Showing the first ' + SEARCH_CAP + ' of ' + hits.length.toLocaleString() + ' matches. Type more to narrow it down. '
        : hits.length.toLocaleString() + (hits.length === 1 ? ' match' : ' matches') + ' in all letters. ')
      : 'No matches in any letter for “' + state.query + '”. ';
    var clear = make('button', 'linkish', 'Clear search');
    clear.type = 'button';
    clear.addEventListener('click', function () { el('search').value = ''; state.query = ''; render(); });
    status.appendChild(clear);
    groupByLetter(hits.slice(0, SEARCH_CAP), state.alphabet, function (r) { return r.display; }).forEach(function (sec) {
      var p = letterPage(sec, sec.items.length);
      sec.items.forEach(function (r) { p.list.appendChild(renderWord(r)); });
      view.appendChild(p.page);
    });
  }

  function pager(idx) {
    var row = make('nav', 'pager');
    row.setAttribute('aria-label', 'Previous and next letter');
    var prev = state.sections[idx - 1], next = state.sections[idx + 1];
    if (prev) row.appendChild(navButton('‹ ' + prev.label, prev.key));
    var top = make('button', 'btn ghost top', 'All letters ↑');
    top.type = 'button';
    top.addEventListener('click', function () {
      var cur = el('letters').querySelector('[aria-current="true"]');
      el('letters').scrollIntoView({block: 'start'});
      if (cur) cur.focus();
    });
    if (state.sections.length > 1) row.appendChild(top);
    if (next) row.appendChild(navButton(next.label + ' ›', next.key));
    return row;
  }
  function navButton(text, key) {
    var b = make('button', 'btn', text);
    b.type = 'button';
    b.addEventListener('click', function () { pickLetter(key); });
    return b;
  }

  function pickLetter(key) {
    state.letter = key;
    if (state.query) { state.query = ''; el('search').value = ''; }
    persist();
    var head = render();
    if (head) { head.scrollIntoView({block: 'start'}); head.focus({preventScroll: true}); }
  }

  function persist() {
    fwlite.storage.set('prefs', {analysisWs: state.ws, includeDefs: state.includeDefs, letter: state.letter}).catch(function () {});
  }

  function buildPrint() {
    var items = [];
    state.sections.forEach(function (sec) {
      items.push({divider: sec.label});
      sec.items.forEach(function (r) { items.push({guide: r.display, node: function () { return printWord(r); }}); });
    });
    return paginate(el('print-root'), items, state.projectName);
  }

  function wire() {
    el('ws-select').addEventListener('change', function () { state.ws = this.value; persist(); rebuild(); });
    el('defs-toggle').addEventListener('change', function () { state.includeDefs = this.checked; persist(); rebuild(); });
    var timer = null;
    el('search').addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { state.query = el('search').value.trim(); render(); }, 150);
    });
    el('print-btn').addEventListener('click', function () {
      buildPrint();
      try { window.print(); } catch (e) { fwlite.notify('Could not open the print dialog. Press Ctrl+P (Cmd+P on a Mac) instead.'); }
    });
    window.addEventListener('beforeprint', function () { if (!el('print-root').childNodes.length) buildPrint(); });
    window.addEventListener('afterprint', function () { el('print-root').textContent = ''; });
  }

  fwlite.ready.then(async function (context) {
    applyTheme();
    try {
      state.projectName = context.project.projectName;
      var res = await Promise.all([fwlite.getWritingSystems(), fwlite.getPartsOfSpeech(), fwlite.storage.get('prefs').catch(function () { return null; })]);
      var ws = res[0], prefs = res[2] || {};
      state.vernacular = (ws.vernacular || []).filter(function (w) { return !w.isAudio; });
      state.analysis = (ws.analysis || []).filter(function (w) { return !w.isAudio; });
      res[1].forEach(function (pos) { state.posById[pos.id] = pos; });
      state.ws = state.analysis.some(function (w) { return w.wsId === prefs.analysisWs; }) ? prefs.analysisWs : (state.analysis[0] || {}).wsId;
      state.includeDefs = !!prefs.includeDefs;
      state.letter = prefs.letter || null;
      if (!state.ws) {
        el('loading').hidden = true;
        el('empty').textContent = 'This project has no analysis writing system to index meanings in. Add one in FieldWorks, then reload.';
        el('empty').hidden = false;
        return;
      }
      applyVernFont(state.vernacular[0]);
      var loaded = await loadAll(function (n, of) {
        el('loading-text').textContent = 'Loaded ' + n.toLocaleString() + ' of ' + of.toLocaleString() + ' entries…';
      });
      el('loading').hidden = true;
      if (!loaded.entries.length) { el('empty').hidden = false; return; }
      state.entries = loaded.entries;
      state.capped = loaded.capped;
      state.total = loaded.total;
      if (/Android/i.test(navigator.userAgent)) el('print-hint').textContent = 'Prints every letter. If nothing happens, print from FW Lite on a computer.';
      var select = el('ws-select');
      state.analysis.forEach(function (w) {
        var opt = make('option', null, w.name || w.wsId);
        opt.value = w.wsId;
        select.appendChild(opt);
      });
      select.value = state.ws;
      select.disabled = state.analysis.length <= 1;
      el('defs-toggle').checked = state.includeDefs;
      wire();
      el('app').hidden = false;
      rebuild();
    } catch (err) {
      el('loading').hidden = true;
      el('error').textContent = 'Could not build the reversal index: ' + (err && err.message ? err.message : String(err));
      el('error').hidden = false;
    }
  });
})();
</script>
</body>
</html>
