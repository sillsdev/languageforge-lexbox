version: 3
output: prefixed
tasks:
  app:
    interactive: true
    deps: [ install ]
    cmd: pnpm run dev
  run:
    interactive: true
    cmd: pnpm run dev
  storybook:
    interactive: true
    cmd: pnpm storybook {{.CLI_ARGS}}
  check:
    aliases: [ sc, svelte-check ]
    deps: [ install ]
    ignore_error: true
    cmds:
      - pnpm run --filter viewer check
      - pnpm run --filter viewer lint
  build:
    deps: [ install ]
    cmd: pnpm run build
  watch:
    deps: [ install ]
    cmd: pnpm run build --watch

  i18n:
    cmd: pnpm i18n:extract

  install:
    method: checksum
    sources:
      - package.json
      - ../pnpm-lock.yaml
      - ../pnpm-workspace.yaml
    cmds:
      - pnpm install
  test:
    cmd: pnpm test
  test-unit:
    desc: 'Vitest unit project only (jsdom; no browser, storybook or launcher projects).'
    cmd: pnpm run test:unit --run {{.CLI_ARGS}}

  verify:
    silent: true
    desc: 'Pre-done gate for the viewer: svelte-check, eslint, vitest unit, i18n extract drift. Stops at the first failure (~4 min).'
    deps: [ install ]
    cmds:
      - pnpm run check
      - echo "verify(viewer) svelte-check OK"
      - pnpm run lint
      - echo "verify(viewer) eslint OK"
      - task: test-unit
      - echo "verify(viewer) vitest unit OK"
      # Same check as CI (fw-lite.yaml): en.po must not change when strings are re-extracted.
      # Compares before/after hashes, so an extract you have already run but not committed still passes.
      - |
        before=$(git hash-object src/locales/en.po)
        pnpm i18n:extract
        if [ "$(git hash-object src/locales/en.po)" != "$before" ]; then
          echo "verify(viewer) i18n FAILED: pnpm i18n:extract changed src/locales/en.po; review and commit src/locales"
          exit 1
        fi
        echo "verify(viewer) i18n extract OK"

  test:ui:
    desc: 'runs UI tests against already running server'
    cmd: pnpm run test:ui {{.CLI_ARGS}}
  test:ui-standalone:
    aliases: [pts]
    desc: 'UI tests with an auto-started dev server (port 5173, or FwLite__DevAssetsPort). Filter: `-- sort.test.ts --project=chromium`; `--ui` for UI mode, `--update-snapshots` to refresh visual baselines'
    env:
      AUTO_START_SERVER: true
    cmd: pnpm run test:ui {{.CLI_ARGS}}
  generate-marketing-screenshots:
    desc: 'they should be in the screenshots folder'
    env:
      AUTO_START_SERVER: true
      MARKETING_SCREENSHOTS: true
    cmd: pnpm run test:ui snapshots {{.CLI_ARGS}}

  test:e2e:
    cmd: pnpm run test:e2e {{.CLI_ARGS}}
  test:launcher:
    desc: 'tests the fw lite launcher class against a real subprocess; FW_LITE_BINARY_PATH must point to a built binary'
    cmd: pnpm test:launcher --run
  test:build-launcher:
    desc: 'publishes a self-contained FwLiteWeb binary into ./dist/fw-lite-server; prerequisite for test:e2e and test:launcher'
    deps: [build]
    cmds:
      - dotnet publish ../../backend/FwLite/FwLiteWeb/FwLiteWeb.csproj --configuration Release --self-contained --output ./dist/fw-lite-server
