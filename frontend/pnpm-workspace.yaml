packages:
  - https-proxy
  - viewer

# explicitly prevent using packages that are too new
minimumReleaseAge: 1440

# pnpm 12 no longer reads these from .npmrc; they must live here.
# include the root (frontend) project in recursive runs, e.g. `pnpm run -r build`
includeWorkspaceRoot: true
# we commonly add packages to the root package.json (aka frontend/package.json)
ignoreWorkspaceRootCheck: true
engineStrict: true

# https://pnpm.io/global-virtual-store
# Why use it now with AI https://pnpm.io/git-worktrees#why-this-matters-even-more-with-ai-agents
virtualStoreType: global

overrides:
  "cookie": "^0.7.0"
  "@types/mjml-core": "^4.15.2"
  "minimatch@9": "^9.0.7"
  "immutable@3": "^3.8.3"

# vaul-svelte@1.0.0-next.7 imports bits-ui but forgot to declare it. The old
# hoisted virtual store exposed it anyway; the global virtual store isolates
# vaul-svelte to its declared deps, so declare the missing peer here.
packageExtensions:
  vaul-svelte:
    peerDependencies:
      bits-ui: "^2.0.0"

catalog:
  '@playwright/test': ^1.62.1
  '@stylistic/eslint-plugin': ^5.10.0
  '@sveltejs/vite-plugin-svelte': ^7.2.0
  '@typescript-eslint/parser': ^8.66.0
  '@vitejs/plugin-basic-ssl': ^2.3.0
  '@vitest/browser': ^4.1.10
  '@vitest/browser-playwright': ^4.1.10
  '@vitest/ui': ^4.1.10
  autoprefixer: ^10.5.4
  eslint: ^10.8.0
  eslint-output: ^4.1.0
  eslint-plugin-svelte: ^3.22.0
  playwright: ^1.62.1
  postcss: ^8.5.26
  runed: ^0.37.1
  svelte: ^5.56.8
  svelte-check: ^4.7.5
  svelte-eslint-parser: ^1.8.0
  svelte-exmarkdown: ^5.0.2
  svelte-preprocess: ^6.0.5
  tailwindcss: ^3.4.17
  tslib: ^2.8.1
  typescript: ^5.9.3
  typescript-eslint: ^8.66.0
  vite: ^8.2.1
  vitest: ^4.1.10

allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  svelte-preprocess: true
