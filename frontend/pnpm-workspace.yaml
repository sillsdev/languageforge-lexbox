packages:
  - https-proxy
  - viewer

# explicitly prevent using packages that are too new
minimumReleaseAge: 1440

# pnpm 12 no longer reads these from .npmrc; they must live here.
# include the root (frontend) project in recursive runs, e.g. `pnpm run -r build`
includeWorkspaceRoot: true
# we commonly add packages to the root package.json (aka frontend/package.json)
ignoreWorkspaceRootCheck: true
engineStrict: true

# Host/worktrees: global. Docker sets PNPM_CONFIG_VIRTUAL_STORE_TYPE=project
# so node_modules/.pnpm is materialized inside /app and COPY works.
# (pnpm validates this enum before ${...} expansion, so interpolation cannot
# be used here — https://pnpm.io/settings#virtualstoretype)
# https://pnpm.io/global-virtual-store
# Why use it now with AI https://pnpm.io/git-worktrees#why-this-matters-even-more-with-ai-agents
virtualStoreType: global

overrides:
  "cookie": "^0.7.0"
  "@types/mjml-core": "^4.15.2"
  "minimatch@9": "^9.0.7"
  "immutable@3": "^3.8.3"

# vaul-svelte@1.0.0-next.7 imports bits-ui but forgot to declare it. The old
# hoisted virtual store exposed it anyway; the global virtual store isolates
# vaul-svelte to its declared deps, so declare the missing peer here.
packageExtensions:
  vaul-svelte:
    peerDependencies:
      bits-ui: "^2.0.0"

catalog:
  '@playwright/test': ^1.63.0
  '@stylistic/eslint-plugin': ^5.10.0
  '@sveltejs/vite-plugin-svelte': ^7.3.0
  '@typescript-eslint/parser': ^8.70.1
  '@vitejs/plugin-basic-ssl': ^2.3.0
  '@vitest/browser': ^5.0.1
  '@vitest/browser-playwright': ^5.0.1
  '@vitest/ui': ^5.0.1
  autoprefixer: ^10.6.1
  eslint: ^10.11.0
  eslint-output: ^4.1.0
  eslint-plugin-svelte: ^3.23.0
  playwright: ^1.62.1
  postcss: ^8.5.28
  runed: ^0.37.1
  svelte: ^5.57.1
  svelte-check: ^4.7.6
  svelte-eslint-parser: ^1.8.1
  svelte-exmarkdown: ^5.0.2
  svelte-preprocess: ^6.0.5
  tailwindcss: ^4.3.3
  tslib: ^2.8.1
  typescript: ^7.0.2
  typescript-eslint: ^8.70.1
  vite: ^8.3.0
  vitest: ^5.0.1

allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  svelte-preprocess: true
