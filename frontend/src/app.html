<!DOCTYPE html >
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />

        <title>Lexbox</title>
        <link rel="icon" href="%sveltekit.assets%/images/logo-dark.png">
        <link rel="icon" href="%sveltekit.assets%/images/logo-light.png" media="(prefers-color-scheme: dark)">

        <script>
            // Put a proxy in place before svelte assigns it to it's native_fetch variable
            // https://github.com/sveltejs/kit/issues/9530
            // This allows us to intercept SK's fetches
            const _fetch = window.fetch;
            window.lexbox = {};
            window.lexbox.fetchProxy = (...args) => _fetch(...args);
            window.fetch = (...args) => window.lexbox.fetchProxy(...args);
            // OpenTelemetry's browser OTLP exporter sends trace batches via `globalThis.fetch.__original`
            // when that property exists, so its own export request bypasses fetch instrumentation.
            // Without this it would be traced -> exported -> traced, in an endless loop (the exporter
            // switched from an untraced sendBeacon transport to fetch in @opentelemetry/otlp-exporter-base
            // >= 0.217). Our proxy replaces the fetch reference the exporter reads, so we re-expose the
            // native fetch here to preserve that escape hatch. Keep this whenever the proxy is changed.
            window.fetch.__original = _fetch;
        </script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">
            %sveltekit.body%
        </div>
	</body>
</html>
