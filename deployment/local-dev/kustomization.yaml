apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: languagedepot

resources:
- ../base/
#- secrets.yaml
- traefik/traefik.yaml
- gateway.yaml
- db-secrets.yaml
- lf-classic-secrets.yaml
- hgresume-secrets.yaml
- self-signed-ssl.yaml
- pgadmin-deployment.yaml

components:
  - ../init-repos

secretGenerator:
  - name: otel
    namespace: languagedepot
    behavior: create
    envs:
      - local.env
  - name: google
    namespace: languagedepot
    behavior: create
    envs:
      - local.env

patches:
  - target:
      version: v1
      kind: PersistentVolumeClaim
    path: change-storage-class.patch.yaml
  - target:
      kind: Issuer
    path: delete-oauth-certs.yaml
  - target:
      kind: Certificate
      name: oauth-.*
    path: delete-oauth-certs.yaml
  - target:
      kind: CronJob
      name: oauth-cert-retainer
    path: delete-oauth-cert-retainer.yaml
  - target:
      kind: ServiceAccount
      name: oauth-cert-retainer
    path: delete-oauth-cert-retainer.yaml
  - target:
      kind: Role
      name: oauth-cert-retainer
    path: delete-oauth-cert-retainer.yaml
  - target:
      kind: RoleBinding
      name: oauth-cert-retainer
    path: delete-oauth-cert-retainer.yaml

  - path: app-config.yaml
  - path: fw-headless-deployment.patch.yaml
  - path: lexbox-deployment.patch.yaml
  - path: ui-deployment.patch.yaml
  - path: hg-repos-pvc.patch.yaml
  - path: lexbox-service.patch.yaml
  - path: http-routes.patch.yaml
    target:
      kind: HTTPRoute
