apiVersion: apps/v1
kind: Deployment
metadata:
  name: hg
  namespace: languagedepot
spec:
  template:
    spec:
      initContainers:
        - name: populate-test-repos
          securityContext:
            runAsUser: 33
            runAsGroup: 33 # www-data
            runAsNonRoot: true
          # busybox base image with the seed repo zips baked into /init-repos.
          # Published by .github/workflows/build-test-repos.yaml; refresh with a
          # manual run of that workflow. Everything references :latest.
          image: ghcr.io/sillsdev/lexbox-test-repos:latest
          imagePullPolicy: Always
          command:
            - 'sh'
            - '-c'
            - |
              set -eu
              # Extract a seed repo into the hgweb bucket unless it's already
              # there. Fails loudly (rather than leaving hg to 404 later) if a
              # zip is missing or doesn't contain a valid Mercurial repo.
              extract() {
                name="$1"    # repo directory name
                bucket="$2"  # hgweb bucket subdir (first letter of the code)
                zip="$3"     # zip file baked into the image
                target="/repos/$bucket/$name"
                if [ -d "$target/.hg" ]; then
                  echo "$name already present, skipping"
                  return
                fi
                echo "Extracting $name from $zip ..."
                rm -rf "$target"          # clear any partial/corrupt extract
                mkdir -p "/repos/$bucket"
                unzip -q "/init-repos/$zip" -d "/repos/$bucket/"
                if [ ! -d "$target/.hg" ]; then
                  echo "ERROR: $zip did not produce a valid $name repo" >&2
                  exit 1
                fi
              }
              extract sena-3         s sena-3.zip
              extract elawa-dev-flex e elawa.zip
              extract empty-dev-flex e empty.zip
          volumeMounts:
            - name: repos
              mountPath: /repos
