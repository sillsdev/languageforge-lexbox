# fixed NodePorts that gha/kind.yaml maps to localhost:6579 (http) and localhost:6580 (https)
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: languagedepot
spec:
  type: NodePort
  ports:
  - name: web
    port: 80
    protocol: TCP
    nodePort: 30080
  - name: websecure
    port: 443
    protocol: TCP
    nodePort: 30443
