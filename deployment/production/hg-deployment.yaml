apiVersion: apps/v1
kind: Deployment
metadata:
  name: hg
  namespace: languagedepot
spec:
  template:
    spec:
      containers:
        - name: hgweb
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
          env:
            - name: HGWEB_MEMORY_LIMIT
              value: "1048576000" # the 1000Mi limit above, in bytes
        - name: hgresumable
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
