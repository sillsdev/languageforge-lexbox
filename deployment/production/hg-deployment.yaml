apiVersion: apps/v1
kind: Deployment
metadata:
  name: hg
  namespace: languagedepot
spec:
  template:
    spec:
      containers:
        - name: hgweb
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
        - name: hgresumable
          # Keep production on the pre-rewrite image until the new hgresume is validated elsewhere.
          image: ghcr.io/sillsdev/hgresume:v2024-05-28
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
