components:
  schemas:
    ChangeEntityOfServerJsonChange:
      required:
        - index
        - commitId
        - entityId
        - change
      type: object
      properties:
        index:
          pattern: '^-?(?:0|[1-9]\d*)$'
          anyOf:
            - type: integer
            - type: string
          format: int32
        commitId:
          type: string
          format: uuid
        entityId:
          type: string
          format: uuid
        change:
          oneOf:
            - enum:
                - null
              nullable: true
            - $ref: '#/components/schemas/ServerJsonChange'
        authoredModelVersion:
          pattern: '^-?(?:0|[1-9]\d*)$'
          anyOf:
            - type: integer
            - type: string
          format: int32
    ChangesResult:
      required:
        - missingFromClient
        - serverSyncState
      type: object
      properties:
        missingFromClient:
          type: array
          items:
            $ref: '#/components/schemas/ServerCommit'
        serverSyncState:
          $ref: '#/components/schemas/SyncState'
    ClientState:
      required:
        - clientId
        - maxTimestamp
        - commitCount
        - hash
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        maxTimestamp:
          pattern: '^-?(?:0|[1-9]\d*)$'
          anyOf:
            - type: integer
            - type: string
          format: int64
        commitCount:
          pattern: '^-?(?:0|[1-9]\d*)$'
          anyOf:
            - type: integer
            - type: string
          format: int32
        hash:
          pattern: '^-?(?:0|[1-9]\d*)$'
          anyOf:
            - type: integer
            - type: string
          format: uint64
        onlyHasTimestamp:
          type: boolean
    CommitMetadata:
      type: object
      properties:
        authorName:
          type: string
